<title>QA in the AI Era — by Nadav Katz</title>
<style>
  :root {
    --paper: #eceff4; --card: #ffffff; --ink: #141b28; --muted: #57616f; --faint: #808b99;
    --line: #d7dbe3; --line-strong: #c1c8d2; --signal: #b23c1c; --signal-soft: #f3e3dc;
    --bar: #354154; --bar-track: #dde1e8; --tag-bg: #e6e9ef; --field: #f6f7fa;
    --shadow: 0 1px 2px rgba(20,27,40,.05), 0 14px 30px -20px rgba(20,27,40,.30);
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Cascadia Code", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d131e; --card: #151d2b; --ink: #e7ebf2; --muted: #9aa4b3; --faint: #6f7a8a;
      --line: #24303f; --line-strong: #33404f; --signal: #f07040; --signal-soft: #2a1a12;
      --bar: #6d8199; --bar-track: #202b3a; --tag-bg: #1d2634; --field: #101825;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 36px -22px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"] {
    --paper: #eceff4; --card: #ffffff; --ink: #141b28; --muted: #57616f; --faint: #808b99;
    --line: #d7dbe3; --line-strong: #c1c8d2; --signal: #b23c1c; --signal-soft: #f3e3dc;
    --bar: #354154; --bar-track: #dde1e8; --tag-bg: #e6e9ef; --field: #f6f7fa;
    --shadow: 0 1px 2px rgba(20,27,40,.05), 0 14px 30px -20px rgba(20,27,40,.30);
  }
  :root[data-theme="dark"] {
    --paper: #0d131e; --card: #151d2b; --ink: #e7ebf2; --muted: #9aa4b3; --faint: #6f7a8a;
    --line: #24303f; --line-strong: #33404f; --signal: #f07040; --signal-soft: #2a1a12;
    --bar: #6d8199; --bar-track: #202b3a; --tag-bg: #1d2634; --field: #101825;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 36px -22px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); line-height: 1.62;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); }

  /* ---- Masthead ---- */
  .masthead {
    border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
  }
  .masthead .bar { max-width: 940px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
  .brand .mark { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .brand .mark .dot { color: var(--signal); }
  .nav { display: flex; align-items: center; gap: 18px; }
  .nav a { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; color: var(--muted); text-decoration: none; cursor: pointer; }
  .nav a:hover { color: var(--signal); }
  .nav .cta { color: var(--ink); border: 1px solid var(--line-strong); border-radius: 3px; padding: 5px 11px; }
  .nav .cta:hover { border-color: var(--signal); color: var(--signal); }
  @media (max-width: 720px) { .nav .hidephone { display: none; } }

  /* ---- Hero ---- */
  .hero { padding: 74px 0 30px; }
  @media (max-width: 640px) { .hero { padding: 48px 0 24px; } }
  .hero .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 0 0 20px; }
  .hero h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(34px, 6.2vw, 56px); line-height: 1.05; letter-spacing: -.018em; text-wrap: balance; margin: 0; }
  .hero h1 .hl { color: var(--signal); font-style: italic; }
  .hero .deck { font-size: clamp(18px, 2.3vw, 21px); color: var(--muted); max-width: 33em; margin: 24px 0 0; }
  .hero .meta { margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 10px 20px; font-family: var(--mono); font-size: 12.5px; color: var(--faint); letter-spacing: .04em; }
  .hero .meta b { color: var(--signal); font-weight: 600; }

  .sec-h { max-width: 940px; margin: 0 auto; padding: 40px 24px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h h2 { font-family: var(--mono); font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); font-weight: 600; margin: 0; }
  .sec-h .note { font-family: var(--mono); font-size: 12px; color: var(--faint); }

  .feature-wrap { max-width: 940px; margin: 0 auto; padding: 8px 24px 0; }
  .feature {
    display: block; text-decoration: none; cursor: pointer; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 34px 34px 30px; border-left: 3px solid var(--signal);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .feature:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(20,27,40,.05), 0 22px 44px -22px rgba(20,27,40,.4); }
  .feature .row { display: flex; gap: 10px; align-items: center; margin: 0 0 16px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); background: var(--signal-soft); border-radius: 99px; padding: 3px 10px; }
  .tag.plain { color: var(--muted); background: var(--tag-bg); }
  .feature .issue { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .08em; }
  .feature h3 { font-family: var(--serif); font-weight: 620; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; margin: 0 0 12px; }
  .feature p { font-size: 18px; color: var(--muted); margin: 0 0 18px; max-width: 40em; }
  .feature .go { font-family: var(--mono); font-size: 13px; color: var(--signal); letter-spacing: .04em; }

  .list { max-width: 940px; margin: 0 auto; padding: 6px 24px 0; }
  .post {
    display: grid; grid-template-columns: 84px 1fr auto; gap: 4px 22px; align-items: start;
    text-decoration: none; cursor: pointer; text-align: left; width: 100%; background: none; border: 0;
    padding: 26px 0; border-top: 1px solid var(--line);
  }
  .post:hover h3 { color: var(--signal); }
  .post .num { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--faint); letter-spacing: .06em; padding-top: 3px; }
  .post .body { grid-column: 2; }
  .post .body .row { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; flex-wrap: wrap; }
  .post h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.16; letter-spacing: -.01em; margin: 0 0 6px; transition: color .12s; }
  .post p { font-size: 16px; color: var(--muted); margin: 0; max-width: 42em; }
  .post .rt { grid-column: 3; font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; padding-top: 3px; }
  @media (max-width: 620px) {
    .post { grid-template-columns: 1fr; }
    .post .num { padding-top: 0; }
    .post .body, .post .rt { grid-column: 1; }
    .post .rt { padding-top: 6px; }
  }

  .upcoming { max-width: 940px; margin: 0 auto; padding: 8px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .up { border: 1px dashed var(--line-strong); border-radius: 5px; padding: 16px 18px; }
  .up .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 7px; }
  .up p { font-family: var(--serif); font-size: 16px; margin: 0; color: var(--muted); line-height: 1.35; }

  /* ---- About / consulting ---- */
  .about { border-top: 1px solid var(--line-strong); margin-top: 56px; background: var(--card); }
  .about .in { max-width: 720px; margin: 0 auto; padding: 52px 24px; }
  .about .k { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin: 0 0 16px; }
  .about h2 { font-family: var(--serif); font-weight: 620; font-size: clamp(24px, 3.6vw, 30px); line-height: 1.16; letter-spacing: -.012em; text-wrap: balance; margin: 0 0 16px; }
  .about p { font-size: 18px; color: var(--muted); margin: 0 0 16px; }
  .about p b { color: var(--ink); font-weight: 600; }
  .about .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .btn { font-family: var(--mono); font-size: 13px; letter-spacing: .03em; text-decoration: none; border-radius: 4px; padding: 11px 18px; cursor: pointer; border: 1px solid transparent; }
  .btn.primary { background: var(--signal); color: #fff; border-color: var(--signal); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--signal); color: var(--signal); }

  footer.site { border-top: 1px solid var(--line); }
  footer.site .in { max-width: 940px; margin: 0 auto; padding: 26px 24px 56px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer.site p { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .03em; margin: 0; }

  /* ---- Article view ---- */
  .article { padding: 44px 0 20px; }
  .backlink { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-decoration: none; letter-spacing: .04em; display: inline-block; margin-bottom: 30px; cursor: pointer; }
  .backlink:hover { color: var(--signal); }
  .article .head .row { display: flex; gap: 10px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
  .article h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(30px, 5.2vw, 46px); line-height: 1.07; letter-spacing: -.02em; text-wrap: balance; margin: 0 0 16px; }
  .article .dek { font-family: var(--serif); font-size: clamp(19px, 2.6vw, 22px); color: var(--muted); margin: 0 0 26px; max-width: 34em; line-height: 1.45; }
  .article .byline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--faint); letter-spacing: .04em; padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 34px; }
  .article .byline b { color: var(--ink); font-weight: 600; }
  .article .byline .sep { opacity: .5; }

  .article .body { font-size: 19px; }
  .article .body > *:first-child { margin-top: 0; }
  .article .body p { margin: 0 0 20px; }
  .article .body p.lead { font-size: 21px; }
  .article .body h2 { font-family: var(--serif); font-weight: 620; font-size: clamp(23px, 3.4vw, 28px); line-height: 1.18; letter-spacing: -.01em; text-wrap: balance; margin: 40px 0 14px; }
  .article .body h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 30px 0 8px; letter-spacing: -.005em; }
  .article .body em { font-style: italic; }
  .article .body strong { font-weight: 620; }
  .article .body a { color: var(--signal); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .article .body ul { margin: 0 0 20px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .article .body ul li { position: relative; padding-left: 26px; }
  .article .body ul li::before { content: "→"; position: absolute; left: 0; top: 0; font-family: var(--mono); color: var(--signal); font-size: 15px; }
  .article .body ol { margin: 0 0 20px; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; }
  .article .body ol li { padding-left: 6px; }
  .article .body ol li::marker { font-family: var(--mono); font-weight: 600; color: var(--signal); }
  .article .body blockquote { margin: 28px 0; padding: 4px 0 4px 22px; border-left: 3px solid var(--signal); font-family: var(--serif); font-size: 22px; line-height: 1.32; letter-spacing: -.01em; color: var(--ink); }
  .article .body blockquote em { color: var(--signal); font-style: italic; }
  .article .body code { font-family: var(--mono); font-size: .84em; background: var(--tag-bg); border-radius: 3px; padding: 2px 6px; }
  .article .body .callout { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--signal); border-radius: 4px; padding: 18px 20px; margin: 26px 0; box-shadow: var(--shadow); }
  .article .body .callout p { margin: 0; font-size: 16.5px; }
  .article .body .callout .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); display: block; margin-bottom: 8px; }
  .toolrow { display: grid; grid-template-columns: 150px 1fr; gap: 6px 20px; padding: 16px 0; border-top: 1px solid var(--line); }
  .toolrow .t { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink); }
  .toolrow .t .role { display: block; font-weight: 400; font-size: 11.5px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
  .toolrow .d { font-family: var(--serif); font-size: 16.5px; color: var(--muted); }
  .toolrow .d b { color: var(--ink); font-weight: 600; }
  @media (max-width: 560px) { .toolrow { grid-template-columns: 1fr; } }

  .statband { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: baseline; margin: 26px 0 30px; padding: 22px 0; border-block: 1px solid var(--line-strong); }
  .statband .s { display: flex; flex-direction: column; gap: 3px; }
  .statband .s .n { font-family: var(--mono); font-weight: 600; font-size: 27px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .statband .s .n em { color: var(--signal); font-style: normal; }
  .statband .s .l { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  /* ---- Share row ---- */
  .share { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
  .share .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
  .sbtn { font-family: var(--mono); font-size: 12.5px; letter-spacing: .03em; cursor: pointer; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line-strong); border-radius: 99px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .sbtn:hover { border-color: var(--signal); color: var(--signal); }
  .sbtn svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---- Comments ---- */
  .comments { margin-top: 46px; padding-top: 30px; border-top: 1px solid var(--line-strong); }
  .comments .h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .comments .h h3 { font-family: var(--serif); font-size: 22px; font-weight: 620; margin: 0; }
  .comments .h .c { font-family: var(--mono); font-size: 13px; color: var(--faint); }
  .comments .disc { font-family: var(--sans); font-size: 12.5px; color: var(--faint); margin: 0 0 22px; line-height: 1.5; }
  .cform { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .cform .two { display: flex; gap: 10px; flex-wrap: wrap; }
  .cform .two input { flex: 1; min-width: 160px; }
  .field { font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line-strong); border-radius: 5px; padding: 11px 13px; width: 100%; }
  .field:focus { outline: 2px solid var(--signal); outline-offset: 1px; border-color: var(--signal); }
  textarea.field { min-height: 90px; resize: vertical; font-family: var(--sans); line-height: 1.5; }
  .cform .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .clist { display: flex; flex-direction: column; gap: 16px; }
  .cmt { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
  .cmt .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .cmt .who { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }
  .cmt .when { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .cmt .txt { font-family: var(--serif); font-size: 16px; color: var(--muted); margin: 0; white-space: pre-wrap; }
  .cempty { font-family: var(--serif); font-size: 16px; color: var(--faint); font-style: italic; }

  .article .authorcard { margin-top: 46px; padding: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
  .article .authorcard .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .article .authorcard h4 { font-family: var(--serif); font-size: 20px; font-weight: 620; margin: 0 0 8px; }
  .article .authorcard p { font-family: var(--serif); font-size: 16px; color: var(--muted); margin: 0 0 16px; }
  .article .authorcard .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .article .more { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line-strong); }
  .article .more .k { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--signal); margin: 0 0 14px; }

  /* ---- Generic page (contact / talks) ---- */
  .page { padding: 54px 0 20px; }
  .page .k { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin: 0 0 16px; }
  .page h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(30px, 5vw, 44px); line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; margin: 0 0 16px; }
  .page .lede { font-size: 19px; color: var(--muted); margin: 0 0 30px; max-width: 36em; }
  .page .lede b { color: var(--ink); font-weight: 600; }

  .talk { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: start; padding: 24px 0; border-top: 1px solid var(--line); }
  .talk .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .talk .meta .kind { color: var(--signal); }
  .talk h3 { font-family: var(--serif); font-size: 21px; font-weight: 620; margin: 0 0 8px; letter-spacing: -.01em; }
  .talk p { font-size: 16.5px; color: var(--muted); margin: 0; max-width: 44em; }
  .talk .act { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  .talk .act .btn { white-space: nowrap; }
  .talk .act .soon { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 8px 12px; }
  @media (max-width: 560px) { .talk { grid-template-columns: 1fr; } .talk .act { grid-column: 1; grid-row: auto; margin-top: 6px; } }

  .contact-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 34px; align-items: start; }
  @media (max-width: 680px) { .contact-grid { grid-template-columns: 1fr; gap: 26px; } }
  .contact-side .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 22px 22px; margin-bottom: 16px; }
  .contact-side .box .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
  .contact-side .box p { font-size: 15.5px; color: var(--muted); margin: 0 0 8px; }
  .contact-side .box a { color: var(--signal); text-decoration: none; font-family: var(--mono); font-size: 13.5px; }
  .contact-side .box a:hover { text-decoration: underline; }

      body: `
        <p class="lead">When AI writes the code, the bottleneck stops being <em>writing</em> and becomes <em>verifying</em>. I learned this the expensive way. Over two months building a real product almost entirely with AI, I shipped 217 commits. Fifty-two of them — roughly one in four — were bug fixes. When I lined all fifty-two up, they weren't random. They told a single, uncomfortable story.</p>
        <div class="statband">

        <h2>The AI didn't write bad code. It wrote plausible code.</h2>
        <p>Plausible code fails in a specific place: exactly where the model had no way to check itself. It can't see the messy real page a user is on. It can't feel the app change between yesterday and today. It can't stand at the seam where two systems hand off. And it never notices the failure it didn't imagine. My fifty-two bugs clustered into those four blind spots.</p>
        <h3>1. It tests the happy path it imagined — not the mess that's real.</h3>
        <p>The AI wrote a price parser against clean, invented HTML. Real stores don't cooperate: a price of <code>2,969</code> was read as <code>296</code> because the parser choked on a comma. Right-to-left Hebrew rendered backwards. Bot-blocked shops returned a bare "no price." None of it appeared in the world the model pictured.</p>
        <h3>2. It reasons about one moment — not an app living over time.</h3>
        <p>A single request looked perfect. State across sessions is where it broke: the all-time-low price was lost on refresh, so "price dropped" badges vanished. Single-page navigation didn't re-trigger detection. A cached page served a stale price on the second check.</p>
        <h3>3. It can't stand at the seam between two systems.</h3>
        <p>The nastiest bugs lived <em>between</em> systems, where the model could only ever see one side. A stray space in a payment credential took <strong>four</strong> commits to fully corner. The apex domain silently 308-redirected and broke "Add." One alert channel failing would swallow the entire alert.</p>
        <h3>4. And it will happily re-break what it already fixed.</h3>
        <p>This is the one that costs you. Because rewriting is cheap, the AI re-broke the same feature again and again. Product detection in my browser extension broke <strong>three separate times</strong> — each "fixed," each undone by the next well-meaning change, because nothing was holding the fix in place.</p>
        <blockquote>Turn every bug you find into a <em>test</em> — before you let the AI fix it. It rewrites code fast enough to break the same thing three times. The test is the only thing that makes a fix <em>stay</em> fixed.</blockquote>
        <h2>You can't out-prompt these bugs. You out-process them.</h2>
        <ol>
          <li><strong>Bug → failing test → fix. In that order.</strong> Write the test that reproduces the bug first, watch it go red, then fix. Now the AI physically cannot re-break it without a red X.</li>
          <li><strong>Feed it your ugliest real input.</strong> Comma-separated prices, right-to-left text, sold-out and bot-blocked pages, every currency. The AI validates the world it pictured; your job is to hand it the world that exists.</li>
          <li><strong>Assume failure at every seam — and never swallow it.</strong> Guard boundaries, surface errors loudly, give outputs a sanity check. A single stray space cost me four commits.</li>
          <li><strong>You run the app; the AI only reads the code.</strong> Reading code proves it's plausible. Running it proves it's true. Every bug that mattered was caught by a human using the product.</li>
        </ol>
        <p>The model writes the code. You provide the one thing it structurally can't: contact with reality. That isn't a limitation of building with AI — it <em>is</em> the job. Own that loop, and your quality compounds instead of leaking.</p>
      `,

      body: `
        <p class="lead">There are hundreds of testing tools. You don't need hundreds — you need the few that give you sight where the AI is blind. This is the stack I actually reach for on a small team shipping AI-written software. Not the biggest list; the one that earns its keep.</p>
        <h2>Catch regressions before they ship</h2>
        <div class="toolrow"><div class="t">Vitest / Jest<span class="role">Unit + regression net</span></div><div class="d"><b>The single highest-leverage tool here.</b> Fast enough to run on every save. Every bug a human reports becomes a permanent test, so the AI can't quietly re-break it. If you adopt one thing this week, adopt this.</div></div>
        <div class="toolrow"><div class="t">Playwright<span class="role">Real browser flows</span></div><div class="d">Unit tests prove functions work; Playwright proves the <b>app</b> works — in Chromium, Firefox and WebKit, on real user journeys. Its trace viewer replays a failed run frame by frame, which is gold when a bug only shows up in the browser.</div></div>
        <h2>Catch what humans see and the model can't</h2>
        <div class="toolrow"><div class="t">axe-core<span class="role">Accessibility + contrast</span></div><div class="d">AI almost never checks color contrast, focus order, or labels. <code>@axe-core/playwright</code> drops accessibility assertions straight into your e2e run and fails the build on serious violations — the a11y bugs you'd otherwise ship blind.</div></div>
        <div class="toolrow"><div class="t">Visual regression<span class="role">"It looks broken"</span></div><div class="d">Playwright screenshot diffs (or <b>Chromatic</b> with Storybook) catch the layout breakage a model can't perceive from source: an overlapping icon, a collapsed card, an image that renders as a broken glyph.</div></div>
        <h2>Catch the seams and what escapes to production</h2>
        <div class="toolrow"><div class="t">Error monitoring<span class="role">Prod truth</span></div><div class="d"><b>Sentry</b> (or a lightweight self-hosted table) reports the bugs your tests missed, from real users, with a stack trace and a fingerprint so duplicates collapse. The AI can't watch production — this is how you get told before your users tell you.</div></div>
        <div class="toolrow"><div class="t">GitHub Actions<span class="role">The gate</span></div><div class="d">None of the above matters if it doesn't run automatically. CI is the enforcement layer: tests, lint, and type-checks on every push, blocking merge on red. It's what turns "we have tests" into "we can't ship past them."</div></div>
        <h2>Keep the sprawl in check</h2>
        <div class="toolrow"><div class="t">Renovate / Dependabot<span class="role">Dependency hygiene</span></div><div class="d">AI-built apps accumulate packages fast. Automated dependency PRs keep you patched against known vulnerabilities without a human remembering to look — a quiet but real part of quality.</div></div>
        <div class="toolrow"><div class="t">Promptfoo<span class="role">LLM evals</span></div><div class="d">The moment any feature calls an LLM, ordinary tests stop being enough, because there's no single right answer. Promptfoo runs evals against a golden set in CI. That's a whole discipline of its own — it's the next article.</div></div>
        <div class="callout"><span class="k">Where to start</span><p>Don't stand all eight up at once. Week one: <b>Vitest + Playwright + GitHub Actions</b>. That trio alone converts "the AI keeps re-breaking things" into "the build won't let it." Add the rest as the pain shows up.</p></div>

      dek: "The most valuable QA habit in the AI era isn't glamorous. It's refusing to fix a bug until you've written the test that catches it next time.",
      body: `
        <p class="lead">Here's the pattern that quietly wrecks quality on AI projects: you report a bug, the AI fixes it, everyone moves on — and three changes later, the same bug is back. Not because the model is careless, but because <em>rewriting is cheap</em>, so re-breaking is the default. The fix that lasts is the one nailed down by a test. Here's the fifteen-minute habit.</p>
        <h2>The loop, step by step</h2>
        <ol>
          <li><strong>Reproduce with the exact real input.</strong> Not a simplified version — the actual value that broke. When a price parser turned <code>2,969</code> into <code>296</code>, the input <em>is</em> <code>"2,969"</code>. Capture it verbatim.</li>
          <li><strong>Write the failing test first, and watch it fail.</strong> <code>expect(parsePrice("2,969")).toBe(2969)</code>. Run it, see red. This step is the whole trick: you've now proven the test can actually detect the bug. A test that was green before the fix proves nothing.</li>

          <li><strong>Watch it go green, and keep the test forever.</strong> That test is now a permanent tripwire. Any future change — by you or the AI — that reintroduces the bug turns the build red before it reaches a user.</li>
        </ol>
        <div class="callout"><span class="k">Why "test first" matters more with AI</span><p>A human who fixes a bug tends to remember it. An AI starts fresh every session — it has no memory that this line was hard-won. The test <em>is</em> that memory, encoded where the model can't ignore it.</p></div>
        <h2>Three rules that keep it working</h2>
        <ul>
          <li><strong>Name the test after the bug, not the function.</strong> <code>"parses prices with thousands separators (2,969 not 296)"</code> tells the next reader — human or AI — exactly what reality this defends.</li>
          <li><strong>One assertion per real failure.</strong> Resist bundling. If two things broke, that's two tests, each of which can go red independently and point at one cause.</li>
          <li><strong>It only counts if CI runs it.</strong> A test on your laptop is a note-to-self. A test in the pipeline is a law. Wire it in so no one — including future you at 1am — can merge past it.</li>
        </ul>
        <h2>The economics</h2>
        <p>This feels slower. It isn't. The extension detection bug I mentioned in the first article broke <em>three times</em> before I built the habit — three rounds of report, diagnose, fix, re-verify, each costing far more than the ten minutes a test would have taken the first time. The test is a ratchet: it only ever moves quality forward. In a world where code is cheap to generate and therefore cheap to break, the ratchet is the entire game.</p>
        <p>Adopt exactly one policy this week: <strong>no bug gets fixed until its test exists and fails.</strong> It's the cheapest insurance in software, and in the AI era it's close to mandatory.</p>
      `,

      title: "Testing the AI Itself: Evals for Features That Don't Have One Right Answer",
      dek: "Your regular tests check 'did it do what I said.' But an AI feature has no single correct output. To keep it trustworthy you need a different instrument: evals.",
      body: `
        <p class="lead">Unit and end-to-end tests assume a knowable right answer: this input yields that output. AI features break that assumption. Ask an LLM to "find a cheaper version of this product," "summarize this thread," or "classify this ticket," and there's a <em>range</em> of acceptable answers and a wide range of bad ones. You can't assert equality. But you absolutely can measure quality — with evals.</p>
        <h2>An eval is a test with a rubric instead of an equals sign</h2>
        <p>The shape is the same as any test: fixed inputs, expected behaviour, a pass/fail signal. What changes is how you judge the output. Four scoring methods, from cheapest to richest:</p>
        <ul>
          <li><strong>Exact / regex</strong> — for anything structured. Does the response contain a valid price? Is the JSON well-formed? Is the classification one of the allowed labels? Cheap, deterministic, catches the majority of real failures.</li>
          <li><strong>Assertions on properties</strong> — not "is it the perfect summary" but "is it under 60 words, in the input's language, and free of a refusal." Property checks are underrated and very stable.</li>
          <li><strong>LLM-as-judge</strong> — a second model scores the first against a rubric ("is this a genuinely cheaper, in-stock alternative? yes/no + reason"). Powerful for open-ended output; keep the rubric narrow and always log the judge's reasoning so you can audit it.</li>
          <li><strong>Human spot-check</strong> — the ground truth. You don't grade everything by hand, but you review a sample every release to keep the automated judges honest.</li>
        </ul>
        <h2>Build a golden set — small is fine</h2>
        <p>Collect 10–50 real inputs that represent what users actually send, including the ugly ones: the ambiguous query, the foreign-language product, the item that has no cheaper version. Pair each with what an acceptable answer looks like. This golden set is the single most valuable QA asset for an AI feature — more than any tool. Even <strong>ten</strong> honest cases in CI beats shipping on vibes.</p>
        <div class="callout"><span class="k">The tools</span><p><b>Promptfoo</b> — config-driven, runs in CI, great for prompt/model comparisons. <b>DeepEval</b> — pytest-style, feels native if you already test in Python. <b>Ragas</b> — purpose-built for retrieval/RAG quality. <b>Langfuse</b> / <b>LangSmith</b> — production observability: trace every real call, then promote failures into your golden set.</p></div>
        <h2>Treat prompts like code</h2>
        <p>A prompt is source code that happens to be in English. It deserves the same discipline: version it, and re-run your evals on every change. "Prompt regressions" are completely real — a tweak that helps one case silently degrades five others, and without evals you'll never see it. Wire the eval run into the same CI gate as your unit tests.</p>
        <h2>Then guard it at runtime</h2>
        <p>Evals tell you the feature is good <em>on average, before</em> release. Guardrails protect the <em>individual</em> user in real time:</p>
        <ul>
          <li><strong>Validate the shape</strong> before you trust it — reject malformed JSON, out-of-range numbers, empty results.</li>
          <li><strong>Sanity-check against reality</strong> — a "cheaper" price that's higher than the original is a bug, not a deal. Catch it and drop it.</li>
          <li><strong>Fail closed.</strong> When the model returns something you can't verify, show nothing rather than something wrong. A missing suggestion is forgettable; a confidently wrong one costs trust.</li>
        </ul>
        <p>The mental model that ties it together: <strong>evals are your test suite for the parts of the product that think, and guardrails are your error handling for when they think wrong.</strong> Ship AI features without them and you're not measuring quality — you're hoping for it. In this era, hope doesn't scale. Evidence does.</p>

  /* ---------- The Course (Learn) ---------- */
  const COURSE = [
    { part: "Part 1 · QA Foundations", tag: "Maps to ISTQB Foundation (CTFL v4)", blurb: "The timeless core AI can't do for you: the vocabulary, how to design tests, and how to report and prioritize defects. Fully written, self-contained, and practiced on real apps.",
      modules: [
        { id: "f1", title: "The Testing Mindset & Vocabulary", meta: "CTFL Ch.1", project: "A one-page test charter for SauceDemo.",
          summary: "The vocabulary you'll hear everywhere, the error→defect→failure chain, and the seven principles that still hold when AI writes the code.",
          lectures: [
            { id: "f1l1", title: "QA vocabulary in 10 minutes", time: "10 min", body: `
              <p class="lead">You don't need to memorize these — but you must <em>recognize</em> them, because every plan, ticket, and standup uses them. Here's the core vocabulary, fast. We'll go deep on the ones that matter for the rest of Part 1.</p>
              <div class="term"><span class="w">Quality</span><span class="m">How well software meets real needs — does the right thing, reliably, for real users. Not just "no crashes."</span></div>
              <div class="term"><span class="w">QA vs QC</span><span class="m"><b>Quality Assurance</b> is the process that prevents defects (how we work). <b>Quality Control</b> is the activity that finds them (testing). QA is the umbrella; testing is one tool under it.</span></div>
              <div class="term"><span class="w">Test case</span><span class="m">One specific check: preconditions, steps, input, and the expected result. The atom of testing.</span></div>
              <div class="term"><span class="w">Test suite</span><span class="m">A named group of test cases run together (e.g. "checkout suite").</span></div>
              <div class="term"><span class="w">Test plan</span><span class="m">The strategy document: what we'll test, how, by whom, with what entry/exit criteria and risks.</span></div>
              <div class="term"><span class="w">Test charter</span><span class="m">A lightweight, one-page mission for a testing session — looser than a plan, used for exploratory work.</span></div>
              <div class="term"><span class="w">Error / Defect / Failure</span><span class="m">The chain a bug travels: a human <b>error</b> introduces a <b>defect</b> (bug) in the code, which under the right conditions produces a visible <b>failure</b>. Next lecture unpacks this.</span></div>
              <div class="term"><span class="w">Severity</span><span class="m">How bad the failure is <em>technically</em> (data loss? crash? cosmetic?). A property of the bug.</span></div>
              <div class="term"><span class="w">Priority</span><span class="m">How urgently the business wants it fixed. Set by people, not the code. Severity ≠ priority — a whole lecture in Chapter 4.</span></div>
              <div class="term"><span class="w">Smoke / Sanity / Regression</span><span class="m">Three test depths: <b>smoke</b> = "does it even boot?", <b>sanity</b> = "does this one area work after a change?", <b>regression</b> = "did we break anything that used to work?"</span></div>
              <div class="term"><span class="w">Verification vs Validation</span><span class="m">"Did we build it <em>right</em>?" (matches spec) vs "Did we build the <em>right thing</em>?" (matches the real need).</span></div>
              <div class="term"><span class="w">False positive / negative</span><span class="m">A test that fails when nothing's broken (false positive / "flaky") vs a test that passes while a real bug exists (false negative — the dangerous one).</span></div>
              <div class="term"><span class="w">Coverage</span><span class="m">How much of something (code, requirements, risks) your tests actually exercise. High coverage is evidence, not proof.</span></div>
              <div class="callout"><span class="k">Your practice app</span><p>Throughout Part 1 you'll practice on <b>SauceDemo</b> (<code>saucedemo.com</code>) — a real, free demo shop built specifically for QA practice. It even ships deliberate bugs for certain logins, which you'll hunt in Chapter 4. Open it now and log in with <code>standard_user</code> / <code>secret_sauce</code>.</p></div>` },
            { id: "f1l2", title: "Error → Defect → Failure", time: "8 min", body: `
              <p class="lead">This one chain makes your bug reports precise and your severity calls defensible. Learn to see all three links.</p>
              <p>A developer mistypes a line — that's a human <strong>error</strong>. The mistake now lives in the code as a <strong>defect</strong> (what everyone casually calls a "bug"). The defect sits there harmlessly until the right input and state reach it — then it produces a <strong>failure</strong>: the wrong, visible behavior a user experiences.</p>
              <h2>See it on SauceDemo</h2>
              <p>Log in as <code>problem_user</code> / <code>secret_sauce</code> and look at the product grid. Every item shows the <em>same</em> photo. Trace the chain:</p>
              <ul>
                <li><strong>Error</strong> — a developer wired the image field to the wrong source.</li>
                <li><strong>Defect</strong> — the code that maps products to images is wrong. You can't see it directly; it's in the source.</li>
                <li><strong>Failure</strong> — the observable symptom: identical photos on every card. This is what you report.</li>
              </ul>
              <div class="callout"><span class="k">Why the distinction earns its keep</span><p>Your <b>bug report</b> describes the <em>failure</em> plus the steps to trigger it — never a guess at the code. <b>Severity</b> rates the failure's impact. The <b>fix</b> lives in the defect. Confusing these is how you get reports like "the code is broken" that no one can act on.</p></div>
              <p>Not every defect fails, either. A defect on a screen no one visits, or that needs an input no one sends, is real but dormant. That's exactly why "it passed" never means "there are no bugs" — a theme you'll meet again in the principles.</p>` },
            { id: "f1l3", title: "Seven principles that still hold in the AI era", time: "9 min", body: `
              <p class="lead">ISTQB codifies seven testing principles. They predate AI by decades — and AI writing the code makes several of them <em>more</em> true, not less. Learn them once; you'll lean on them forever.</p>
              <ol>
                <li><strong>Testing shows the presence of defects, not their absence.</strong> A green suite means "no bug found here yet," never "bug-free." Evidence, not proof.</li>
                <li><strong>Exhaustive testing is impossible.</strong> You can't try every input × state. So you <em>prioritize by risk</em>. When AI can generate infinite plausible code paths, choosing what to test well matters more than ever.</li>
                <li><strong>Early testing saves time and money.</strong> A defect caught in a requirement costs pennies; the same defect caught in production costs orders of magnitude more. "Shift left."</li>
                <li><strong>Defects cluster.</strong> A small number of modules hold most of the bugs (Pareto). On SauceDemo, the buggy behavior clusters in specific logins — <code>problem_user</code>, <code>visual_user</code>. Follow the smoke.</li>
                <li><strong>Beware the pesticide paradox.</strong> Run the same tests forever and they stop finding new bugs — the code adapts around them. Refresh and add cases. AI-written tests rot the same way.</li>
                <li><strong>Testing is context-dependent.</strong> You test a banking app and a meme generator differently. Risk sets the bar, not a fixed checklist.</li>
                <li><strong>Absence-of-errors is a fallacy.</strong> A flawless build of the wrong product still fails its users. Correct ≠ valuable — this is where <em>validation</em> comes in.</li>
              </ol>
              <p>Notice how many of these are really about one skill: spending finite attention where the risk actually is. That skill is what a QA brings that the model can't.</p>` },
            { id: "f1l4", title: "Verification, validation & the cost curve", time: "7 min", body: `
              <p class="lead">Two questions decide whether software is any good — and one curve explains why QA belongs early, not bolted on at the end.</p>
              <h2>Verification vs validation</h2>
              <p><strong>Verification</strong> asks: <em>did we build the thing right?</em> Does it match the spec, the design, the requirements? <strong>Validation</strong> asks: <em>did we build the right thing?</em> Does it actually solve the user's problem?</p>
              <p>You can pass one and fail the other. "We built exactly what the ticket said, and users hated it" is a <em>validation</em> failure — the spec was wrong. "It's a great idea, but it crashes on submit" is a <em>verification</em> failure. Good QA watches both.</p>
              <h2>The cost-of-a-bug curve</h2>
              <p>The later a defect is found, the more it costs to fix — roughly by an order of magnitude at each stage:</p>
              <div class="statband">
                <div class="s"><span class="n">1×</span><span class="l">in requirements</span></div>
                <div class="s"><span class="n">~10×</span><span class="l">in development</span></div>
                <div class="s"><span class="n">~100×</span><span class="l">in production</span></div>
              </div>
              <p>That curve is the entire business case for QA. It's why you'll learn static reviews (Chapter 5) that catch bugs <em>before</em> code runs, and why "test early, test often" isn't a slogan — it's arithmetic.</p>
              <h2>Your first artifact: the test charter</h2>
              <p>A <strong>test charter</strong> is a one-page mission for a focused testing session. It has five parts: <strong>Mission</strong> (what quality question am I answering?), <strong>Areas</strong> (what I'll touch), <strong>Risks</strong> (what would hurt most if broken), <strong>Out of scope</strong> (what I'm deliberately not testing), and <strong>Setup</strong> (accounts, data, environment). You'll write one for SauceDemo in the practice that follows.</p>` },
            { id: "f1p", title: "Practice — check yourself + write a charter", time: "25 min", kind: "practice",
              intro: "Answer the checks (click an option to see if you're right and why), then do the hands-on task and compare your charter to a strong example. The task is the real skill — don't skip it.",
              quiz: [
                { q: "A user taps “Buy” and the app crashes. The crash itself is the…", options: ["Error", "Defect", "Failure"], answer: 2, why: "The <b>failure</b> is the observable wrong behavior. The <b>defect</b> is the bug in the code that caused it; the <b>error</b> was the human mistake that introduced the defect." },
                { q: "“Our test suite is green, so the app has no bugs.” This claim violates which principle?", options: ["Defects cluster", "Testing shows the presence of defects, not their absence", "Testing is context-dependent"], answer: 1, why: "Green means no defect was <em>found</em> by those tests — never that none exist. Tests give evidence, not proof of absence." },
                { q: "You have two days and can't test everything. Which principle tells you what to do?", options: ["Exhaustive testing is impossible → prioritize by risk", "The pesticide paradox", "Absence-of-errors fallacy"], answer: 0, why: "Since you can't try every input and state, you spend your limited time where the risk is highest. That's risk-based testing, straight from principle 2." },
                { q: "“We built exactly what the spec said, but it doesn't solve the user's problem.” What failed?", options: ["Verification", "Validation"], answer: 1, why: "Verification (built it <em>right</em>, matches spec) passed. <b>Validation</b> (built the <em>right thing</em>) failed — the spec itself was wrong for the user." },
                { q: "The same regression tests have passed for a year and stopped catching anything new. This is…", options: ["The pesticide paradox", "Defect clustering", "The cost-of-a-bug curve"], answer: 0, why: "Repeating identical tests eventually stops finding new defects — the pesticide paradox. Refresh and add cases to keep them effective." }
              ],
              tasks: [
                { title: "Write a test charter for SauceDemo", prompt: "Open <code>saucedemo.com</code>. Spend 15 minutes writing a one-page <b>test charter</b> for it, covering all five parts: Mission, Areas, Risks, Out of scope, and Setup. Aim for something a teammate could pick up and act on. Then reveal a strong example and compare — did you name concrete risks, or vague ones?",
                  model: `
                    <p><b>Mission:</b> Determine whether a first-time shopper can reliably browse products, add them to the cart, and complete checkout on SauceDemo — and identify where that core journey breaks for non-standard users.</p>
                    <p><b>Areas in scope:</b></p>
                    <ul><li>Login (valid, locked-out, and error states)</li><li>Product list: images, names, prices, sort order</li><li>Cart: add, remove, badge count, persistence across pages</li><li>Checkout: form validation, totals/tax math, confirmation</li></ul>
                    <p><b>Top risks (what hurts most if broken):</b></p>
                    <ul><li>Checkout totals are wrong → users are mischarged (highest business risk)</li><li>Add-to-cart silently fails → no purchase completes</li><li>Login blocks a legitimate user → zero access</li></ul>
                    <p><b>Out of scope:</b> visual polish on marketing pages, performance/load, and localization — noted but not this session.</p>
                    <p><b>Setup:</b> Chrome + SauceDemo; test logins <code>standard_user</code>, <code>locked_out_user</code>, <code>problem_user</code>; password <code>secret_sauce</code>. No real payment — checkout is simulated.</p>
                    <p><b>What a strong charter shows:</b> risks tied to <em>user or business harm</em> (mischarge, no access) rather than "buttons might not work," and an explicit out-of-scope so no one assumes you covered it.</p>` }
              ] }
          ] },
        { id: "f2", title: "Testing Across the SDLC", meta: "CTFL Ch.2", project: "A one-page test plan for a SauceDemo sprint.",
          summary: "The four test levels, shift-left, functional vs non-functional types, and where test-first (TDD/BDD) — and AI — fit.",
          lectures: [
            { id: "f2l1", title: "The four test levels", time: "9 min", body: `
              <p class="lead">The same feature gets tested at four zoom levels, each catching a different class of bug. Miss a level and a whole category of defects walks straight to production.</p>
              <p>Follow SauceDemo's checkout through all four:</p>
              <ul>
                <li><strong>Unit / component</strong> — the smallest pieces in isolation. Example: the function that sums item prices into a subtotal. Fast, run on every save. Catches math and logic bugs.</li>
                <li><strong>Integration</strong> — do two pieces talk correctly? Example: the cart hands its contents to the checkout page. Catches <em>seam</em> bugs — the wrong field, a bad format, a dropped value.</li>
                <li><strong>System</strong> — the whole application end to end, as deployed. Example: log in → add two items → check out → see the confirmation. Catches bugs that only appear when everything runs together.</li>
                <li><strong>Acceptance</strong> — does it meet the user's / business's real need? Example: "a shopper can actually buy something and knows it worked." Validation, not just verification.</li>
              </ul>
              <div class="callout"><span class="k">Rule of thumb</span><p>Most tests should be small and low (unit); fewer, slower ones sit higher (system/acceptance). That shape is the "test pyramid" — you'll automate it in Part 2.</p></div>` },
            { id: "f2l2", title: "Shift-left: test early, test cheap", time: "7 min", body: `
              <p class="lead">"Shift left" means pulling testing toward the <em>start</em> of the timeline — because, per the cost curve, that's where defects are cheapest to kill.</p>
              <p>Testing isn't a phase at the end; it happens across the whole software development lifecycle (SDLC):</p>
              <ul>
                <li><strong>Requirements</strong> — review them for ambiguity and gaps before a line is written (static testing, Chapter 5). The cheapest bug is the one you never code.</li>
                <li><strong>Design</strong> — ask "how would I test this?" while it's still a diagram. If it's untestable now, it'll be untestable later.</li>
                <li><strong>Coding</strong> — unit tests and static analysis run as code is written.</li>
                <li><strong>Integration &amp; system</strong> — automated suites in CI on every push (Part 2).</li>
                <li><strong>Release &amp; operations</strong> — monitoring and error tracking catch what escaped.</li>
              </ul>
              <p>In the AI era, shift-left has a sharp edge: the model produces code fast and confidently. If your only check is at the end, you're reviewing a mountain. Push checks earlier — review the requirement, write the failing test first — and you shape quality instead of chasing it.</p>` },
            { id: "f2l3", title: "Test types: functional & non-functional", time: "8 min", body: `
              <p class="lead">Levels are about <em>where</em> you test. Types are about <em>what quality</em> you're testing for. You mix them freely.</p>
              <ul>
                <li><strong>Functional</strong> — does it do what it should? "Adding an item increases the cart badge by one." Most of your early tests.</li>
                <li><strong>Non-functional</strong> — <em>how well</em> does it do it? Performance, security, usability, accessibility, reliability. Example: checkout responds in under two seconds; the page is keyboard-navigable.</li>
                <li><strong>Structural (white-box)</strong> — testing based on the internal code structure and coverage, not just behavior.</li>
                <li><strong>Regression &amp; confirmation</strong> — confirmation re-runs the exact test that found a bug to prove the fix works; regression re-runs the <em>rest</em> to prove the fix didn't break anything else.</li>
              </ul>
              <div class="callout"><span class="k">Where AI-era concerns live</span><p>Accessibility and performance are <b>non-functional</b> types. Testing an AI feature's output quality ("is this summary any good?") is a new non-functional discipline — <em>evals</em> — which is all of Part 3. Placing it on this map now means it won't feel like magic later.</p></div>` },
            { id: "f2l4", title: "Test-first: TDD, BDD, ATDD & AI", time: "7 min", body: `
              <p class="lead">Three related habits all share one radical move: write the test <em>before</em> the code. In the AI era, that move is your strongest lever.</p>
              <ul>
                <li><strong>TDD</strong> (Test-Driven Development) — write a failing unit test, write just enough code to pass it, refactor. Red → green → clean.</li>
                <li><strong>BDD</strong> (Behavior-Driven Development) — describe behavior in plain "Given / When / Then" language everyone can read, then automate it. "<em>Given</em> a shopper with one item, <em>when</em> they check out, <em>then</em> the total includes tax."</li>
                <li><strong>ATDD</strong> (Acceptance-Test-Driven) — the team agrees on acceptance tests up front, so "done" is defined before work starts.</li>
              </ul>
              <div class="callout"><span class="k">The AI connection</span><p>When you hand an AI a <em>failing test</em> as the target, you've given it an unambiguous definition of done and a guardrail it can't wander past — and the test stays behind to stop it re-breaking the feature later. This is the through-line of the whole site; test-first is how you own the loop.</p></div>` },
            { id: "f2p", title: "Practice — check yourself + write a test plan", time: "30 min", kind: "practice",
              intro: "Confirm the levels and types, then write a real one-page test plan and compare it against a worked example.",
              quiz: [
                { q: "You test that the cart correctly passes its items to the checkout page. Which level?", options: ["Unit", "Integration", "System", "Acceptance"], answer: 1, why: "You're checking that two components hand off correctly — that's <b>integration</b>. Testing the sum function alone would be unit; the full purchase flow would be system." },
                { q: "“Checkout must respond within 2 seconds.” This is a…", options: ["Functional requirement", "Non-functional requirement"], answer: 1, why: "It's about <em>how well</em> it performs (speed), not <em>what</em> it does — that's a non-functional (performance) requirement." },
                { q: "After fixing a bug, you re-run your other tests to make sure nothing else broke. That's…", options: ["Confirmation testing", "Regression testing", "Acceptance testing"], answer: 1, why: "Re-running the broader suite to catch newly introduced breakage is <b>regression</b>. Re-running the one test that found the original bug is <em>confirmation</em>." },
                { q: "What does “shift left” tell you to do with a vague requirement?", options: ["Wait until QA at the end to find the problems", "Review and clarify it before any code is written", "Only test it in production monitoring"], answer: 1, why: "Shift-left pulls testing earlier. Reviewing the requirement now (static testing) kills the defect at 1× cost instead of 100× in production." }
              ],
              tasks: [
                { title: "Write a one-page test plan for a SauceDemo sprint", prompt: "Imagine a sprint that adds a <b>promo-code field</b> to SauceDemo checkout. Write a one-page test plan: <b>scope</b>, the <b>test levels</b> you'll run, the <b>types</b> (functional + at least one non-functional), <b>entry/exit criteria</b>, and <b>top risks</b>. Then reveal the example.",
                  model: `
                    <p><b>Feature under test:</b> promo-code field on the checkout page (applies a discount to the total).</p>
                    <p><b>Scope:</b> entering, validating, applying, and removing a promo code, and its effect on the displayed total and tax. Out of scope: creating/managing codes in an admin panel.</p>
                    <p><b>Levels:</b></p>
                    <ul><li><b>Unit</b> — discount-calculation function (percentage and fixed-amount codes, rounding)</li><li><b>Integration</b> — the field passes the code to the pricing logic and the new total flows to the summary</li><li><b>System</b> — full checkout with a valid, an invalid, and an expired code</li><li><b>Acceptance</b> — "a shopper can apply a valid code and sees a lower, correct total"</li></ul>
                    <p><b>Types:</b> Functional (correct discount, correct rejection of bad codes) + Non-functional: usability (clear error message) and security (a code can't drive the total negative).</p>
                    <p><b>Entry criteria:</b> feature deployed to test env; test codes seeded; build passes smoke. <b>Exit criteria:</b> all planned cases run; no open high-severity defects; totals verified to the cent.</p>
                    <p><b>Top risks:</b> wrong math mischarges users; an invalid code silently "works"; a stacking bug drives the price below zero.</p>
                    <p><b>What a strong plan shows:</b> explicit entry/exit criteria (so "done" isn't a feeling) and at least one non-functional angle. Money math is always a top risk — call it out.</p>` }
              ] }
          ] },
        { id: "f3", title: "Test Design Techniques", meta: "CTFL Ch.4", project: "A full test-case set for SauceDemo login + cart.",
          summary: "The formal techniques that turn infinite possible inputs into a small, high-coverage set of test cases: partitions, boundaries, decision tables, and state models.",
          lectures: [
            { id: "f3l1", title: "Equivalence partitioning", time: "8 min", body: `
              <p class="lead">You can't test every input. Equivalence partitioning finds the few that <em>represent</em> all the rest — same coverage, a fraction of the effort.</p>
              <p>The idea: group inputs into classes the software should treat the same way, then test one value from each class. If <code>standard_user</code> works, other valid users probably behave identically — one test covers the class.</p>
              <h2>SauceDemo login, partitioned</h2>
              <ul>
                <li><strong>Valid, active user</strong> — e.g. <code>standard_user</code> → expect: logs in.</li>
                <li><strong>Valid but locked-out user</strong> — <code>locked_out_user</code> → expect: blocked with a clear message.</li>
                <li><strong>Valid username, wrong password</strong> → expect: error, no login.</li>
                <li><strong>Empty username or password</strong> → expect: validation error.</li>
                <li><strong>Unknown username</strong> → expect: error.</li>
              </ul>
              <p>Five classes, five tests — instead of hundreds of guesses. Each class has a different <em>expected result</em>; that's the signal you've partitioned correctly.</p>` },
            { id: "f3l2", title: "Boundary value analysis", time: "7 min", body: `
              <p class="lead">Bugs love edges. Off-by-one errors, "greater-than" where it should be "greater-or-equal" — they hide exactly at the boundaries of a range. So test the boundaries, not the comfortable middle.</p>
              <p>For any range, test the value just below the edge, the edge itself, and just above: the classic three-point (and stricter two-value) boundary check.</p>
              <h2>Examples</h2>
              <ul>
                <li><strong>Cart quantity 1–10:</strong> test <code>0</code> (invalid), <code>1</code> (min valid), <code>10</code> (max valid), <code>11</code> (invalid). The middle values add little.</li>
                <li><strong>A text field capped at 60 chars (TodoMVC todo):</strong> test 59, 60, and 61 characters. Does the 61st get rejected, truncated, or silently break?</li>
                <li><strong>Price display:</strong> <code>0</code> is a famous boundary — remember the Bug Hunt snippet where a free item (price 0) showed "no price" because the code treated 0 as "missing."</li>
              </ul>
              <p>Pair boundaries with partitions: partitioning tells you <em>which</em> ranges exist; boundary analysis tells you <em>where in each range</em> to aim.</p>` },
            { id: "f3l3", title: "Decision tables", time: "8 min", body: `
              <p class="lead">When the outcome depends on a <em>combination</em> of conditions, prose gets slippery and cases get missed. A decision table lays every combination out as a grid so nothing slips.</p>
              <p>List the conditions, enumerate their combinations, and write the expected action for each. Here's SauceDemo login as a decision table:</p>
              <div class="tblwrap"><table>
                <tr><th>Username</th><th>Password</th><th>Account</th><th>Expected</th></tr>
                <tr><td>valid</td><td>correct</td><td>active</td><td>Logs in</td></tr>
                <tr><td>valid</td><td>correct</td><td>locked</td><td>"Locked out" error</td></tr>
                <tr><td>valid</td><td>wrong</td><td>active</td><td>"No match" error</td></tr>
                <tr><td>empty</td><td>any</td><td>—</td><td>"Username required"</td></tr>
                <tr><td>valid</td><td>empty</td><td>—</td><td>"Password required"</td></tr>
              </table></div>
              <p>Each row is a ready-made test case. The table also exposes gaps: is there a rule for a locked account with the <em>wrong</em> password? Which message wins? Prose hides that question; the grid forces it.</p>` },
            { id: "f3l4", title: "State transition testing", time: "8 min", body: `
              <p class="lead">Some bugs only exist <em>over time</em> — they depend on what happened before. State transition testing models the app as states and the moves between them, then checks that only the legal moves are allowed.</p>
              <h2>TodoMVC: a to-do's life</h2>
              <p>Open <code>todomvc.com</code>. A single to-do moves through states: <strong>Active</strong> → (check) → <strong>Completed</strong> → (uncheck) → Active, or → (delete) → gone. Test each transition <em>and</em> the ones that shouldn't happen or shouldn't lose data:</p>
              <ul>
                <li>Active → Completed (check the box): does it move under the "Completed" filter?</li>
                <li>Completed → Active (uncheck): does it come back?</li>
                <li>Filter = "Active", then complete an item: does it correctly disappear from the current view?</li>
                <li>Edit a to-do, then reload: does the change persist, or was state only in memory? (Remember the Bug Hunt "peak price" bug — state that must outlive a session belongs in storage.)</li>
              </ul>
              <p>State bugs are, as the manifesto put it, the AI's biggest blind spot — the model reasons about one moment, not an app living across refreshes and navigation. This technique is how you go looking for them on purpose.</p>` },
            { id: "f3l5", title: "Exploratory & experience-based testing", time: "7 min", body: `
              <p class="lead">Formal techniques cover what you can specify. Exploratory testing covers what you didn't think to specify — and it's where a lot of real bugs are found.</p>
              <p><strong>Exploratory testing</strong> is simultaneous learning, test design, and execution: you interact with the app, form hypotheses, and chase what looks odd — guided, not random. <strong>Session-based</strong> testing gives it structure: a time-boxed session against a <em>charter</em> (remember Chapter 1), with notes on what you tried and found.</p>
              <ul>
                <li><strong>Error guessing</strong> — deliberately feed the ugly input: emoji in a name field, a negative quantity, a double-click on "Buy," the back button mid-checkout.</li>
                <li><strong>Tours</strong> — walk the app with one lens at a time: the "money tour" (every place value changes hands), the "data tour" (every field that stores something).</li>
              </ul>
              <div class="callout"><span class="k">Scripted + exploratory, together</span><p>Scripted tests prove known things keep working (great for regression and automation). Exploratory finds the unknown. Mature QA does both: automate the boring certainties, spend your human attention exploring. AI can generate scripted cases; it can't be curious for you.</p></div>` },
            { id: "f3p", title: "Practice — check yourself + design test cases", time: "35 min", kind: "practice",
              intro: "Confirm you can pick the right technique, then design a real set of test cases for SauceDemo login using two techniques and compare with the worked answer.",
              quiz: [
                { q: "A field accepts quantities 1–10. Using boundary value analysis, which set is best?", options: ["5 and 6", "1, 5, 10", "0, 1, 10, 11"], answer: 2, why: "Boundaries are where bugs hide: test just below min (0), min (1), max (10), and just above max (11). Middle values like 5 add little." },
                { q: "The outcome depends on username validity AND password correctness AND account status. Best technique?", options: ["Boundary value analysis", "Decision table", "State transition testing"], answer: 1, why: "When the result depends on a <em>combination</em> of conditions, a <b>decision table</b> enumerates every combination so no case is missed." },
                { q: "You want to test that completing a to-do, then reloading, keeps it completed. Which technique?", options: ["Equivalence partitioning", "State transition testing", "Decision table"], answer: 1, why: "You're testing behavior <em>over time</em> and across a reload — that's a state transition (and a classic state-persistence bug hunt)." },
                { q: "Grouping login inputs into {valid active, locked, wrong password, empty} and testing one of each is…", options: ["Equivalence partitioning", "Exploratory testing", "Boundary value analysis"], answer: 0, why: "You've split inputs into classes the app treats alike and tested a representative of each — equivalence partitioning." }
              ],
              tasks: [
                { title: "Design test cases for SauceDemo login", prompt: "Using <b>equivalence partitioning</b> to find the classes and a <b>decision table</b> to lay them out, write a complete set of test cases for SauceDemo login. Each case needs: a clear input, preconditions, and an expected result. Try the real logins (<code>standard_user</code>, <code>locked_out_user</code>, <code>problem_user</code>; password <code>secret_sauce</code>). Then reveal the worked set.",
                  model: `
                    <p><b>Partitions found:</b> valid+active, valid+locked, valid username+wrong password, empty username, empty password, unknown username.</p>
                    <div class="tblwrap"><table>
                      <tr><th>#</th><th>Input</th><th>Expected result</th></tr>
                      <tr><td>1</td><td>standard_user / secret_sauce</td><td>Redirects to product list</td></tr>
                      <tr><td>2</td><td>locked_out_user / secret_sauce</td><td>Error: "user has been locked out"</td></tr>
                      <tr><td>3</td><td>standard_user / wrong_pw</td><td>Error: username & password don't match</td></tr>
                      <tr><td>4</td><td>(empty) / secret_sauce</td><td>Error: "Username is required"</td></tr>
                      <tr><td>5</td><td>standard_user / (empty)</td><td>Error: "Password is required"</td></tr>
                      <tr><td>6</td><td>ghost_user / secret_sauce</td><td>Error: no match (no such user)</td></tr>
                    </table></div>
                    <p><b>What a strong set shows:</b> one case per partition (not ten redundant valid logins), an <em>expected result for each</em> (a case with no expected result can't pass or fail), and the empty-field boundaries tested separately for username and password — they often have different messages.</p>` }
              ] }
          ] },
        { id: "f4", title: "Bug Reporting, Severity & Test Management", meta: "CTFL Ch.5", project: "5 real bug reports from SauceDemo + a P0–P3 triage + a smoke/sanity/regression plan.",
          summary: "The most-used QA skill on the job: writing a report that gets fixed, setting severity vs priority correctly, and stratifying a suite into smoke, sanity, and regression.",
          lectures: [
            { id: "f4l1", title: "Anatomy of a bug report that gets fixed", time: "9 min", body: `
              <p class="lead">A bug report has one job: get the bug reproduced, understood, and fixed with the least back-and-forth. Vague reports bounce; precise ones get closed. Here's the anatomy.</p>
              <ul>
                <li><strong>Title</strong> — specific and searchable: "Checkout total omits tax for single-item orders," not "checkout broken."</li>
                <li><strong>Steps to reproduce</strong> — numbered, from a known starting state, with the <em>exact</em> input. Anyone should be able to follow them.</li>
                <li><strong>Expected vs actual</strong> — the two lines that define the bug. "Expected total $32.39; actual $29.99."</li>
                <li><strong>Environment</strong> — build/version, browser/OS, device, account/login used. Bugs are often environment-specific.</li>
                <li><strong>Evidence</strong> — screenshot, screen recording, console error, or network log. Show, don't just tell.</li>
                <li><strong>Severity &amp; priority</strong> — your assessment (next lecture).</li>
              </ul>
              <div class="callout"><span class="k">Two rules that save hours</span><p><b>One bug per report</b> — bundled bugs can't be tracked, triaged, or closed independently. And <b>reproducibility first</b>: if you can't reproduce it, say so and capture everything about when it happened — an intermittent bug still deserves a report, flagged as such.</p></div>` },
            { id: "f4l2", title: "Severity vs priority (they're different)", time: "8 min", body: `
              <p class="lead">These two get conflated constantly, and it causes real damage — the wrong things get fixed first. Learn to set them independently.</p>
              <p><strong>Severity</strong> = how bad the failure is, technically. <strong>Priority</strong> = how urgently the business wants it fixed. One is about impact; the other about scheduling. They don't have to move together:</p>
              <div class="tblwrap"><table>
                <tr><th></th><th>High priority</th><th>Low priority</th></tr>
                <tr><td><b>High severity</b></td><td>Checkout crashes for everyone — fix now</td><td>Data-loss bug on a feature launching next quarter — bad, but not urgent yet</td></tr>
                <tr><td><b>Low severity</b></td><td>Typo in the company name on the homepage — trivial, but embarrassing, fix today</td><td>Cosmetic misalignment on an admin page — someday</td></tr>
              </table></div>
              <h2>A simple priority rubric</h2>
              <ul>
                <li><strong>P0</strong> — production down or data loss; drop everything.</li>
                <li><strong>P1</strong> — major function broken, no reasonable workaround; fix this release.</li>
                <li><strong>P2</strong> — meaningful but with a workaround; schedule soon.</li>
                <li><strong>P3</strong> — minor / cosmetic; fix when convenient.</li>
              </ul>
              <p>Severity you often argue from the failure itself; priority you set <em>with</em> product and business context. Bring both to the table — and be ready to defend the gap when they differ.</p>` },
            { id: "f4l3", title: "Hands-on: hunt real bugs in SauceDemo", time: "10 min", body: `
              <p class="lead">SauceDemo ships <em>deliberate</em> bugs under certain logins — a rare gift for practice. Your job now is to find and characterize them like you would on a real product.</p>
              <p>Log in as <code>problem_user</code> / <code>secret_sauce</code> and then as <code>visual_user</code>, and investigate. Without spoiling every one, here's where to look:</p>
              <ul>
                <li><strong>Product images</strong> — are they correct and distinct, or is something obviously wrong?</li>
                <li><strong>Sorting</strong> — change the sort dropdown (name, price). Does the order actually change / make sense?</li>
                <li><strong>Add / remove from cart</strong> — do the buttons behave consistently for every product?</li>
                <li><strong>Checkout form</strong> — try to enter your info. Do all fields accept input correctly?</li>
                <li><strong>Layout (visual_user)</strong> — look for misaligned, overlapping, or shifted elements.</li>
              </ul>
              <div class="callout"><span class="k">How to characterize what you find</span><p>For each bug, capture: exact steps, which login triggers it, expected vs actual, and a screenshot. Note whether <code>standard_user</code> has the same problem — "only happens for problem_user" is a powerful clue for developers and a real thing you'll write in the report. You'll turn these into formal reports in the practice.</p></div>` },
            { id: "f4l4", title: "Risk-based testing: smoke, sanity, regression", time: "9 min", body: `
              <p class="lead">Under time pressure you can't run everything, so you stratify your suite into layers and run the cheapest, highest-value layer first. This is the backbone of test management.</p>
              <ul>
                <li><strong>Smoke</strong> — a tiny set that answers "is the build even worth testing?" App loads, login works, core page renders. Runs first, on every build; if it fails, stop and reject the build.</li>
                <li><strong>Sanity</strong> — narrow and deep: after a change to one area, does <em>that area</em> work? Quick, targeted, not exhaustive.</li>
                <li><strong>Regression</strong> — broad: did this change break anything that used to work elsewhere? The most expensive layer, ideally automated (Part 2).</li>
              </ul>
              <h2>Prioritize <em>within</em> each layer</h2>
              <p>Ranking matters even inside a layer, so QA under a deadline knows what runs first. For SauceDemo smoke: (1) site loads, (2) <code>standard_user</code> can log in, (3) products render, (4) add-to-cart updates the badge, (5) checkout reaches confirmation. Order by "what would hurt most if broken and we shipped."</p>
              <div class="callout"><span class="k">This is a core QA priority</span><p>Stratified, ranked suites are exactly what lets a team ship fast without flying blind. It's also where <em>manual-first ordering</em> lives: things that can't be automated — real payments, SMS 2FA, biometric login, captchas — get scheduled at the <em>start</em> of a test window, with accounts and devices set up in advance.</p></div>` },
            { id: "f4p", title: "Practice — report, triage & plan", time: "45 min", kind: "practice",
              intro: "This is the most job-relevant practice in Part 1. Confirm the concepts, then do all three tasks — a real bug report, a P0–P3 triage, and a smoke/sanity/regression plan — and compare each to a worked answer.",
              quiz: [
                { q: "The homepage shows the company name misspelled. Technically trivial, but it's the first thing every visitor sees. Best call?", options: ["Low severity, low priority", "Low severity, high priority", "High severity, high priority"], answer: 1, why: "The <em>failure</em> is cosmetic (low severity), but the business impact of a visible typo is high, so it's fixed urgently (high priority). Severity and priority diverge — that's the whole point." },
                { q: "Which item belongs in the SMOKE layer for SauceDemo?", options: ["Verify tax rounding on 20 different cart combinations", "Confirm the site loads and standard_user can log in", "Check every product's sort order under every filter"], answer: 1, why: "Smoke is the tiny 'is this build even alive?' check — load + login + core render. The exhaustive checks belong in regression." },
                { q: "A bug report says only: “Checkout is broken.” What's the single most important thing it's missing?", options: ["A funny title", "Numbered steps to reproduce with expected vs actual", "The developer's name"], answer: 1, why: "Without reproducible steps and an expected-vs-actual, no one can confirm, diagnose, or verify a fix. Reproducibility is the heart of a report." },
                { q: "Production is down and users are losing cart data. Priority?", options: ["P0", "P2", "P3"], answer: 0, why: "Production outage plus data loss is a drop-everything <b>P0</b>. Severity is high and priority is maximal — here they align." }
              ],
              tasks: [
                { title: "Write a real bug report from SauceDemo", prompt: "Take one defect you found as <code>problem_user</code> or <code>visual_user</code> and write a complete bug report: <b>title, steps, expected, actual, environment, evidence note, severity, priority</b>. Then compare with the example.",
                  model: `
                    <p><b>Title:</b> Product images identical for all items when logged in as problem_user</p>
                    <p><b>Steps to reproduce:</b></p>
                    <ul><li>Go to saucedemo.com</li><li>Log in as <code>problem_user</code> / <code>secret_sauce</code></li><li>Observe the product list images</li></ul>
                    <p><b>Expected:</b> each product shows its own distinct photo (as it does for <code>standard_user</code>).<br><b>Actual:</b> every product shows the same image.</p>
                    <p><b>Environment:</b> Chrome 126 / macOS; build = current saucedemo.com; login = problem_user.</p>
                    <p><b>Evidence:</b> screenshot of the grid attached. <b>Note:</b> does not reproduce for standard_user → user-specific.</p>
                    <p><b>Severity:</b> Medium (core commerce works; product identification is impaired). <b>Priority:</b> High (users can't tell products apart — real conversion impact).</p>
