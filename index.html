<title>QA in the AI Era — by Nadav Katz</title>
<style>
  :root {
    --paper: #eceff4; --card: #ffffff; --ink: #141b28; --muted: #57616f; --faint: #808b99;
    --line: #d7dbe3; --line-strong: #c1c8d2; --signal: #b23c1c; --signal-soft: #f3e3dc;
    --bar: #354154; --bar-track: #dde1e8; --tag-bg: #e6e9ef; --field: #f6f7fa;
    --shadow: 0 1px 2px rgba(20,27,40,.05), 0 14px 30px -20px rgba(20,27,40,.30);
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Cascadia Code", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d131e; --card: #151d2b; --ink: #e7ebf2; --muted: #9aa4b3; --faint: #6f7a8a;
      --line: #24303f; --line-strong: #33404f; --signal: #f07040; --signal-soft: #2a1a12;
      --bar: #6d8199; --bar-track: #202b3a; --tag-bg: #1d2634; --field: #101825;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 36px -22px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"] {
    --paper: #eceff4; --card: #ffffff; --ink: #141b28; --muted: #57616f; --faint: #808b99;
    --line: #d7dbe3; --line-strong: #c1c8d2; --signal: #b23c1c; --signal-soft: #f3e3dc;
    --bar: #354154; --bar-track: #dde1e8; --tag-bg: #e6e9ef; --field: #f6f7fa;
    --shadow: 0 1px 2px rgba(20,27,40,.05), 0 14px 30px -20px rgba(20,27,40,.30);
  }
  :root[data-theme="dark"] {
    --paper: #0d131e; --card: #151d2b; --ink: #e7ebf2; --muted: #9aa4b3; --faint: #6f7a8a;
    --line: #24303f; --line-strong: #33404f; --signal: #f07040; --signal-soft: #2a1a12;
    --bar: #6d8199; --bar-track: #202b3a; --tag-bg: #1d2634; --field: #101825;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 36px -22px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); line-height: 1.62;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); }

  /* ---- Masthead ---- */
  .masthead {
    border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
  }
  .masthead .bar { max-width: 940px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
  .brand .mark { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .brand .mark .dot { color: var(--signal); }
  .nav { display: flex; align-items: center; gap: 18px; }
  .nav a { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; color: var(--muted); text-decoration: none; cursor: pointer; }
  .nav a:hover { color: var(--signal); }
  .nav .cta { color: var(--ink); border: 1px solid var(--line-strong); border-radius: 3px; padding: 5px 11px; }
  .nav .cta:hover { border-color: var(--signal); color: var(--signal); }
  @media (max-width: 720px) { .nav .hidephone { display: none; } }

  /* ---- Hero ---- */
  .hero { padding: 74px 0 30px; }
  @media (max-width: 640px) { .hero { padding: 48px 0 24px; } }
  .hero .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 0 0 20px; }
  .hero h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(34px, 6.2vw, 56px); line-height: 1.05; letter-spacing: -.018em; text-wrap: balance; margin: 0; }
  .hero h1 .hl { color: var(--signal); font-style: italic; }
  .hero .deck { font-size: clamp(18px, 2.3vw, 21px); color: var(--muted); max-width: 33em; margin: 24px 0 0; }
  .hero .meta { margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 10px 20px; font-family: var(--mono); font-size: 12.5px; color: var(--faint); letter-spacing: .04em; }
  .hero .meta b { color: var(--signal); font-weight: 600; }

  .sec-h { max-width: 940px; margin: 0 auto; padding: 40px 24px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h h2 { font-family: var(--mono); font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); font-weight: 600; margin: 0; }
  .sec-h .note { font-family: var(--mono); font-size: 12px; color: var(--faint); }

  .feature-wrap { max-width: 940px; margin: 0 auto; padding: 8px 24px 0; }
  .feature {
    display: block; text-decoration: none; cursor: pointer; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 34px 34px 30px; border-left: 3px solid var(--signal);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .feature:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(20,27,40,.05), 0 22px 44px -22px rgba(20,27,40,.4); }
  .feature .row { display: flex; gap: 10px; align-items: center; margin: 0 0 16px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); background: var(--signal-soft); border-radius: 99px; padding: 3px 10px; }
  .tag.plain { color: var(--muted); background: var(--tag-bg); }
  .feature .issue { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .08em; }
  .feature h3 { font-family: var(--serif); font-weight: 620; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; margin: 0 0 12px; }
  .feature p { font-size: 18px; color: var(--muted); margin: 0 0 18px; max-width: 40em; }
  .feature .go { font-family: var(--mono); font-size: 13px; color: var(--signal); letter-spacing: .04em; }

  .list { max-width: 940px; margin: 0 auto; padding: 6px 24px 0; }
  .post {
    display: grid; grid-template-columns: 84px 1fr auto; gap: 4px 22px; align-items: start;
    text-decoration: none; cursor: pointer; text-align: left; width: 100%; background: none; border: 0;
    padding: 26px 0; border-top: 1px solid var(--line);
  }
  .post:hover h3 { color: var(--signal); }
  .post .num { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--faint); letter-spacing: .06em; padding-top: 3px; }
  .post .body { grid-column: 2; }
  .post .body .row { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; flex-wrap: wrap; }
  .post h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.16; letter-spacing: -.01em; margin: 0 0 6px; transition: color .12s; }
  .post p { font-size: 16px; color: var(--muted); margin: 0; max-width: 42em; }
  .post .rt { grid-column: 3; font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; padding-top: 3px; }
  @media (max-width: 620px) {
    .post { grid-template-columns: 1fr; }
    .post .num { padding-top: 0; }
    .post .body, .post .rt { grid-column: 1; }
    .post .rt { padding-top: 6px; }
  }

  .upcoming { max-width: 940px; margin: 0 auto; padding: 8px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .up { border: 1px dashed var(--line-strong); border-radius: 5px; padding: 16px 18px; }
  .up .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 7px; }
  .up p { font-family: var(--serif); font-size: 16px; margin: 0; color: var(--muted); line-height: 1.35; }

  /* ---- About / consulting ---- */
  .about { border-top: 1px solid var(--line-strong); margin-top: 56px; background: var(--card); }
  .about .in { max-width: 720px; margin: 0 auto; padding: 52px 24px; }
  .about .k { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin: 0 0 16px; }
  .about h2 { font-family: var(--serif); font-weight: 620; font-size: clamp(24px, 3.6vw, 30px); line-height: 1.16; letter-spacing: -.012em; text-wrap: balance; margin: 0 0 16px; }
  .about p { font-size: 18px; color: var(--muted); margin: 0 0 16px; }
  .about p b { color: var(--ink); font-weight: 600; }
  .about .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .btn { font-family: var(--mono); font-size: 13px; letter-spacing: .03em; text-decoration: none; border-radius: 4px; padding: 11px 18px; cursor: pointer; border: 1px solid transparent; }
  .btn.primary { background: var(--signal); color: #fff; border-color: var(--signal); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--signal); color: var(--signal); }

  footer.site { border-top: 1px solid var(--line); }
  footer.site .in { max-width: 940px; margin: 0 auto; padding: 26px 24px 56px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer.site p { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .03em; margin: 0; }

  /* ---- Article view ---- */
  .article { padding: 44px 0 20px; }
  .backlink { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-decoration: none; letter-spacing: .04em; display: inline-block; margin-bottom: 30px; cursor: pointer; }
  .backlink:hover { color: var(--signal); }
  .article .head .row { display: flex; gap: 10px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
  .article h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(30px, 5.2vw, 46px); line-height: 1.07; letter-spacing: -.02em; text-wrap: balance; margin: 0 0 16px; }
  .article .dek { font-family: var(--serif); font-size: clamp(19px, 2.6vw, 22px); color: var(--muted); margin: 0 0 26px; max-width: 34em; line-height: 1.45; }
  .article .byline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--faint); letter-spacing: .04em; padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 34px; }
  .article .byline b { color: var(--ink); font-weight: 600; }
  .article .byline .sep { opacity: .5; }

  .article .body { font-size: 19px; }
  .article .body > *:first-child { margin-top: 0; }
  .article .body p { margin: 0 0 20px; }
  .article .body p.lead { font-size: 21px; }
  .article .body h2 { font-family: var(--serif); font-weight: 620; font-size: clamp(23px, 3.4vw, 28px); line-height: 1.18; letter-spacing: -.01em; text-wrap: balance; margin: 40px 0 14px; }
  .article .body h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 30px 0 8px; letter-spacing: -.005em; }
  .article .body em { font-style: italic; }
  .article .body strong { font-weight: 620; }
  .article .body a { color: var(--signal); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .article .body ul { margin: 0 0 20px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .article .body ul li { position: relative; padding-left: 26px; }
  .article .body ul li::before { content: "→"; position: absolute; left: 0; top: 0; font-family: var(--mono); color: var(--signal); font-size: 15px; }
  .article .body ol { margin: 0 0 20px; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; }
  .article .body ol li { padding-left: 6px; }
  .article .body ol li::marker { font-family: var(--mono); font-weight: 600; color: var(--signal); }
  .article .body blockquote { margin: 28px 0; padding: 4px 0 4px 22px; border-left: 3px solid var(--signal); font-family: var(--serif); font-size: 22px; line-height: 1.32; letter-spacing: -.01em; color: var(--ink); }
  .article .body blockquote em { color: var(--signal); font-style: italic; }
  .article .body code { font-family: var(--mono); font-size: .84em; background: var(--tag-bg); border-radius: 3px; padding: 2px 6px; }
  .article .body .callout { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--signal); border-radius: 4px; padding: 18px 20px; margin: 26px 0; box-shadow: var(--shadow); }
  .article .body .callout p { margin: 0; font-size: 16.5px; }
  .article .body .callout .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); display: block; margin-bottom: 8px; }
  .toolrow { display: grid; grid-template-columns: 150px 1fr; gap: 6px 20px; padding: 16px 0; border-top: 1px solid var(--line); }
  .toolrow .t { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink); }
  .toolrow .t .role { display: block; font-weight: 400; font-size: 11.5px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
  .toolrow .d { font-family: var(--serif); font-size: 16.5px; color: var(--muted); }
  .toolrow .d b { color: var(--ink); font-weight: 600; }
  @media (max-width: 560px) { .toolrow { grid-template-columns: 1fr; } }

  .statband { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: baseline; margin: 26px 0 30px; padding: 22px 0; border-block: 1px solid var(--line-strong); }
  .statband .s { display: flex; flex-direction: column; gap: 3px; }
  .statband .s .n { font-family: var(--mono); font-weight: 600; font-size: 27px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .statband .s .n em { color: var(--signal); font-style: normal; }
  .statband .s .l { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  /* ---- Share row ---- */
  .share { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
  .share .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
  .sbtn { font-family: var(--mono); font-size: 12.5px; letter-spacing: .03em; cursor: pointer; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line-strong); border-radius: 99px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .sbtn:hover { border-color: var(--signal); color: var(--signal); }
  .sbtn svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---- Comments ---- */
  .comments { margin-top: 46px; padding-top: 30px; border-top: 1px solid var(--line-strong); }
  .comments .h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .comments .h h3 { font-family: var(--serif); font-size: 22px; font-weight: 620; margin: 0; }
  .comments .h .c { font-family: var(--mono); font-size: 13px; color: var(--faint); }
  .comments .disc { font-family: var(--sans); font-size: 12.5px; color: var(--faint); margin: 0 0 22px; line-height: 1.5; }
  .cform { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .cform .two { display: flex; gap: 10px; flex-wrap: wrap; }
  .cform .two input { flex: 1; min-width: 160px; }
  .field { font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line-strong); border-radius: 5px; padding: 11px 13px; width: 100%; }
  .field:focus { outline: 2px solid var(--signal); outline-offset: 1px; border-color: var(--signal); }
  textarea.field { min-height: 90px; resize: vertical; font-family: var(--sans); line-height: 1.5; }
  .cform .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .clist { display: flex; flex-direction: column; gap: 16px; }
  .cmt { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
  .cmt .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .cmt .who { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }
  .cmt .when { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .cmt .txt { font-family: var(--serif); font-size: 16px; color: var(--muted); margin: 0; white-space: pre-wrap; }
  .cempty { font-family: var(--serif); font-size: 16px; color: var(--faint); font-style: italic; }

  .article .authorcard { margin-top: 46px; padding: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
  .article .authorcard .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .article .authorcard h4 { font-family: var(--serif); font-size: 20px; font-weight: 620; margin: 0 0 8px; }
  .article .authorcard p { font-family: var(--serif); font-size: 16px; color: var(--muted); margin: 0 0 16px; }
  .article .authorcard .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .article .more { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line-strong); }
  .article .more .k { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--signal); margin: 0 0 14px; }

  /* ---- Generic page (contact / talks) ---- */
  .page { padding: 54px 0 20px; }
  .page .k { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin: 0 0 16px; }
  .page h1 { font-family: var(--serif); font-weight: 620; font-size: clamp(30px, 5vw, 44px); line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; margin: 0 0 16px; }
  .page .lede { font-size: 19px; color: var(--muted); margin: 0 0 30px; max-width: 36em; }
  .page .lede b { color: var(--ink); font-weight: 600; }

  .talk { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: start; padding: 24px 0; border-top: 1px solid var(--line); }
  .talk .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .talk .meta .kind { color: var(--signal); }
  .talk h3 { font-family: var(--serif); font-size: 21px; font-weight: 620; margin: 0 0 8px; letter-spacing: -.01em; }
  .talk p { font-size: 16.5px; color: var(--muted); margin: 0; max-width: 44em; }
  .talk .act { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  .talk .act .btn { white-space: nowrap; }
  .talk .act .soon { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 8px 12px; }
  @media (max-width: 560px) { .talk { grid-template-columns: 1fr; } .talk .act { grid-column: 1; grid-row: auto; margin-top: 6px; } }

  .contact-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 34px; align-items: start; }
  @media (max-width: 680px) { .contact-grid { grid-template-columns: 1fr; gap: 26px; } }
  .contact-side .box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 22px 22px; margin-bottom: 16px; }
  .contact-side .box .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
  .contact-side .box p { font-size: 15.5px; color: var(--muted); margin: 0 0 8px; }
  .contact-side .box a { color: var(--signal); text-decoration: none; font-family: var(--mono); font-size: 13.5px; }
  .contact-side .box a:hover { text-decoration: underline; }
  .contact-side ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }

      date: "Jul 6, 2026", readingTime: "6 min", featured: true,
      title: "You Are the AI's Missing Feedback Loop",
      dek: "I shipped 217 commits in two months building a real product with AI. 52 were bug fixes. Every one was trying to tell me the same thing.",
      body: `
        <p class="lead">When AI writes the code, the bottleneck stops being <em>writing</em> and becomes <em>verifying</em>. I learned this the expensive way. Over two months building a real product almost entirely with AI, I shipped 217 commits. Fifty-two of them — roughly one in four — were bug fixes. When I lined all fifty-two up, they weren't random. They told a single, uncomfortable story.</p>
        <div class="statband">
          <div class="s"><span class="n">217</span><span class="l">commits</span></div>
          <div class="s"><span class="n">52 <em>≈¼</em></span><span class="l">were bug fixes</span></div>
          <div class="s"><span class="n">60</span><span class="l">days</span></div>
          <div class="s"><span class="n">0</span><span class="l">found by the AI itself</span></div>
        </div>
        <h2>The AI didn't write bad code. It wrote plausible code.</h2>
        <p>Plausible code fails in a specific place: exactly where the model had no way to check itself. It can't see the messy real page a user is on. It can't feel the app change between yesterday and today. It can't stand at the seam where two systems hand off. And it never notices the failure it didn't imagine. My fifty-two bugs clustered into those four blind spots.</p>
        <h3>1. It tests the happy path it imagined — not the mess that's real.</h3>
        <p>The AI wrote a price parser against clean, invented HTML. Real stores don't cooperate: a price of <code>2,969</code> was read as <code>296</code> because the parser choked on a comma. Right-to-left Hebrew rendered backwards. Bot-blocked shops returned a bare "no price." None of it appeared in the world the model pictured.</p>
        <h3>2. It reasons about one moment — not an app living over time.</h3>
        <p>A single request looked perfect. State across sessions is where it broke: the all-time-low price was lost on refresh, so "price dropped" badges vanished. Single-page navigation didn't re-trigger detection. A cached page served a stale price on the second check.</p>
        <h3>3. It can't stand at the seam between two systems.</h3>
        <p>The nastiest bugs lived <em>between</em> systems, where the model could only ever see one side. A stray space in a payment credential took <strong>four</strong> commits to fully corner. The apex domain silently 308-redirected and broke "Add." One alert channel failing would swallow the entire alert.</p>
        <h3>4. And it will happily re-break what it already fixed.</h3>
        <p>This is the one that costs you. Because rewriting is cheap, the AI re-broke the same feature again and again. Product detection in my browser extension broke <strong>three separate times</strong> — each "fixed," each undone by the next well-meaning change, because nothing was holding the fix in place.</p>
        <blockquote>Turn every bug you find into a <em>test</em> — before you let the AI fix it. It rewrites code fast enough to break the same thing three times. The test is the only thing that makes a fix <em>stay</em> fixed.</blockquote>
        <h2>You can't out-prompt these bugs. You out-process them.</h2>
        <ol>
          <li><strong>Bug → failing test → fix. In that order.</strong> Write the test that reproduces the bug first, watch it go red, then fix. Now the AI physically cannot re-break it without a red X.</li>
          <li><strong>Feed it your ugliest real input.</strong> Comma-separated prices, right-to-left text, sold-out and bot-blocked pages, every currency. The AI validates the world it pictured; your job is to hand it the world that exists.</li>
          <li><strong>Assume failure at every seam — and never swallow it.</strong> Guard boundaries, surface errors loudly, give outputs a sanity check. A single stray space cost me four commits.</li>
          <li><strong>You run the app; the AI only reads the code.</strong> Reading code proves it's plausible. Running it proves it's true. Every bug that mattered was caught by a human using the product.</li>
        </ol>
        <p>The model writes the code. You provide the one thing it structurally can't: contact with reality. That isn't a limitation of building with AI — it <em>is</em> the job. Own that loop, and your quality compounds instead of leaking.</p>
      `,

      dek: "When the model writes the code, your tools are the eyes it doesn't have. Here's the small, honest stack I'd stand up on day one.",
      body: `
        <p class="lead">There are hundreds of testing tools. You don't need hundreds — you need the few that give you sight where the AI is blind. This is the stack I actually reach for on a small team shipping AI-written software. Not the biggest list; the one that earns its keep.</p>
        <h2>Catch regressions before they ship</h2>
        <div class="toolrow"><div class="t">Vitest / Jest<span class="role">Unit + regression net</span></div><div class="d"><b>The single highest-leverage tool here.</b> Fast enough to run on every save. Every bug a human reports becomes a permanent test, so the AI can't quietly re-break it. If you adopt one thing this week, adopt this.</div></div>
        <div class="toolrow"><div class="t">Playwright<span class="role">Real browser flows</span></div><div class="d">Unit tests prove functions work; Playwright proves the <b>app</b> works — in Chromium, Firefox and WebKit, on real user journeys. Its trace viewer replays a failed run frame by frame, which is gold when a bug only shows up in the browser.</div></div>
        <h2>Catch what humans see and the model can't</h2>
        <div class="toolrow"><div class="t">axe-core<span class="role">Accessibility + contrast</span></div><div class="d">AI almost never checks color contrast, focus order, or labels. <code>@axe-core/playwright</code> drops accessibility assertions straight into your e2e run and fails the build on serious violations — the a11y bugs you'd otherwise ship blind.</div></div>
        <div class="toolrow"><div class="t">Visual regression<span class="role">"It looks broken"</span></div><div class="d">Playwright screenshot diffs (or <b>Chromatic</b> with Storybook) catch the layout breakage a model can't perceive from source: an overlapping icon, a collapsed card, an image that renders as a broken glyph.</div></div>
        <h2>Catch the seams and what escapes to production</h2>
        <div class="toolrow"><div class="t">Error monitoring<span class="role">Prod truth</span></div><div class="d"><b>Sentry</b> (or a lightweight self-hosted table) reports the bugs your tests missed, from real users, with a stack trace and a fingerprint so duplicates collapse. The AI can't watch production — this is how you get told before your users tell you.</div></div>
        <div class="toolrow"><div class="t">GitHub Actions<span class="role">The gate</span></div><div class="d">None of the above matters if it doesn't run automatically. CI is the enforcement layer: tests, lint, and type-checks on every push, blocking merge on red. It's what turns "we have tests" into "we can't ship past them."</div></div>

        <div class="toolrow"><div class="t">Renovate / Dependabot<span class="role">Dependency hygiene</span></div><div class="d">AI-built apps accumulate packages fast. Automated dependency PRs keep you patched against known vulnerabilities without a human remembering to look — a quiet but real part of quality.</div></div>
        <div class="toolrow"><div class="t">Promptfoo<span class="role">LLM evals</span></div><div class="d">The moment any feature calls an LLM, ordinary tests stop being enough, because there's no single right answer. Promptfoo runs evals against a golden set in CI. That's a whole discipline of its own — it's the next article.</div></div>
        <div class="callout"><span class="k">Where to start</span><p>Don't stand all eight up at once. Week one: <b>Vitest + Playwright + GitHub Actions</b>. That trio alone converts "the AI keeps re-breaking things" into "the build won't let it." Add the rest as the pain shows up.</p></div>
        <p>A tool you don't run is worse than no tool — it's a false sense of safety. Pick three, wire them into CI so they run without you, and let the failing build be the teammate who never gets tired of checking.</p>

      slug: "every-bug-a-test", issue: "03", category: "Guide",

      title: "Turn Every Bug Into a Test: A 15-Minute Habit That Ends Repeat Regressions",
      dek: "The most valuable QA habit in the AI era isn't glamorous. It's refusing to fix a bug until you've written the test that catches it next time.",
      body: `
        <p class="lead">Here's the pattern that quietly wrecks quality on AI projects: you report a bug, the AI fixes it, everyone moves on — and three changes later, the same bug is back. Not because the model is careless, but because <em>rewriting is cheap</em>, so re-breaking is the default. The fix that lasts is the one nailed down by a test. Here's the fifteen-minute habit.</p>
        <h2>The loop, step by step</h2>
        <ol>
          <li><strong>Reproduce with the exact real input.</strong> Not a simplified version — the actual value that broke. When a price parser turned <code>2,969</code> into <code>296</code>, the input <em>is</em> <code>"2,969"</code>. Capture it verbatim.</li>
          <li><strong>Write the failing test first, and watch it fail.</strong> <code>expect(parsePrice("2,969")).toBe(2969)</code>. Run it, see red. This step is the whole trick: you've now proven the test can actually detect the bug. A test that was green before the fix proves nothing.</li>
          <li><strong>Only now, let the AI fix it.</strong> Give it the failing test as the target. It now has an unambiguous definition of done <em>and</em> a guardrail it can't wander past.</li>
          <li><strong>Watch it go green, and keep the test forever.</strong> That test is now a permanent tripwire. Any future change — by you or the AI — that reintroduces the bug turns the build red before it reaches a user.</li>
        </ol>
        <div class="callout"><span class="k">Why "test first" matters more with AI</span><p>A human who fixes a bug tends to remember it. An AI starts fresh every session — it has no memory that this line was hard-won. The test <em>is</em> that memory, encoded where the model can't ignore it.</p></div>
        <h2>Three rules that keep it working</h2>
        <ul>
          <li><strong>Name the test after the bug, not the function.</strong> <code>"parses prices with thousands separators (2,969 not 296)"</code> tells the next reader — human or AI — exactly what reality this defends.</li>
          <li><strong>One assertion per real failure.</strong> Resist bundling. If two things broke, that's two tests, each of which can go red independently and point at one cause.</li>
          <li><strong>It only counts if CI runs it.</strong> A test on your laptop is a note-to-self. A test in the pipeline is a law. Wire it in so no one — including future you at 1am — can merge past it.</li>
        </ul>
        <h2>The economics</h2>
        <p>This feels slower. It isn't. The extension detection bug I mentioned in the first article broke <em>three times</em> before I built the habit — three rounds of report, diagnose, fix, re-verify, each costing far more than the ten minutes a test would have taken the first time. The test is a ratchet: it only ever moves quality forward. In a world where code is cheap to generate and therefore cheap to break, the ratchet is the entire game.</p>
        <p>Adopt exactly one policy this week: <strong>no bug gets fixed until its test exists and fails.</strong> It's the cheapest insurance in software, and in the AI era it's close to mandatory.</p>
      `,

    {
      slug: "testing-the-ai-itself", issue: "04", category: "Guide",
      date: "Aug 17, 2026", readingTime: "8 min",
      title: "Testing the AI Itself: Evals for Features That Don't Have One Right Answer",
      dek: "Your regular tests check 'did it do what I said.' But an AI feature has no single correct output. To keep it trustworthy you need a different instrument: evals.",
      body: `
        <p class="lead">Unit and end-to-end tests assume a knowable right answer: this input yields that output. AI features break that assumption. Ask an LLM to "find a cheaper version of this product," "summarize this thread," or "classify this ticket," and there's a <em>range</em> of acceptable answers and a wide range of bad ones. You can't assert equality. But you absolutely can measure quality — with evals.</p>
        <h2>An eval is a test with a rubric instead of an equals sign</h2>
        <p>The shape is the same as any test: fixed inputs, expected behaviour, a pass/fail signal. What changes is how you judge the output. Four scoring methods, from cheapest to richest:</p>
        <ul>
          <li><strong>Exact / regex</strong> — for anything structured. Does the response contain a valid price? Is the JSON well-formed? Is the classification one of the allowed labels? Cheap, deterministic, catches the majority of real failures.</li>
          <li><strong>Assertions on properties</strong> — not "is it the perfect summary" but "is it under 60 words, in the input's language, and free of a refusal." Property checks are underrated and very stable.</li>
          <li><strong>LLM-as-judge</strong> — a second model scores the first against a rubric ("is this a genuinely cheaper, in-stock alternative? yes/no + reason"). Powerful for open-ended output; keep the rubric narrow and always log the judge's reasoning so you can audit it.</li>
          <li><strong>Human spot-check</strong> — the ground truth. You don't grade everything by hand, but you review a sample every release to keep the automated judges honest.</li>
        </ul>
        <h2>Build a golden set — small is fine</h2>
        <p>Collect 10–50 real inputs that represent what users actually send, including the ugly ones: the ambiguous query, the foreign-language product, the item that has no cheaper version. Pair each with what an acceptable answer looks like. This golden set is the single most valuable QA asset for an AI feature — more than any tool. Even <strong>ten</strong> honest cases in CI beats shipping on vibes.</p>
        <div class="callout"><span class="k">The tools</span><p><b>Promptfoo</b> — config-driven, runs in CI, great for prompt/model comparisons. <b>DeepEval</b> — pytest-style, feels native if you already test in Python. <b>Ragas</b> — purpose-built for retrieval/RAG quality. <b>Langfuse</b> / <b>LangSmith</b> — production observability: trace every real call, then promote failures into your golden set.</p></div>
        <h2>Treat prompts like code</h2>
        <p>A prompt is source code that happens to be in English. It deserves the same discipline: version it, and re-run your evals on every change. "Prompt regressions" are completely real — a tweak that helps one case silently degrades five others, and without evals you'll never see it. Wire the eval run into the same CI gate as your unit tests.</p>
        <h2>Then guard it at runtime</h2>
        <p>Evals tell you the feature is good <em>on average, before</em> release. Guardrails protect the <em>individual</em> user in real time:</p>
        <ul>
          <li><strong>Validate the shape</strong> before you trust it — reject malformed JSON, out-of-range numbers, empty results.</li>
          <li><strong>Sanity-check against reality</strong> — a "cheaper" price that's higher than the original is a bug, not a deal. Catch it and drop it.</li>
          <li><strong>Fail closed.</strong> When the model returns something you can't verify, show nothing rather than something wrong. A missing suggestion is forgettable; a confidently wrong one costs trust.</li>
        </ul>
        <p>The mental model that ties it together: <strong>evals are your test suite for the parts of the product that think, and guardrails are your error handling for when they think wrong.</strong> Ship AI features without them and you're not measuring quality — you're hoping for it. In this era, hope doesn't scale. Evidence does.</p>

    let after = "";
    if (BH.answered) {
      const ok = BH.chosen === c.answer;
      after = `<div class="bh-lesson"><p class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Nailed it.' : '✗ Not quite.'}</p><p>${c.lesson}</p></div>
        <div class="bh-actions"><button class="btn primary" onclick="bhNext()">${BH.i + 1 >= BUGHUNT.length ? 'See your rank →' : 'Next round →'}</button></div>`;
    }
    return `
      <div class="bh-hud"><span class="lvl">${esc(c.level)}</span><span>Round <span class="v">${BH.i + 1}</span>/${BUGHUNT.length}</span><span>Score <span class="v">${BH.score}</span></span><span>Streak <span class="v">${BH.streak}</span></span></div>
      <div class="bh-prog"><i style="width:${pct}%"></i></div>
      <p class="bh-ctx">${c.context}</p>
      <p class="bh-q">Which line has the bug?</p>
      <div class="code">${lines}</div>
      ${after}`;
  }
  window.bhPick = function (k) {
    if (BH.answered) return;
    BH.answered = true; BH.chosen = k;
    const c = BUGHUNT[BH.i];
    if (k === c.answer) { BH.score++; BH.streak++; } else { BH.streak = 0; }
    document.getElementById("bh").innerHTML = bhInner();
  };
  window.bhNext = function () {
    BH.i++; BH.answered = false; BH.chosen = -1;
    if (BH.i >= BUGHUNT.length) { try { const best = +(localStorage.getItem("qaera_bh_best") || 0); if (BH.score > best) localStorage.setItem("qaera_bh_best", BH.score); } catch (e) {} }
    document.getElementById("bh").innerHTML = bhInner();
    window.scrollTo(0, 0);
  };
  window.bhReset = function () { BH = { i: 0, score: 0, streak: 0, answered: false, chosen: -1 }; document.getElementById("bh").innerHTML = bhInner(); window.scrollTo(0, 0); };
  function bhResult() {
    const pct = Math.round(BH.score / BUGHUNT.length * 100);
    let best = BH.score; try { best = Math.max(BH.score, +(localStorage.getItem("qaera_bh_best") || 0)); } catch (e) {}
    const rank = bhRank(pct);
    const shareText = encodeURIComponent(`I scored ${BH.score}/${BUGHUNT.length} on the QA in the AI Era Bug Hunt and ranked "${rank}". Can you beat me?`);
    const url = encodeURIComponent(location.href);
    return `<div class="bh-result">
      <p class="bh-q">You caught ${BH.score} of ${BUGHUNT.length} bugs</p>
      <p class="rank">${esc(rank)}</p>
      <p class="score">Score ${BH.score}/${BUGHUNT.length} · ${pct}% · best ${best}/${BUGHUNT.length}</p>
      <div class="bh-actions" style="justify-content:center;">
        <button class="btn primary" onclick="bhReset()">Play again ↻</button>
        <a class="btn ghost" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${shareText}&url=${url}">Share your rank →</a>
      </div>
      <p style="font-family:var(--serif);color:var(--muted);margin-top:22px;">New to QA? <a onclick="go('learn')" style="color:var(--signal);cursor:pointer;text-decoration:underline;">Start the learning roadmap →</a></p>
    </div>`;
  }

  /* ---------- Enrollment / early access (front-end; see README for real gating) ---------- */
  const GOOGLE_CLIENT_ID = ""; // TODO: paste your Google OAuth Client ID to enable "Continue with Google" on your live domain.
  const mKey = "qaera_member";
  function getMember() { try { return JSON.parse(localStorage.getItem(mKey) || "null"); } catch (e) { return null; } }
  function setMember(m) { try { localStorage.setItem(mKey, JSON.stringify(m)); } catch (e) {} }
  function firstName(m) { return ((m && m.name) || "there").split(" ")[0]; }
  window.enrollEmail = function (ev) {
    ev.preventDefault();
    const name = (document.getElementById("enName").value || "").trim();
    const email = (document.getElementById("enEmail").value || "").trim();
    if (!name || !email) return false;
    setMember({ name, email, via: "email" });
    refreshEnroll();
    return false;
  };
  function decodeJwt(t) { try { const p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch (e) { return {}; } }
  window.onGoogleCredential = function (resp) {
    const d = decodeJwt(resp.credential);
    setMember({ name: d.name || d.email || "Member", email: d.email || "", via: "google" });
    refreshEnroll();
  };
  window.signOutMember = function () { try { localStorage.removeItem(mKey); } catch (e) {} refreshEnroll(); };
  function refreshEnroll() { const box = document.getElementById("enrollBox"); if (box) box.outerHTML = enrollBlock(); initGoogle(); syncMemberChip(); }
  function initGoogle() {
    if (!GOOGLE_CLIENT_ID || getMember()) return;
    if (!(window.google && google.accounts && google.accounts.id)) return;
    try {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window.onGoogleCredential });
      const holder = document.getElementById("gbtnHolder");
      if (holder) { holder.innerHTML = ""; google.accounts.id.renderButton(holder, { theme: "outline", size: "large", text: "continue_with", width: 340 }); }
    } catch (e) {}
  }
  function syncMemberChip() { const el = document.getElementById("memberChip"); if (!el) return; const m = getMember(); el.innerHTML = m ? `<span class="memberchip">✓ ${esc(firstName(m))}</span>` : ""; }
  function enrollBlock() {
    const m = getMember();
    if (m) {
      return `<div class="enrolled" id="enrollBox"><p><b>✓ You're enrolled.</b> Welcome, ${esc(firstName(m))} — your <b>free early-access</b> seat is locked in, and progress saves as you go.</p><p style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;"><a onclick="signOutMember()" style="color:var(--signal);cursor:pointer;">Sign out</a></p></div>`;
    }
    const gArea = GOOGLE_CLIENT_ID
      ? `<div id="gbtnHolder"></div>`
      : `<button class="gbtn" onclick="alert('Continue with Google activates on the live site once a Google Client ID is configured (see README). For now, join with your email.')"><span style="font-weight:700;color:#4285F4;font-family:var(--sans);">G</span> Continue with Google</button>`;
    return `<div class="enroll" id="enrollBox">
      <span class="tag2">Free · early access · limited time</span>
      <h3>Enroll free while it's in beta</h3>
      <p>The full course is <b>free for early members</b> right now — it becomes paid later. Join today to lock in free access and save your progress across modules.</p>
      <div class="forms">
        ${gArea}
        <div class="or">— or —</div>
        <form class="row2" onsubmit="return enrollEmail(event)">
          <input class="field" id="enName" type="text" placeholder="First name" maxlength="60" required>
          <input class="field" id="enEmail" type="email" placeholder="Email" maxlength="120" required>
          <button class="btn primary" type="submit">Join free →</button>
        </form>
      </div>
    </div>`;
  }

  /* ---------- The Course (Learn) ---------- */
  const COURSE = [
    { part: "Part 1 · QA Foundations", tag: "Maps to ISTQB Foundation (CTFL v4)", blurb: "The timeless core AI can't do for you: how to think about quality, design tests, and report defects.",
      modules: [
        { id: "f1", title: "The Testing Mindset & Fundamentals", time: "~4 hrs", meta: "CTFL Ch.1",
          build: "a one-page test charter for a real app — what to test, and the risks.",
          skills: ["error vs defect vs failure", "the 7 testing principles", "verification vs validation", "cost of a bug over time"],
          res: [{ name: "ISTQB CTFL syllabus", url: "https://www.istqb.org/" }, { name: "Ministry of Testing", url: "https://www.ministryoftesting.com/" }, { name: "Read: The Missing Feedback Loop", url: "#/post/missing-feedback-loop" }] },
        { id: "f2", title: "Testing Across the SDLC", time: "~4 hrs", meta: "CTFL Ch.2",
          build: "a test plan mapped to an Agile sprint (unit → integration → system → acceptance).",
          skills: ["Agile / DevOps", "shift-left", "test levels & types", "TDD / BDD / ATDD"],
          res: [{ name: "Atlassian: software testing", url: "https://www.atlassian.com/continuous-delivery/software-testing" }] },
        { id: "f3", title: "Test Design Techniques", time: "~6 hrs", meta: "CTFL Ch.4",
          build: "a full set of test cases for a checkout flow using formal techniques.",
          skills: ["equivalence partitioning", "boundary values", "decision tables", "state transition", "exploratory testing"],
          res: [{ name: "Test Automation University", url: "https://testautomationu.applitools.com/" }] },
        { id: "f4", title: "Bug Reporting & Managing Test Activities", time: "~5 hrs", meta: "CTFL Ch.5",
          build: "5 reproducible bug reports + a risk-based test plan (smoke / sanity / regression).",
          skills: ["great bug reports", "severity vs priority", "risk-based testing", "Jira / TestRail"],
          res: [{ name: "Ministry of Testing", url: "https://www.ministryoftesting.com/" }] },
        { id: "f5", title: "Static Testing & Reviews", time: "~2 hrs", meta: "CTFL Ch.3",
          build: "a review checklist and a walkthrough of a requirements doc.",
          skills: ["reviews & inspections", "static analysis", "early feedback"],
          res: [] },
      ] },
    { part: "Part 2 · Automation & Tooling", tag: "The employable core — Playwright-first", blurb: "Turn manual skill into automated suites with the tools employers actually hire for.",
      modules: [
        { id: "a1", title: "Just Enough JavaScript / TypeScript", time: "~8 hrs",
          build: "small scripts — variables, functions, arrays, async/await — the subset tests need.",
          skills: ["JS / TS basics", "async / await", "(Python noted as alt)"],
          res: [{ name: "javascript.info", url: "https://javascript.info/" }, { name: "freeCodeCamp", url: "https://www.freecodecamp.org/learn/" }] },
        { id: "a2", title: "Git & the Developer Workflow", time: "~3 hrs",
          build: "a repo with branches and a pull request you review.",
          skills: ["Git", "branches & PRs", "code review"],
          res: [{ name: "GitHub Skills", url: "https://skills.github.com/" }] },
        { id: "a3", title: "Web Automation with Playwright — Basics", time: "~8 hrs",
          build: "an automated test of a real app's login + core happy path.",
          skills: ["Playwright", "locators", "actions & assertions", "auto-waiting"],
          res: [{ name: "playwright.dev", url: "https://playwright.dev/" }, { name: "Test Automation University", url: "https://testautomationu.applitools.com/" }] },
        { id: "a4", title: "Playwright — Robust, Maintainable Suites", time: "~8 hrs",
          build: "refactor your suite with the Page Object Model, resilient locators & fixtures.",
          skills: ["Page Object Model", "resilient locators", "fixtures", "trace viewer", "cross-browser"],
          res: [{ name: "Playwright best practices", url: "https://playwright.dev/docs/best-practices" }] },
        { id: "a5", title: "Visual & Accessibility Checks", time: "~4 hrs",
          build: "add axe accessibility assertions + screenshot diffs to your suite.",
          skills: ["axe-core", "visual regression", "WCAG basics"],
          res: [{ name: "axe-core", url: "https://github.com/dequelabs/axe-core" }, { name: "web.dev: Accessibility", url: "https://web.dev/learn/accessibility/" }] },
        { id: "a6", title: "API Testing", time: "~6 hrs",
          build: "a suite that tests a public REST API plus one GraphQL query.",
          skills: ["HTTP & REST", "Postman", "automated API tests", "GraphQL basics"],
          res: [{ name: "Postman Learning Center", url: "https://learning.postman.com/" }] },
        { id: "a7", title: "CI/CD — Run Everything Automatically", time: "~5 hrs",
          build: "a GitHub Actions pipeline that runs your suite on every push and blocks on red.",
          skills: ["GitHub Actions", "quality gates", "parallelization", "reporting"],
          res: [{ name: "GitHub Actions docs", url: "https://docs.github.com/actions" }] },
        { id: "a8", title: "Performance & Load Testing", time: "~5 hrs",
          build: "a k6 load test with pass/fail thresholds on an endpoint.",
          skills: ["k6", "thresholds", "(JMeter context)"],
          res: [{ name: "k6 docs", url: "https://grafana.com/docs/k6/latest/" }] },
        { id: "a9", title: "Mobile, Cross-Device & SQL Essentials", time: "~5 hrs",
          build: "a basic Appium check + SQL queries validating the data behind the UI.",
          skills: ["Appium basics", "BrowserStack", "SQL for testers"],
          res: [{ name: "Appium docs", url: "https://appium.io/" }, { name: "SQLBolt", url: "https://sqlbolt.com/" }] },
      ] },
    { part: "Part 3 · The AI Era", tag: "Your differentiator — least-taught, fastest-growing", blurb: "Use AI to test faster, then learn the genuinely new discipline: testing features that think.",
      modules: [
        { id: "i1", title: "AI-Assisted Testing (and its traps)", time: "~5 hrs",
          build: "generate tests with an AI + Playwright MCP, then de-flake the brittle output.",
          skills: ["Copilot / Claude + MCP", "reviewing AI tests", "self-healing & visual-AI tools", "over-reliance risks"],
          res: [{ name: "Copilot + Playwright MCP", url: "https://testdino.com/blog/playwright-tests-with-copilot" }] },
        { id: "i2", title: "Testing AI Features — Evals 101", time: "~6 hrs",
          build: "a 15-case golden dataset for an AI feature, scored with metrics not equality.",
          skills: ["evals vs assertions", "golden datasets", "non-determinism"],
          res: [{ name: "Read: Testing the AI Itself", url: "#/post/testing-the-ai-itself" }, { name: "Promptfoo intro", url: "https://www.promptfoo.dev/docs/intro/" }] },
        { id: "i3", title: "LLM-as-Judge & Eval Tooling in CI", time: "~6 hrs",
          build: "an eval suite that runs in CI and scores an LLM feature on every change.",
          skills: ["G-Eval / QAG", "Promptfoo", "DeepEval", "prompt regression"],
          res: [{ name: "DeepEval", url: "https://deepeval.com/" }, { name: "Promptfoo docs", url: "https://www.promptfoo.dev/" }] },
        { id: "i4", title: "RAG, Hallucination, Bias & Guardrails", time: "~6 hrs",
          build: "faithfulness + relevancy evals for a RAG answer, plus runtime guardrails.",
          skills: ["RAG metrics", "hallucination testing", "bias & fairness", "validate / sanity / fail-closed"],
          res: [{ name: "Ragas", url: "https://docs.ragas.io/" }, { name: "Confident AI: guardrails", url: "https://www.confident-ai.com/blog/llm-guardrails-the-ultimate-guide-to-safeguard-llm-systems" }] },
        { id: "i5", title: "Red-Teaming & Prompt Security", time: "~5 hrs",
          build: "a red-team run against a chatbot: prompt injection, jailbreaks, PII leaks.",
          skills: ["prompt injection", "jailbreaks", "red-teaming", "guardrail validation"],
          res: [{ name: "Promptfoo red-team", url: "https://www.promptfoo.dev/docs/red-team/" }] },
      ] },
    { part: "Part 4 · Career & Capstone", tag: "From learner to hired", blurb: "Assemble everything into proof of skill — and a job.",
      modules: [
        { id: "c1", title: "The AI-Era QA Role & Soft Skills", time: "~2 hrs",
          build: "a one-page \"quality strategy\" memo for a feature — thinking like an orchestrator.",
          skills: ["strategy vs execution", "defining acceptable AI behavior", "stakeholder communication"],
          res: [{ name: "Ministry of Testing", url: "https://club.ministryoftesting.com/" }] },
        { id: "c2", title: "Portfolio, Certifications & Interviews", time: "~4 hrs",
          build: "a GitHub portfolio from your projects + a QA résumé; plan ISTQB CTFL & CT-AI.",
          skills: ["portfolio", "ISTQB CTFL + CT-AI", "résumé", "interview prep"],
          res: [{ name: "ISTQB certifications", url: "https://www.istqb.org/" }] },
        { id: "cap", title: "Capstone — Full Quality Strategy for a Real App", time: "~15 hrs", meta: "Portfolio centerpiece",
          build: "for one real app + its AI feature: a test plan, a Playwright suite in CI, an eval suite, and a quality report.",
          skills: ["everything, end-to-end"],
          res: [{ name: "Warm up in Bug Hunt", url: "#/bug-hunt" }] },
      ] },
  ];
  const TOTAL_MODULES = COURSE.reduce((n, p) => n + p.modules.length, 0);
  const lKey = "qaera_course";
  function lGet() { try { return JSON.parse(localStorage.getItem(lKey) || "[]"); } catch (e) { return []; } }
  window.lToggle = function (id) {
    const s = new Set(lGet());
    if (s.has(id)) s.delete(id); else s.add(id);
    try { localStorage.setItem(lKey, JSON.stringify([...s])); } catch (e) {}
    const done = lGet();
    const bar = document.getElementById("lbar"); if (bar) bar.style.width = Math.round(done.length / TOTAL_MODULES * 100) + "%";
    const note = document.getElementById("lnote"); if (note) note.textContent = done.length + " of " + TOTAL_MODULES + " modules complete";
    const has = done.includes(id);
    const card = document.getElementById("mod_" + id); if (card) card.classList.toggle("done", has);
    const btn = document.getElementById("mb_" + id); if (btn) btn.textContent = has ? "✓ Completed" : "Mark complete";
  };
  function renderLearn() {
    document.title = "The Course — QA in the AI Era";
    const done = lGet();
    let n = 0;
    const parts = COURSE.map((p) => {
      const mods = p.modules.map((m) => {
        n++;
        const has = done.includes(m.id);
        const resHTML = (m.res && m.res.length) ? `<div class="res">${m.res.map((r) => `<a href="${esc(r.url)}" ${r.url.charAt(0) === '#' ? '' : 'target="_blank" rel="noopener"'}>${esc(r.name)}</a>`).join("")}</div>` : "";
        return `<div class="mod ${has ? 'done' : ''}" id="mod_${m.id}">
          <div class="top"><span class="badge">${n}</span><div><p class="sub">${esc(m.time)}${m.meta ? ' · ' + esc(m.meta) : ''}</p><h3>${esc(m.title)}</h3></div></div>
          <p class="build"><b>You'll build:</b> ${esc(m.build)}</p>
          <div class="chips">${m.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>
          ${resHTML}
          <div class="chk"><span></span><button class="btn ghost" id="mb_${m.id}" onclick="lToggle('${m.id}')">${has ? '✓ Completed' : 'Mark complete'}</button></div>
        </div>`;
      }).join("");
      return `<div class="parth"><span class="pt">${esc(p.tag)}</span><h2>${esc(p.part)}</h2><p class="pb">${esc(p.blurb)}</p></div>${mods}`;
    }).join("");
    return `<section class="page road fade"><div class="wrap">
      <a class="backlink" onclick="go('')">← All articles</a>
      <p class="k">The Course · free &amp; self-paced</p>
      <h1>Become a QA for the AI era — from zero</h1>
      <p class="lede">A complete, project-based path from "what is testing?" to automating with Playwright and testing AI features themselves. Every module ends in something you build; together they become your portfolio.</p>
      ${enrollBlock()}
      <div class="pbar"><i id="lbar" style="width:${Math.round(done.length / TOTAL_MODULES * 100)}%"></i></div>
      <p class="pnote" id="lnote">${done.length} of ${TOTAL_MODULES} modules complete</p>
      <div class="enroll" style="border-left-color:var(--line-strong);"><p style="margin:0;font-size:15.5px;color:var(--muted);"><b style="color:var(--signal);">How it works:</b> 22 modules across 4 parts, done in order. The foundations map to the ISTQB Foundation exam; the AI-era part is where you'll stand out. Finish with a capstone you can show employers.</p></div>
      ${parts}
      <div class="actions" style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;"><button class="btn primary" onclick="go('bug-hunt')">Warm up in Bug Hunt →</button><a class="btn ghost" onclick="go('contact')">Ask a question</a></div>
    </div></section>${siteFooter()}`;
  }

  function siteFooter() {
    return `
      <footer class="site">
        <div class="in">
          <p>QA in the AI Era — by ${AUTHOR}</p>
          <p><a onclick="go('')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Articles</a> &middot; <a onclick="go('learn')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Learn</a> &middot; <a onclick="go('bug-hunt')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Bug Hunt</a> &middot; <a onclick="go('talks')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Talks</a> &middot; <a onclick="go('contact')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Contact</a></p>
        </div>
      </footer>`;
  }

  function router() {
    const h = location.hash.replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    let html, scrollToAbout = false;
    if (parts[0] === "post" && bySlug(parts[1])) html = renderPost(bySlug(parts[1]));
    else if (parts[0] === "learn") html = renderLearn();
    else if (parts[0] === "bug-hunt") html = renderBugHunt();
    else if (parts[0] === "talks") html = renderTalks();
    else if (parts[0] === "contact") html = renderContact();
    else { html = renderHome(); scrollToAbout = (parts[0] === "about"); }
    $app.innerHTML = html;
    syncMemberChip();
    if (parts[0] === "learn") initGoogle();
    if (scrollToAbout) { const a = document.getElementById("about"); if (a) { a.scrollIntoView({ behavior: "smooth" }); return; } }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", router);
  // Google Identity Services loads async on the live domain — render its button once ready.
  window.addEventListener("load", () => { if ((location.hash || "").indexOf("learn") >= 0) initGoogle(); });
  router();
</script>

</body>
</html>
