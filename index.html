            { id: "a9l1", title: "Mobile automation basics (Appium)", time: "14 min", body: `
              <p class="lead">Mobile is where a huge share of real users live, and it adds failure modes the web doesn't have. You don't need to master it here — you need to know how it differs and when to reach for it.</p>
              <h2>What's different from web</h2>
              <ul>
                <li><strong>Real devices &amp; emulators</strong> — you test on iOS Simulators / Android emulators and, ideally, some real hardware, because sensors, gestures, and performance differ.</li>
                <li><strong>The app lifecycle</strong> — foreground, backgrounded, killed, resumed; interruptions from calls and notifications; offline and flaky networks. These states are a rich source of bugs (and a personal QA priority worth its own checklist).</li>
                <li><strong>Locators differ</strong> — accessibility ids and platform selectors instead of CSS.</li>
              </ul>
              <h2>Appium: one API, both platforms</h2>
              <p><strong>Appium</strong> drives native iOS and Android apps through the WebDriver protocol — the same shape of script for both. A test looks familiar: find an element, act, assert.</p>
              <pre class="cblock"><code><span class="c">// pseudocode — the shape, not the setup</span>
const field = await driver.$('~username');   <span class="c">// ~ = accessibility id</span>
await field.setValue('standard_user');
await (await driver.$('~login')).click();
await expect(await driver.$('~products-title')).toBeDisplayed();</code></pre>
              <div class="callout"><span class="k">When to invest</span><p>If your product is mobile-first, mobile automation earns its keep. For many teams, a smaller set of critical mobile flows plus a device cloud (BrowserStack, Sauce Labs) to cover the device matrix is the pragmatic 80/20. Know it exists; go deep when the product demands it.</p></div>` },
            { id: "a9l2", title: "SQL for testers: verifying the data layer", time: "16 min", body: `
              <p class="lead">The UI can lie. It shows "Order placed!" while the database saved the wrong total — or nothing at all. SQL lets you check the source of truth directly, and it's one of the most reused skills on any QA team.</p>
              <div class="callout"><span class="k">Prerequisite reminder</span><p>This lecture shows <em>how testers use</em> SQL, not SQL from scratch. If <code>SELECT</code> / <code>WHERE</code> / <code>JOIN</code> are new, do a short SQL primer first (that's the prerequisite we flagged) — an hour is enough to follow along.</p></div>
              <h2>Read the truth behind the screen</h2>
              <p>After an action in the UI, query the database to confirm what actually persisted:</p>
              <pre class="cblock"><code>-- did the order save with the right total and status?
SELECT id, status, total
FROM orders
WHERE id = 1042;

-- join to check the order is linked to the right user
SELECT u.email, o.total, o.created_at
FROM orders o
JOIN users u ON u.id = o.user_id
WHERE o.created_at &gt; '2026-01-01';</code></pre>
              <h2>Where this catches bugs the UI hides</h2>
              <ul>
                <li><strong>Silent data corruption</strong> — the screen rounds to $32.40 but the stored value is 32.399999; only the query shows it.</li>
                <li><strong>Orphaned or duplicate rows</strong> — a "successful" action that wrote twice, or wrote nothing.</li>
                <li><strong>State that must persist</strong> — the all-time-low price from the Bug Hunt lived only in memory; a query proves whether it truly hit storage.</li>
              </ul>
              <div class="callout"><span class="k">Read-only, always</span><p>Testers query with <code>SELECT</code>; you don't <code>UPDATE</code>/<code>DELETE</code> production data to "fix" a test. Verifying the data layer is about <em>observing</em> the truth, not changing it.</p></div>` },

                { q: "What's a key extra risk mobile testing must cover that web usually doesn't?", options: ["Font choice", "App lifecycle states — backgrounded, killed, resumed, interrupted, offline", "The color of buttons"], answer: 1, why: "Mobile apps get backgrounded, killed, resumed, and interrupted by calls/notifications on flaky networks — a rich, distinct source of bugs the web rarely faces." },
                { q: "The UI shows 'Order placed!' Why also check the database?", options: ["The UI is always right", "The UI can show success while the data saved wrong (bad total, duplicate, or nothing)", "To make the test slower"], answer: 1, why: "The screen and the stored truth can diverge — wrong total, orphaned or duplicate rows, or no row at all. A <code>SELECT</code> verifies what actually persisted." },
                { q: "As a tester validating data, which SQL should you stick to?", options: ["UPDATE and DELETE to fix issues", "Read-only SELECT (and JOIN) to observe the truth", "DROP TABLE to reset"], answer: 1, why: "Verification means observing, not mutating. Use <code>SELECT</code>/<code>JOIN</code> to read the source of truth; never alter production data to make a test pass." }

SELECT o.id, o.total, o.status, o.created_at

WHERE u.email = 'ada@example.com'
ORDER BY o.created_at DESC;
-- expect: one new row, status = 'placed'

-- 2. is the stored total exactly right (no rounding drift)?
SELECT total
FROM orders o
JOIN users u ON u.id = o.user_id
WHERE u.email = 'ada@example.com'

-- expect: one row. If empty, the UI and the data disagree — a bug.</code></pre>

      <p class="k" style="margin:30px 0 12px;">What you'll be able to do</p>
      <ul class="wyl">${outcomeHTML}</ul>
      <div class="enroll" style="border-left-color:var(--signal);margin-top:26px;"><span class="tag2">The project spine</span><h3>You practice on real apps from lesson one</h3><p style="margin:0;">No toy examples. You test <b>SauceDemo</b> (a real demo shop that ships deliberate bugs for you to find), <b>TodoMVC</b> for state, and a public REST API — then finish with a <b>capstone</b>: a full quality strategy for one real app, from test plan to an automated suite in CI to AI-feature evals. That capstone is your portfolio.</p></div>
      <p class="k" style="margin:34px 0 4px;">The curriculum</p>
      <p class="pnote" style="margin:0 0 14px;">${COURSE.length} parts · ${TOTAL_LEC} lessons · Part 1 fully written &amp; interactive</p>
      <div class="curric">${curric}</div>
      <div class="actions" style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;"><button class="btn primary" onclick="go('learn/${startLec.id}')">${esc(startLabel)} →</button><button class="btn ghost" onclick="go('bug-hunt')">Warm up in Bug Hunt</button></div>
    </div></section>${siteFooter()}`;
  }

  function siteFooter() {
    return `
      <footer class="site">
        <div class="in">
          <p>QA in the AI Era — by ${AUTHOR}</p>
          <p><a onclick="go('')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Articles</a> &middot; <a onclick="go('learn')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Learn</a> &middot; <a onclick="go('bug-hunt')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Bug Hunt</a> &middot; <a onclick="go('talks')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Talks</a> &middot; <a onclick="go('contact')" style="color:var(--muted);text-decoration:none;cursor:pointer;">Contact</a></p>
        </div>
      </footer>`;
  }

  function router() {
    const h = location.hash.replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    let html, scrollToAbout = false;
    if (parts[0] === "post" && bySlug(parts[1])) html = renderPost(bySlug(parts[1]));
    else if (parts[0] === "learn" && parts[1] && byLec(parts[1])) html = renderLesson(parts[1]);
    else if (parts[0] === "learn") html = renderLearn();
    else if (parts[0] === "bug-hunt") html = renderBugHunt();
    else if (parts[0] === "talks") html = renderTalks();
    else if (parts[0] === "contact") html = renderContact();
    else { html = renderHome(); scrollToAbout = (parts[0] === "about"); }
    $app.innerHTML = html;
    syncMemberChip();
    if (parts[0] === "learn") initGoogle();
    if (scrollToAbout) { const a = document.getElementById("about"); if (a) { a.scrollIntoView({ behavior: "smooth" }); return; } }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", router);
  // Google Identity Services loads async on the live domain — render its button once ready.
  window.addEventListener("load", () => { if ((location.hash || "").indexOf("learn") >= 0) initGoogle(); });
  router();
</script>

</body>
</html>
