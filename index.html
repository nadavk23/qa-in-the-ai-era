                    <p><b>Why this is strong:</b> the "doesn't happen for standard_user" note narrows the defect for developers, and expected/actual are one line each and unambiguous.</p>` },
                { title: "Triage a bug list into P0–P3", prompt: "Assign a priority (P0–P3) to each, with one line of reasoning. Try it before revealing.<br>① Checkout button does nothing for all users. ② Company name misspelled in the header. ③ Cart badge off by one only when you add then remove then re-add. ④ Product images broken for problem_user only. ⑤ Footer copyright year is last year. ⑥ App won't load at all on Safari.",
                  model: `
                    <ul>
                      <li><b>① Checkout dead for everyone — P0.</b> Core purchase path down; no revenue. Drop everything.</li>
                      <li><b>⑥ Won't load on Safari — P0/P1.</b> If Safari is a meaningful share of users, entire app unusable for them → P0; if negligible, P1.</li>
                      <li><b>② Misspelled company name — P1.</b> Trivial severity but highly visible and embarrassing; fix this release.</li>
                      <li><b>④ Images broken for one user type — P2.</b> Real impact but scoped to a subset; workaround exists (other logins fine).</li>
                      <li><b>③ Off-by-one only on add/remove/re-add — P2.</b> Genuine correctness bug, narrow repro path; schedule soon.</li>
                      <li><b>⑤ Footer year — P3.</b> Cosmetic, no user harm; fix when convenient.</li>
                    </ul>
                    <p><b>What a strong triage shows:</b> P0s tied to "revenue/access down," a note that ⑥ depends on <em>audience data</em> (priority needs business context), and low-severity-but-high-visibility ② ranked above scoped functional bugs.</p>` },
                { title: "Write a smoke/sanity/regression plan for SauceDemo", prompt: "Define what goes in each layer, and <b>rank the items inside smoke</b> so a tester under deadline knows the order. Then compare.",
                  model: `
                    <p><b>Smoke (run first, every build — ranked):</b></p>
                    <ul><li>1. Site loads (login page renders)</li><li>2. standard_user can log in</li><li>3. Product list renders with items</li><li>4. Add-to-cart updates the badge</li><li>5. Checkout reaches the confirmation page</li></ul>
                    <p><b>Sanity (after a change to a specific area):</b> if pricing changed → verify subtotal, tax, and total on a 1- and 2-item cart. If login changed → re-check the valid, locked, and empty cases.</p>
                    <p><b>Regression (broad, ideally automated):</b> all login partitions, sort orders, add/remove across every product, cart persistence across navigation, full checkout with valid and invalid data, and every previously-fixed bug's test.</p>
                    <p><b>What a strong plan shows:</b> smoke is <em>tiny</em> and ranked by "what proves the build is alive," sanity is scoped to the change, and regression explicitly re-runs <em>past bugs</em> — turning every fixed defect into a permanent tripwire (the site's core thesis).</p>` }
              ] }
          ] },
        { id: "f5", title: "Static Testing & Reviews", meta: "CTFL Ch.3", project: "A requirements review + your own review checklist.",
          summary: "Catch defects before the code ever runs — the cheapest bugs to fix — by reviewing requirements, designs, and (in the AI era) the model's own output.",
          lectures: [
            { id: "f5l1", title: "Static testing: find bugs before code runs", time: "8 min", body: `
              <p class="lead">Dynamic testing runs the software. <strong>Static testing</strong> examines it <em>without</em> running it — reading requirements, designs, and code to find defects at their source, where they're cheapest to remove.</p>
              <ul>
                <li><strong>Informal review</strong> — a quick second pair of eyes. Cheap, no ceremony.</li>
                <li><strong>Walkthrough</strong> — the author leads others through the artifact to gather feedback and find issues.</li>
                <li><strong>Technical review</strong> — peers (often technical experts) assess quality and fitness.</li>
                <li><strong>Inspection</strong> — the most formal: defined roles, entry/exit criteria, metrics. Reserved for high-risk artifacts.</li>
                <li><strong>Static analysis</strong> — tools that scan code for defects and smells without executing it (linters, type-checkers, security scanners). You'll wire these into CI in Part 2.</li>
              </ul>
              <div class="callout"><span class="k">The AI-era version</span><p>Reviewing AI-written pull requests <em>is</em> static testing — and it's now a core skill. The model produces plausible code fast; a disciplined review is where you catch the plausible-but-wrong before it runs. Read the code to prove it's plausible; you'll still run it (dynamic) to prove it's true.</p></div>` },
            { id: "f5l2", title: "Hunting ambiguity in requirements & AI output", time: "8 min", body: `
              <p class="lead">Most expensive bugs start as a vague requirement everyone "understood differently." The highest-leverage static testing you'll do is hunting ambiguity <em>before</em> anyone builds the wrong thing.</p>
              <p>Consider this requirement: <em>"Users should be able to reset their password quickly and securely."</em> Read like a tester, it's full of holes:</p>
              <ul>
                <li><strong>"quickly"</strong> — how fast? What's the measurable target?</li>
                <li><strong>"securely"</strong> — via email link? SMS? What expiry? How many attempts?</li>
                <li><strong>"users"</strong> — including locked-out or unverified ones?</li>
                <li>What happens on an <em>unknown</em> email — error, or silent (to avoid leaking which emails exist)?</li>
                <li>Can a reset link be reused? What if two are requested?</li>
              </ul>
              <div class="callout"><span class="k">Build a reusable review checklist</span><p>Turn your recurring questions into a checklist you run on every requirement: Is it <b>testable</b> (could I write a pass/fail case)? Is it <b>unambiguous</b>? Is it <b>complete</b> (error paths, edge cases)? Is it <b>consistent</b> with other requirements? Are terms <b>measurable</b> ("under 2s," not "fast")? The same checklist works on AI-generated specs and PRs.</p></div>` },
            { id: "f5p", title: "Practice — review a requirement", time: "25 min", kind: "practice",
              intro: "Confirm the review concepts, then do a real requirements review and build your reusable checklist.",
              quiz: [
                { q: "Reviewing a requirements doc for ambiguity before any code is written is…", options: ["Dynamic testing", "Static testing", "Regression testing"], answer: 1, why: "You're examining an artifact <em>without running software</em> — that's static testing, the cheapest place to remove a defect." },
                { q: "The most formal review type, with defined roles, entry/exit criteria, and metrics, is a…", options: ["Informal review", "Walkthrough", "Inspection"], answer: 2, why: "An <b>inspection</b> is the most formal, reserved for high-risk artifacts. A walkthrough is author-led and lighter; informal review is the lightest." },
                { q: "Which requirement is properly testable?", options: ["“The page should load quickly.”", "“The product list should render within 2 seconds on 4G.”", "“The app should feel fast.”"], answer: 1, why: "Only the middle one is measurable — you can write a pass/fail test for it. “Quickly” and “feel fast” can't be verified objectively." }
              ],
              tasks: [
                { title: "Review a requirement and write clarifying questions", prompt: "Review this requirement: <b>“The checkout should show the order total, including any discounts, and let the user pay easily.”</b> List every ambiguity or missing case you can find, then write <b>3 clarifying questions</b> you'd send back. Then reveal the example.",
                  model: `
                    <p><b>Ambiguities / gaps:</b></p>
                    <ul><li>Does "total" include tax and shipping, or only item price + discount?</li><li>"any discounts" — one code or several stacked? What if a code is invalid or expired?</li><li>"pay easily" — which payment methods? Is this even in scope for this ticket?</li><li>No error paths: what shows if the total can't be calculated, or the discount makes it negative?</li><li>No non-functional target: how fast must the total update after a code is applied?</li></ul>
                    <p><b>Three clarifying questions:</b></p>
                    <ul><li>Should the displayed total include tax and shipping, or just discounted item price? Please specify the exact formula.</li><li>Can multiple discount codes stack, and what's the expected behavior for an invalid/expired code?</li><li>What's the maximum acceptable time to recalculate and display the total after applying a discount?</li></ul>
                    <p><b>Your checklist should now include:</b> testable? unambiguous? complete (error paths)? consistent? measurable? Reuse it on the next requirement — and on AI-generated specs.</p>` }
              ] }
          ] },
      ] },
    { part: "Part 2 · Automation & Tooling", tag: "The employable core — Playwright-first", blurb: "Turn manual skill into automated suites with the tools employers actually hire for. Full lessons rolling out module by module — the curriculum below is final.",
      modules: [
        { id: "a1", title: "Just Enough JavaScript / TypeScript", meta: "Prereq-friendly",
          summary: "The small subset of JS/TS that test code actually uses — no full dev course required.",
          project: "Small scripts: variables, functions, arrays, and async/await.",
          lectures: [
            { id: "a1l1", title: "Variables, types & functions for testers", time: "12 min", body: `
              <p class="lead">You're not here to become a developer — you're here to <em>read and write test code</em>. That needs a surprisingly small slice of JavaScript, and this module teaches exactly that slice. (Want the whole language? Do a dedicated JS course alongside — that's the prerequisite we flagged. Here we cover only what tests use.)</p>
              <h2>Variables: name a value</h2>
              <p>Two keywords. Use <code>const</code> for a value that won't be reassigned (most of the time), and <code>let</code> for one that changes.</p>
              <pre class="cblock"><code>const user = "standard_user";  <span class="c">// a string, won't change</span>
const price = 29.99;           <span class="c">// a number</span>
let inCart = false;            <span class="c">// a boolean — will flip to true later</span>
inCart = true;                 <span class="c">// fine: declared with let</span></code></pre>
              <h2>The types you'll meet</h2>
              <p><strong>string</strong> (text in quotes), <strong>number</strong> (<code>29.99</code>, no quotes), <strong>boolean</strong> (<code>true</code>/<code>false</code>), and the two "empty" values <strong>null</strong> and <strong>undefined</strong> — which cause a huge share of real bugs when code forgets to check for them (remember the Bug Hunt crash on <code>p.image.url</code>).</p>
              <h2>Strict equality: <code>===</code>, not <code>==</code></h2>
              <p>Always compare with <code>===</code> (and <code>!==</code>). It checks value <em>and</em> type, with no surprise conversions. This is not pedantry — it's exactly the bug from Bug Hunt where an env var held <code>"live "</code> with a trailing space:</p>
              <pre class="cblock"><code>"live " === "live"   <span class="c">// false — the space makes them different</span>
1 === 1              <span class="c">// true</span>
0 === false          <span class="c">// false with ===  (would be TRUE with ==, a classic trap)</span></code></pre>
              <h2>Functions: a reusable action</h2>
              <p>A function takes inputs, does something, and usually <code>return</code>s a result. You'll see two shapes — both do the same thing:</p>
              <pre class="cblock"><code><span class="c">// classic declaration</span>
function total(price, qty) {
  return price * qty;
}

<span class="c">// arrow function — the short form you'll see everywhere in tests</span>
const total = (price, qty) =&gt; price * qty;

total(10, 3);  <span class="c">// 30</span></code></pre>
              <div class="callout"><span class="k">What about TypeScript?</span><p>TypeScript is JavaScript plus optional type labels (<code>price: number</code>). Playwright projects use it by default, but you can write plain JS inside and ignore the types while you learn — they'll quietly help you later by catching "you passed a string where a number goes" before the test even runs.</p></div>` },
            { id: "a1l2", title: "Arrays & objects — the shapes test data takes", time: "12 min", body: `
              <p class="lead">Test data has two shapes, and almost everything you'll touch is one, the other, or a nesting of both. Learn these and you can read most test code.</p>
              <h2>Arrays: an ordered list</h2>
              <p>Perfect for "a list of users to try" or "the products on the page." Items have a position (index), starting at <strong>0</strong>.</p>
              <pre class="cblock"><code>const users = ["standard_user", "locked_out_user", "problem_user"];

users.length;              <span class="c">// 3</span>
users[0];                  <span class="c">// "standard_user"  (first item = index 0)</span>
users.includes("problem_user");  <span class="c">// true</span>
users.forEach(u =&gt; console.log(u));  <span class="c">// run something for each item</span></code></pre>
              <h2>Objects: named fields</h2>
              <p>An object groups related values under keys — ideal for "a product" or "a test case." You read a field with a dot.</p>
              <pre class="cblock"><code>const product = { name: "Backpack", price: 29.99, inStock: true };

product.name;      <span class="c">// "Backpack"</span>
product.price;     <span class="c">// 29.99</span>
product.inStock;   <span class="c">// true</span></code></pre>
              <h2>The combo: an array of objects</h2>
              <p>This is a data table in code — and it's exactly how you'll drive many tests. Remember the decision table you built in Part 1? Here it is as data:</p>
              <pre class="cblock"><code>const loginCases = [
  { user: "standard_user",   valid: true  },
  { user: "locked_out_user", valid: false },
  { user: "",                valid: false },
];

loginCases.length;        <span class="c">// 3</span>
loginCases[1].user;       <span class="c">// "locked_out_user"</span></code></pre>
              <div class="callout"><span class="k">Why this matters for testing</span><p>A "data-driven test" loops over an array of cases like this and runs the same steps for each — turning your Part 1 decision table straight into automated coverage. You'll do exactly that in Module 4.</p></div>` },
            { id: "a1l3", title: "async / await — why tests are full of it", time: "14 min", body: `
              <p class="lead">Open almost any Playwright test and you'll see <code>await</code> on nearly every line. Understand this one idea and the rest of the course reads easily.</p>
              <h2>Some things take time</h2>
              <p>Clicking a button, loading a page, fetching from an API — none of these finish instantly. In JavaScript, an action that "will finish later" hands you a <strong>Promise</strong>: a placeholder for a result that isn't ready yet.</p>
              <h2><code>await</code> means "wait for it, then continue"</h2>
              <p>Put <code>await</code> in front of a Promise and the code pauses on that line until it's done — so the next line can safely use the result. A function that uses <code>await</code> must be marked <code>async</code>.</p>
              <pre class="cblock"><code>async function login(page) {
  await page.goto("https://www.saucedemo.com");  <span class="c">// wait for the page to load</span>
  await page.fill("#user-name", "standard_user"); <span class="c">// THEN type</span>
  await page.fill("#password", "secret_sauce");
  await page.click("#login-button");              <span class="c">// THEN click</span>
}</code></pre>
              <h2>Forget <code>await</code> and you get the classic flaky bug</h2>
              <p>Without it, the code races ahead before the action finishes. This is the exact intermittent bug from the Bug Hunt game — <code>fetchProduct</code> wasn't awaited, so <code>data</code> was still a Promise and <code>data.title</code> was <code>undefined</code>:</p>
              <pre class="cblock"><code><span class="c">// BROKEN: no await — data is a Promise, not the product</span>
const data = fetchProduct(url);
save({ title: data.title });   <span class="c">// undefined, saves a titleless record</span>

<span class="c">// FIXED</span>
const data = await fetchProduct(url);
save({ title: data.title });   <span class="c">// the real title</span></code></pre>
              <div class="callout"><span class="k">The rule of thumb</span><p>In Playwright, if a line touches the page or the network, it almost certainly needs <code>await</code>. A missing one is the number-one cause of tests that pass sometimes and fail others — the flakiness you'll learn to hunt in Module 4.</p></div>` },
            { id: "a1p", title: "Practice — check yourself + write small scripts", time: "25 min", kind: "practice",
              intro: "Confirm the JS subset, then write a few tiny functions by hand — the muscle memory you'll use in every test from here on.",
              quiz: [
                { q: "You have a value that never gets reassigned. Which keyword?", options: ["let", "const", "var"], answer: 1, why: "Use <code>const</code> for values that won't be reassigned — it's the safe default and signals intent. Reach for <code>let</code> only when the value actually changes." },
                { q: "What does <code>\"live \" === \"live\"</code> evaluate to?", options: ["true", "false"], answer: 1, why: "<b>false.</b> Strict equality compares exactly — the trailing space makes the strings different. This is the real trailing-space bug from the Bug Hunt: trim values at system seams." },
                { q: "In <code>const users = [\"a\", \"b\", \"c\"]</code>, what is <code>users[1]</code>?", options: ["\"a\"", "\"b\"", "\"c\""], answer: 1, why: "Arrays are zero-indexed: index 0 is \"a\", index 1 is \"b\". Off-by-one on indices is a common source of boundary bugs." },
                { q: "What does <code>await</code> do?", options: ["Runs the next line immediately", "Pauses until the Promise resolves, then continues", "Skips the line if it's slow"], answer: 1, why: "<code>await</code> pauses on that line until the async action finishes, so the result is ready for the next line. Forgetting it causes races and flaky tests." }
              ],
              tasks: [
                { title: "Write three tiny functions", prompt: "In any JS playground (your browser console works, or <code>node</code>), write: <b>(1)</b> a <code>total(price, qty)</code> that returns the product; <b>(2)</b> a function that takes the <code>users</code> array and returns the last element using <code>.length</code>; <b>(3)</b> an <code>async</code> function that <code>await</code>s a fake delay then logs \"done\". Then reveal to compare.",
                  model: `
                    <pre class="cblock"><code><span class="c">// 1</span>
const total = (price, qty) =&gt; price * qty;
total(29.99, 2);  <span class="c">// 59.98</span>

<span class="c">// 2 — last item without hardcoding the index</span>
const users = ["standard_user", "locked_out_user", "problem_user"];
const last = (arr) =&gt; arr[arr.length - 1];
last(users);  <span class="c">// "problem_user"</span>

<span class="c">// 3 — async/await</span>
const wait = (ms) =&gt; new Promise((r) =&gt; setTimeout(r, ms));
async function go() {
  await wait(500);
  console.log("done");
}
go();</code></pre>
                    <p><b>What this shows:</b> <code>arr.length - 1</code> is the idiom for "last element" and never goes out of bounds. And note every async result is reached through <code>await</code> — the habit you'll repeat in every Playwright test.</p>` }
              ] } ] },
        { id: "a2", title: "Git & the Developer Workflow", meta: "",
          summary: "Branches, commits, and pull requests — how testing plugs into how developers actually ship.",
          project: "A repo with a branch and a pull request you review.",
          lectures: [
            { id: "a2l1", title: "Git basics: clone, commit, branch, push", time: "12 min", body: `
              <p class="lead">Your tests live in the same repository as the code they test. To add them, review changes, and run them in CI, you need a working grasp of Git — not mastery, just the everyday loop.</p>
              <h2>The mental model</h2>
              <p>Git tracks the history of a project as a series of <strong>commits</strong> (saved snapshots). A <strong>repository</strong> (repo) holds that history. A <strong>branch</strong> is a parallel line of work so you can change things without disturbing the main version. <strong>Remote</strong> is the shared copy (e.g. on GitHub) everyone syncs with.</p>
              <h2>The everyday loop</h2>
              <pre class="cblock"><code>git clone &lt;url&gt;          <span class="c"># get a copy of the repo (once)</span>
git checkout -b add-login-test   <span class="c"># make + switch to a new branch</span>

<span class="c"># ...write your test file...</span>

git status               <span class="c"># what changed?</span>
git add tests/login.spec.ts   <span class="c"># stage the file for commit</span>
git commit -m "Add login test for SauceDemo"   <span class="c"># save a snapshot</span>
git push -u origin add-login-test   <span class="c"># send the branch to GitHub</span></code></pre>
              <h2>Why testers care about branches</h2>
              <p>Branches keep unfinished or risky work off the shared <code>main</code> version until it's reviewed and green. Your new test goes on a branch, runs in CI there, and only merges to <code>main</code> once it passes — so <code>main</code> stays deployable. That discipline is the backbone of the CI gate you'll build in Module 12.</p>
              <div class="callout"><span class="k">You don't need all of Git</span><p>Clone, branch, add, commit, push, pull — that six-verb loop covers ~90% of daily work. Merge conflicts and history rewriting can wait until you hit them. Learn the loop by doing it, not by reading the whole manual.</p></div>` },
            { id: "a2l2", title: "Pull requests & code review as static testing", time: "10 min", body: `
              <p class="lead">A pull request is where quality happens before anything runs — which makes reviewing one a form of <em>static testing</em>, the discipline you met in Part 1.</p>
              <h2>What a pull request is</h2>
              <p>A <strong>pull request</strong> (PR) proposes merging your branch into <code>main</code>. It shows the exact diff (what lines changed), runs the CI checks automatically, and gives teammates a place to comment before the change lands. Nothing merges until it's approved and green.</p>
              <h2>Reviewing is static testing</h2>
              <p>Reading a diff to find defects <em>without running it</em> is precisely static testing. On a QA team you'll review two things constantly: <strong>test code</strong> (is this test actually asserting something real, or will it pass no matter what?) and, increasingly, <strong>AI-written PRs</strong>.</p>
              <ul>
                <li><strong>Does the test assert?</strong> A test with no meaningful <code>expect</code> is a false sense of safety — it goes green forever.</li>
                <li><strong>Is it testing behavior, not implementation?</strong> Locators tied to brittle CSS will break on the next redesign.</li>
                <li><strong>For AI PRs: does the code handle the messy real input</strong> and the seams — the four blind spots from the manifesto — or only the happy path it imagined?</li>
              </ul>
              <div class="callout"><span class="k">Read it, then run it</span><p>Review proves the change is <em>plausible</em>; the CI run proves it's <em>true</em>. You need both. A PR that "looks right" but has no passing tests is exactly where AI-era regressions slip through.</p></div>` },
            { id: "a2p", title: "Practice — check yourself + open a PR", time: "25 min", kind: "practice",
              intro: "Confirm the workflow, then actually create a repo, branch, commit, and open a pull request — the loop you'll repeat for every test you write.",
              quiz: [
                { q: "What is the main purpose of working on a branch?", options: ["To make the code run faster", "To change things without disturbing the deployable main version", "To delete old commits"], answer: 1, why: "A branch isolates your work so <code>main</code> stays stable and deployable until your change is reviewed and passing." },
                { q: "Reviewing a pull request's diff to find defects before it runs is a form of…", options: ["Dynamic testing", "Static testing", "Load testing"], answer: 1, why: "Examining code without executing it is <b>static testing</b> — the cheapest place to catch a defect, straight from Part 1." },
                { q: "You spot a test in a PR that has no meaningful assertion. Why flag it?", options: ["It runs too slowly", "It will pass no matter what, giving false confidence", "It uses the wrong color"], answer: 1, why: "A test with no real <code>expect</code> can never fail — it's a false sense of safety that hides regressions instead of catching them." }
              ],
              tasks: [
                { title: "Create a repo, branch, commit, and open a PR", prompt: "On GitHub, create a new empty repo. Clone it, make a branch (<code>git checkout -b first-test</code>), add a small file (even a <code>tests/README.md</code>), commit it, and push. Open a pull request and write a two-line review comment on your own diff as if you were the reviewer. Then reveal the command sequence.",
                  model: `
                    <pre class="cblock"><code>git clone https://github.com/you/your-repo.git
cd your-repo
git checkout -b first-test
<span class="c"># create tests/README.md with a line of text</span>
git add tests/README.md
git commit -m "Add tests folder + placeholder"
git push -u origin first-test
<span class="c"># then on GitHub: "Compare & pull request" → open PR</span></code></pre>
                    <p><b>A good self-review comment names something concrete:</b> "This is a placeholder — before merge, the first real test should assert on the login redirect, not just that the page loads." That's you practicing static testing on your own work.</p>` }
              ] } ] },
        { id: "a3", title: "Web Automation with Playwright — Basics", meta: "",
          summary: "Drive a real browser: locators, actions, and assertions with auto-waiting built in.",
          project: "An automated test of SauceDemo login + the core happy path.",
          lectures: [
            { id: "a3l1", title: "Setup & your first Playwright test", time: "14 min", body: `
              <p class="lead">Time to make a browser do your bidding. Playwright is the tool employers hire for — it drives Chromium, Firefox, and WebKit from one script, with reliability built in. Let's install it and write a test that actually passes.</p>
              <h2>Install (one command)</h2>
              <p>With Node.js installed, in an empty folder run:</p>
              <pre class="cblock"><code>npm init playwright@latest</code></pre>
              <p>Accept the defaults (TypeScript, a <code>tests/</code> folder, browsers download). You now have a runnable example suite.</p>
              <h2>Anatomy of a test</h2>
              <p>Create <code>tests/login.spec.ts</code>. Every test has the same skeleton — import, name, and an async body that receives a fresh <code>page</code>:</p>
              <pre class="cblock"><code>import { test, expect } from '@playwright/test';

test('a shopper can log in', async ({ page }) =&gt; {
  await page.goto('https://www.saucedemo.com');
  await page.getByPlaceholder('Username').fill('standard_user');
  await page.getByPlaceholder('Password').fill('secret_sauce');
  await page.getByRole('button', { name: 'Login' }).click();

  await expect(page).toHaveURL(/inventory/);   <span class="c">// proof we're logged in</span>
});</code></pre>
              <p>Notice the Part-1 and Module-1 ideas showing up: it's an <code>async</code> function, every browser action is <code>await</code>ed, and it ends in an <strong>assertion</strong> — without that <code>expect</code>, the test proves nothing.</p>
              <h2>Run it</h2>
              <pre class="cblock"><code>npx playwright test            <span class="c"># run headless (no visible browser)</span>
npx playwright test --ui       <span class="c"># the UI mode — watch it step through, time-travel</span></code></pre>
              <div class="callout"><span class="k">Start in UI mode</span><p><code>--ui</code> shows each step, the DOM at every moment, and exactly where a failure happened. While you're learning, run there — it turns "why did it fail?" from a guess into something you can see.</p></div>` },
            { id: "a3l2", title: "Locators: finding elements that don't break", time: "14 min", body: `
              <p class="lead">A test is only as reliable as how it finds elements. Pick fragile locators and your suite breaks on every redesign; pick resilient ones and it survives. This is the highest-leverage skill in UI automation.</p>
              <h2>A locator is a durable handle on an element</h2>
              <p>Playwright locators don't grab the element once — they re-find it each time you use it, and auto-retry until it's there. Prefer locators that mirror <em>how a user perceives</em> the page, in this order:</p>
              <pre class="cblock"><code>page.getByRole('button', { name: 'Login' });  <span class="c">// best: role + accessible name</span>
page.getByPlaceholder('Username');             <span class="c">// form fields by placeholder</span>
page.getByText('Add to cart');                 <span class="c">// visible text</span>
page.getByTestId('add-to-cart-sauce-labs-backpack'); <span class="c">// a stable test hook</span></code></pre>
              <h2>Why role/text beats CSS and XPath</h2>
              <p>A selector like <code>.btn_primary > span:nth-child(2)</code> encodes the current markup — change the layout and it dies. Role- and text-based locators track what the element <em>is</em> and <em>says</em>, which changes far less often. As a bonus, <code>getByRole</code> only finds elements the accessibility tree exposes, so your tests quietly pressure the app toward being accessible.</p>
              <div class="callout"><span class="k">SauceDemo gives you test IDs</span><p>Inspect SauceDemo and you'll see <code>data-test</code> attributes on key elements — e.g. <code>data-test="username"</code>. Those map to <code>getByTestId('username')</code> and are the most stable locators of all, because they exist <em>for</em> testing and won't change with the design. When an app provides them, use them.</p></div>` },
            { id: "a3l3", title: "Actions, assertions & auto-waiting", time: "14 min", body: `
              <p class="lead">Three things make up almost every test: do something, check something, and — the part Playwright handles for you — wait for the app to be ready. Master these and you can automate most flows.</p>
              <h2>Actions</h2>
              <pre class="cblock"><code>await locator.click();
await locator.fill('standard_user');   <span class="c">// clears + types into an input</span>
await locator.check();                 <span class="c">// checkbox / radio</span>
await page.getByRole('combobox').selectOption('lohi');  <span class="c">// dropdown</span></code></pre>
              <h2>Assertions — the part that makes it a test</h2>
              <p>Use <code>expect</code> with a locator. These are <strong>web-first assertions</strong>: they automatically retry for a few seconds until the condition is met or they time out — no manual waiting.</p>
              <pre class="cblock"><code>await expect(page.getByText('Products')).toBeVisible();
await expect(page.locator('.shopping_cart_badge')).toHaveText('1');
await expect(page).toHaveURL(/checkout-complete/);</code></pre>
              <h2>Auto-waiting: delete your sleeps</h2>
              <p>Before every action, Playwright waits for the element to be present, visible, and actionable. Before every web-first assertion, it retries until true. That means you should <strong>never</strong> write fixed pauses like <code>sleep(2000)</code> — they're the root of both slow suites and flaky ones. Trust the auto-wait; assert on the outcome you actually want.</p>
              <div class="callout"><span class="k">Flakiness, prevented by design</span><p>Most flaky UI tests come from racing the app — checking before it's ready. Playwright's auto-waiting removes that entire class of bug <em>if</em> you let it: locate, act, and assert on real conditions instead of guessing at timing.</p></div>` },
            { id: "a3l4", title: "Automating the SauceDemo checkout", time: "16 min", body: `
              <p class="lead">Now assemble everything into one real end-to-end test: log in, add an item, check out, and prove the order completed. This is the "system-level" test from Part 1 — made executable.</p>
              <pre class="cblock"><code>import { test, expect } from '@playwright/test';

test('shopper completes a purchase', async ({ page }) =&gt; {
  <span class="c">// 1. log in</span>
  await page.goto('https://www.saucedemo.com');
  await page.getByTestId('username').fill('standard_user');
  await page.getByTestId('password').fill('secret_sauce');
  await page.getByTestId('login-button').click();

  <span class="c">// 2. add an item, confirm the cart badge</span>
  await page.getByTestId('add-to-cart-sauce-labs-backpack').click();
  await expect(page.locator('.shopping_cart_badge')).toHaveText('1');

  <span class="c">// 3. go to cart and check out</span>
  await page.locator('.shopping_cart_link').click();
  await page.getByTestId('checkout').click();
  await page.getByTestId('firstName').fill('Ada');
  await page.getByTestId('lastName').fill('Lovelace');
  await page.getByTestId('postalCode').fill('12345');
  await page.getByTestId('continue').click();

  <span class="c">// 4. finish and PROVE it worked</span>
  await page.getByTestId('finish').click();
  await expect(page.getByText('Thank you for your order!')).toBeVisible();
});</code></pre>
              <p>Read it back and notice the layers stack: resilient <code>getByTestId</code> locators, awaited actions, and — critically — <strong>assertions at the checkpoints that matter</strong> (badge count, final confirmation). A test that clicked through all of this but asserted nothing would pass even if checkout were broken.</p>
              <div class="callout"><span class="k">This is your Module 3 project</span><p>Get this running against the live SauceDemo. Then try it as <code>problem_user</code> — watch a real defect make a step or assertion fail. That's your automated suite catching the exact bugs you filed by hand in Part 1.</p></div>` },
            { id: "a3p", title: "Practice — check yourself + automate a purchase", time: "35 min", kind: "practice",
              intro: "Confirm the core concepts, then write and run a real Playwright test against SauceDemo. This is the first portfolio-worthy artifact of Part 2.",
              quiz: [
                { q: "Which locator is the most resilient to a redesign?", options: ["page.locator('.btn_primary > span:nth-child(2)')", "page.getByRole('button', { name: 'Login' })", "page.locator('div div div button')"], answer: 1, why: "Role + accessible name tracks what the element <em>is</em>, not its current markup, so it survives layout changes. The CSS-position selectors break the moment the structure shifts." },
                { q: "Playwright's auto-waiting means you should never write…", options: ["assertions", "fixed sleeps / fixed timeouts like sleep(2000)", "locators"], answer: 1, why: "Auto-waiting retries until elements are actionable and assertions are true, so fixed sleeps are unnecessary — and they're the main cause of slow, flaky suites." },
                { q: "A test clicks through the entire checkout but has no <code>expect</code>. What's wrong?", options: ["Nothing — clicking through is enough", "It proves nothing; it will pass even if checkout is broken", "It runs too fast"], answer: 1, why: "Without an assertion, there's no pass/fail signal — the test goes green regardless. A test is only a test if it <em>checks</em> something." },
                { q: "SauceDemo exposes <code>data-test</code> attributes. The matching locator is…", options: ["getByTestId('username')", "getByRole('username')", "getByText('username')"], answer: 0, why: "<code>data-test=\"username\"</code> maps to <code>getByTestId('username')</code> — the most stable locator because it exists specifically for testing and won't change with the design." }
              ],
              tasks: [
                { title: "Write & run a SauceDemo purchase test", prompt: "Set up Playwright (<code>npm init playwright@latest</code>) and write a test that logs in as <code>standard_user</code>, adds <b>two</b> different items, asserts the cart badge shows <code>2</code>, then completes checkout and asserts the \"Thank you for your order!\" confirmation. Run it in <code>--ui</code> mode. Bonus: run the same test as <code>problem_user</code> and note what fails. Reveal to compare.",
                  model: `
                    <pre class="cblock"><code>import { test, expect } from '@playwright/test';

test('purchase two items', async ({ page }) =&gt; {
  await page.goto('https://www.saucedemo.com');
  await page.getByTestId('username').fill('standard_user');
  await page.getByTestId('password').fill('secret_sauce');
  await page.getByTestId('login-button').click();

  await page.getByTestId('add-to-cart-sauce-labs-backpack').click();
  await page.getByTestId('add-to-cart-sauce-labs-bike-light').click();
  await expect(page.locator('.shopping_cart_badge')).toHaveText('2');

  await page.locator('.shopping_cart_link').click();
  await page.getByTestId('checkout').click();
  await page.getByTestId('firstName').fill('Ada');
  await page.getByTestId('lastName').fill('Lovelace');
  await page.getByTestId('postalCode').fill('12345');
  await page.getByTestId('continue').click();
  await page.getByTestId('finish').click();

  await expect(page.getByText('Thank you for your order!')).toBeVisible();
});</code></pre>
                    <p><b>What a strong solution shows:</b> stable <code>getByTestId</code> locators, an assertion on the badge <em>and</em> the final confirmation (two real checkpoints), and no fixed sleeps anywhere. Running as <code>problem_user</code> surfaces real defects — some add-to-cart buttons misbehave — which is your automation catching what you filed manually in Part 1.</p>` }
              ] } ] },
        { id: "a4", title: "Playwright — Robust, Maintainable Suites", meta: "",
          summary: "The patterns that keep a suite alive as the app changes: Page Object Model, fixtures, resilient locators, and the trace viewer.",
          project: "Refactor your suite with POM, fixtures, and cross-browser runs.",
          lectures: [
            { id: "a4l1", title: "The Page Object Model", time: "14 min", body: `
              <p class="lead">Your first tests work — but paste the same login steps into ten tests and you've built a maintenance trap. The Page Object Model (POM) is the pattern that keeps a growing suite from collapsing under its own weight.</p>
              <h2>The problem POM solves</h2>
              <p>When the login markup changes, a suite with the steps copy-pasted everywhere breaks in ten places. POM puts each page's locators and actions in <em>one class</em>, so a UI change is a one-line fix in one file.</p>
              <pre class="cblock"><code><span class="c">// pages/LoginPage.ts — one home for everything "login"</span>
export class LoginPage {
  constructor(page) { this.page = page; }

  async goto() {
    await this.page.goto('https://www.saucedemo.com');
  }

  async login(user, pass) {
    await this.page.getByTestId('username').fill(user);
    await this.page.getByTestId('password').fill(pass);
    await this.page.getByTestId('login-button').click();
  }
}</code></pre>
              <p>Tests now read like intent, not mechanics:</p>
              <pre class="cblock"><code>const login = new LoginPage(page);
await login.goto();
await login.login('standard_user', 'secret_sauce');
await expect(page).toHaveURL(/inventory/);</code></pre>
              <div class="callout"><span class="k">Keep assertions in the test</span><p>Page objects hold <em>actions and locators</em>; keep the <code>expect</code>s in the test itself. That way the page object stays reusable and each test still clearly states what it's verifying.</p></div>` },
            { id: "a4l2", title: "Fixtures & test setup/teardown", time: "12 min", body: `
              <p class="lead">Most tests share setup — a logged-in page, seeded data, a fresh cart. Fixtures give you that setup cleanly, so every test starts from a known state without copy-paste.</p>
              <h2>The quick version: hooks</h2>
              <p><code>beforeEach</code> runs before every test in a file; <code>afterEach</code> cleans up after. Good for simple, local setup.</p>
              <pre class="cblock"><code>test.beforeEach(async ({ page }) =&gt; {
  await page.goto('https://www.saucedemo.com');
});</code></pre>
              <h2>The powerful version: custom fixtures</h2>
              <p>A fixture packages reusable setup as something a test can just ask for by name. Here's a fixture that hands every test a ready-to-use <code>LoginPage</code>:</p>
              <pre class="cblock"><code>import { test as base } from '@playwright/test';
import { LoginPage } from './pages/LoginPage';

export const test = base.extend({
  loginPage: async ({ page }, use) =&gt; {
    await use(new LoginPage(page));   <span class="c">// setup before, teardown after</span>
  },
});

<span class="c">// now any test can request it:</span>
test('locked-out user is blocked', async ({ loginPage, page }) =&gt; {
  await loginPage.goto();
  await loginPage.login('locked_out_user', 'secret_sauce');
  await expect(page.getByText('locked out')).toBeVisible();
});</code></pre>
              <div class="callout"><span class="k">Why this matters</span><p>Fixtures make each test <em>independent and repeatable</em> — a core testing principle. No test should depend on another running first; fixtures give each one its own clean starting line.</p></div>` },
            { id: "a4l3", title: "Debugging with the trace viewer", time: "12 min", body: `
              <p class="lead">When a test fails — especially one that only fails in CI — the trace viewer is the single most valuable tool Playwright gives you. It's a full recording of the run you can step through frame by frame.</p>
              <h2>Turn it on</h2>
              <p>In <code>playwright.config.ts</code>, capture a trace when a test retries:</p>
              <pre class="cblock"><code>use: { trace: 'on-first-retry' }</code></pre>
              <p>After a failing run, open the recorded trace:</p>
              <pre class="cblock"><code>npx playwright show-trace trace.zip</code></pre>
              <h2>What you get</h2>
              <ul>
                <li>Every action as a timeline, with a <strong>DOM snapshot</strong> before and after — you see exactly what the page looked like when it failed.</li>
                <li>The network calls, console logs, and the source line for each step.</li>
                <li>Time-travel: hover any step and the page state at that instant appears.</li>
              </ul>
              <div class="callout"><span class="k">"Works on my machine, fails in CI"</span><p>This is the tool that ends that argument. The CI trace shows the <em>actual</em> state that failed — a not-yet-loaded element, a cookie banner covering your button, a different viewport. You stop guessing and start seeing.</p></div>` },
            { id: "a4l4", title: "Cross-browser: Chromium, Firefox, WebKit", time: "10 min", body: `
              <p class="lead">Real users aren't all on Chrome. Playwright's superpower is running the <em>same</em> test across Chromium, Firefox, and WebKit (Safari's engine) with no code changes — just configuration.</p>
              <h2>Projects</h2>
              <p>In <code>playwright.config.ts</code>, each browser is a "project." Define them once and every test runs on all three:</p>
              <pre class="cblock"><code>projects: [
  { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
  { name: 'firefox',  use: { ...devices['Desktop Firefox'] } },
  { name: 'webkit',   use: { ...devices['Desktop Safari'] } },
]</code></pre>
              <p>Run one browser while developing, all three in CI:</p>
              <pre class="cblock"><code>npx playwright test --project=chromium   <span class="c"># fast local loop</span>
npx playwright test                      <span class="c"># all projects</span></code></pre>
              <div class="callout"><span class="k">Where cross-browser bugs hide</span><p>Date pickers, CSS layout, and form validation behave differently across engines — WebKit especially. Running all three is how you catch the "broken only on Safari" bug (a P0/P1 in your Part 1 triage) <em>before</em> a user does.</p></div>` },
            { id: "a4p", title: "Practice — check yourself + refactor to POM", time: "30 min", kind: "practice",
              intro: "Confirm the maintainability patterns, then refactor your Module 3 test to use a page object — the change that makes a suite survive a redesign.",
              quiz: [
                { q: "What problem does the Page Object Model primarily solve?", options: ["Tests run faster", "A UI change becomes a one-place fix instead of breaking every test", "It removes the need for assertions"], answer: 1, why: "POM centralizes each page's locators and actions, so when the markup changes you fix one file instead of hunting through every test. Assertions still belong in the tests." },
                { q: "What is a Playwright fixture mainly for?", options: ["Styling the report", "Providing clean, reusable setup so each test starts from a known, independent state", "Making the browser visible"], answer: 1, why: "Fixtures package reusable setup/teardown and keep tests independent and repeatable — no test should depend on another having run first." },
                { q: "A test passes locally but fails in CI. Which tool shows you the actual failing state?", options: ["console.log everywhere", "The trace viewer (DOM snapshots + timeline of the CI run)", "Re-running until it passes"], answer: 1, why: "The trace viewer records the real run — DOM snapshots, network, and the exact step that failed — so you see what actually happened in CI instead of guessing." },
                { q: "Why run tests on WebKit as well as Chromium?", options: ["It's required by law", "To catch engine-specific bugs (layout, dates, validation) that only appear in Safari's engine", "WebKit is faster"], answer: 1, why: "Different engines render and validate differently; WebKit surfaces the 'broken only on Safari' class of bug before real users hit it." }
              ],
              tasks: [
                { title: "Refactor your checkout test to use a page object", prompt: "Take your Module 3 SauceDemo test and extract the login steps into a <code>LoginPage</code> class with <code>goto()</code> and <code>login(user, pass)</code> methods. Update the test to use it. Bonus: add a <code>beforeEach</code> that navigates to the site. Then reveal to compare.",
                  model: `
                    <pre class="cblock"><code><span class="c">// pages/LoginPage.ts</span>
export class LoginPage {
  constructor(page) { this.page = page; }
  async goto() { await this.page.goto('https://www.saucedemo.com'); }
  async login(user, pass) {
    await this.page.getByTestId('username').fill(user);
    await this.page.getByTestId('password').fill(pass);
    await this.page.getByTestId('login-button').click();
  }
}

<span class="c">// tests/checkout.spec.ts</span>

import { LoginPage } from '../pages/LoginPage';

test('shopper completes a purchase', async ({ page }) =&gt; {
  const login = new LoginPage(page);
  await login.goto();
  await login.login('standard_user', 'secret_sauce');
  await expect(page).toHaveURL(/inventory/);
  <span class="c">// ...rest of the checkout flow...</span>
});</code></pre>
                    <p><b>What a strong refactor shows:</b> the locators live only in <code>LoginPage</code>, the test reads as intent, and the <code>expect</code> stays in the test. Now a login redesign is a one-file change — that's the whole point.</p>` }
              ] } ] },
        { id: "a5", title: "Visual & Accessibility Checks", meta: "",
          summary: "Catch what the model can't perceive: layout breakage and accessibility violations, automated.",
          project: "Add axe accessibility assertions + screenshot diffs to your suite.",
          lectures: [
            { id: "a5l1", title: "Accessibility testing with axe-core", time: "14 min", body: `
              <p class="lead">Accessibility is where AI is most reliably blind: a model almost never checks color contrast, focus order, or whether a button has a label. axe-core drops those checks straight into your Playwright run — and it's fast to add.</p>
              <h2>Why it's an AI-era priority</h2>
              <p>Generated markup looks fine and reads fine to the model, but ships icon-only buttons with no accessible name, form fields with no label, and text with failing contrast. Real users relying on a screen reader or keyboard hit a wall. axe catches a large share of these automatically.</p>
              <h2>Add it to a test</h2>
              <pre class="cblock"><code>import { test, expect } from '@playwright/test';
import AxeBuilder from '@axe-core/playwright';

test('inventory page has no critical a11y violations', async ({ page }) =&gt; {
  await page.goto('https://www.saucedemo.com/inventory.html');
  const results = await new AxeBuilder({ page }).analyze();
  expect(results.violations).toEqual([]);   <span class="c">// fail the build on any violation</span>
});</code></pre>
              <p>Each violation comes with the rule, the impact (minor → critical), and the exact elements — so a failure tells you precisely what to fix.</p>
              <div class="callout"><span class="k">Scope it so it's useful</span><p>Failing on <em>every</em> violation at once can be noisy on a legacy app. Start by gating on <code>critical</code> and <code>serious</code> impacts, or scope axe to the component you're building, then ratchet up. A check people disable helps no one.</p></div>` },
            { id: "a5l2", title: "Visual regression with screenshot diffs", time: "12 min", body: `
              <p class="lead">Some bugs are invisible to functional tests but obvious to a human: an overlapping icon, a collapsed card, text spilling out of a button. Visual regression catches the layout breakage a model can't perceive from source.</p>
              <h2>How it works</h2>
              <p>The first run saves a <strong>baseline</strong> screenshot. Every later run compares against it and fails if pixels differ beyond a threshold.</p>
              <pre class="cblock"><code>await expect(page).toHaveScreenshot('inventory.png');</code></pre>
              <p>Update baselines intentionally when a change is expected:</p>
              <pre class="cblock"><code>npx playwright test --update-snapshots</code></pre>
              <h2>Taming false positives</h2>
              <ul>
                <li><strong>Mask dynamic areas</strong> (dates, ads, carousels) so they don't trip the diff: <code>toHaveScreenshot({ mask: [page.locator('.timestamp')] })</code>.</li>
                <li><strong>Pin the viewport and fonts</strong> so renders are deterministic across machines.</li>
                <li>Review diffs like code — an intentional redesign updates the baseline; an accidental one is a caught bug.</li>
              </ul>
              <div class="callout"><span class="k">Playwright vs Chromatic</span><p>Playwright's built-in <code>toHaveScreenshot</code> is free and lives in your suite. <b>Chromatic</b> (with Storybook) does component-level visual review with a hosted UI and is worth it once a team reviews visuals together. Start with the built-in.</p></div>` },
            { id: "a5p", title: "Practice — check yourself + fail a build on a11y", time: "25 min", kind: "practice",
              intro: "Confirm the two 'perception' checks, then wire axe into a test and watch it catch a real violation.",
              quiz: [
                { q: "Which class of bug is axe-core best at catching that AI routinely misses?", options: ["Wrong tax calculation", "Missing labels, poor contrast, broken focus order", "A slow API endpoint"], answer: 1, why: "axe checks accessibility — labels, contrast, roles, focus — exactly the things a model doesn't perceive from source. Tax math is functional; API speed is performance." },
                { q: "Visual regression testing catches…", options: ["Logic errors in a function", "Layout breakage a human sees but functional tests miss (overlap, collapse, overflow)", "Missing await calls"], answer: 1, why: "Screenshot diffs surface visual breakage that passes every functional assertion — an overlapping icon or collapsed card the model can't perceive from code." },
                { q: "Your visual test fails because a timestamp on the page changed. Best fix?", options: ["Delete the visual test", "Mask the dynamic timestamp region so it's excluded from the diff", "Lower the resolution"], answer: 1, why: "Mask dynamic areas (timestamps, ads) so legitimate changes don't cause false positives, while real layout regressions still fail the diff." }
              ],
              tasks: [
                { title: "Add an axe check that catches a real violation", prompt: "Install <code>@axe-core/playwright</code> and add a test that runs <code>AxeBuilder</code> on a page and asserts no <b>critical/serious</b> violations. Point it at a page you know has issues (or temporarily remove a label). Read the violation output and note the rule + affected element. Reveal to compare.",
                  model: `
                    <pre class="cblock"><code>import { test, expect } from '@playwright/test';
import AxeBuilder from '@axe-core/playwright';

test('no serious+ a11y violations', async ({ page }) =&gt; {
  await page.goto('https://www.saucedemo.com/inventory.html');
  const results = await new AxeBuilder({ page })
    .withTags(['wcag2a', 'wcag2aa'])
    .analyze();

  const serious = results.violations.filter(
    (v) =&gt; v.impact === 'critical' || v.impact === 'serious'
  );
  expect(serious).toEqual([]);
});</code></pre>
                    <p><b>What a strong answer shows:</b> gating on <code>critical/serious</code> (not every minor nit), using WCAG tags to scope the rules, and reading the violation's <code>id</code> and <code>nodes</code> to know exactly what to fix. That output <em>is</em> your bug report.</p>` }
              ] } ] },
        { id: "a6", title: "API Testing", meta: "",
          summary: "Test below the UI — faster, more stable — against a real public API.",
          project: "A suite testing restful-booker (REST) plus one GraphQL query.",
          lectures: [
            { id: "a6l1", title: "HTTP & REST for testers", time: "12 min", body: `
              <p class="lead">Under every UI is an API. Testing it directly is faster, far more stable, and reaches error cases the UI can't easily produce. First, the vocabulary.</p>
              <h2>The request</h2>
              <p>An HTTP request has a <strong>method</strong>, a <strong>URL</strong>, optional <strong>headers</strong> (auth, content type), and often a <strong>body</strong> (JSON). The methods map to actions:</p>
              <div class="term"><span class="w">GET</span><span class="m">Read data. No body. Should never change anything.</span></div>
              <div class="term"><span class="w">POST</span><span class="m">Create something new. Sends a body.</span></div>
              <div class="term"><span class="w">PUT / PATCH</span><span class="m">Update an existing thing (fully / partially).</span></div>
              <div class="term"><span class="w">DELETE</span><span class="m">Remove it.</span></div>
              <h2>The response</h2>
              <p>Back comes a <strong>status code</strong> and usually a JSON <strong>body</strong>. Learn the families:</p>
              <ul>
                <li><strong>2xx</strong> success — <code>200</code> OK, <code>201</code> Created.</li>
                <li><strong>4xx</strong> you sent something wrong — <code>400</code> bad request, <code>401</code> unauthenticated, <code>403</code> forbidden, <code>404</code> not found.</li>
                <li><strong>5xx</strong> the server broke — <code>500</code>. Never the client's fault.</li>
              </ul>
              <div class="callout"><span class="k">Your practice API</span><p>We'll use <b>restful-booker</b> (<code>restful-booker.herokuapp.com</code>) — a free public API built for practice, with create/read/update/delete on hotel bookings and token auth. It's the API equivalent of SauceDemo.</p></div>` },
            { id: "a6l2", title: "Automated API tests (restful-booker)", time: "16 min", body: `
              <p class="lead">Playwright ships an API client — the <code>request</code> fixture — so you can test APIs with the same tool, no UI involved. Let's create a booking and verify it.</p>
              <h2>Create, then read back</h2>
              <pre class="cblock"><code>import { test, expect } from '@playwright/test';

const BASE = 'https://restful-booker.herokuapp.com';

test('create and fetch a booking', async ({ request }) =&gt; {
  <span class="c">// POST creates it</span>
  const res = await request.post(BASE + '/booking', {
    data: {
      firstname: 'Ada', lastname: 'Lovelace',
      totalprice: 100, depositpaid: true,
      bookingdates: { checkin: '2026-01-01', checkout: '2026-01-05' },
    },
  });
  expect(res.status()).toBe(200);

  const body = await res.json();
  const id = body.bookingid;
  expect(body.booking.firstname).toBe('Ada');

  <span class="c">// GET reads it back</span>
  const got = await request.get(BASE + '/booking/' + id);
  expect(got.status()).toBe(200);
  expect((await got.json()).lastname).toBe('Lovelace');
});</code></pre>
              <h2>What to assert</h2>
              <ul>
                <li><strong>Status code</strong> — the first, cheapest signal.</li>
                <li><strong>Body shape and values</strong> — the fields you sent came back correct.</li>
                <li><strong>Error paths</strong> — request a missing id, expect <code>404</code>; send bad data, expect <code>400/500</code>. These are trivial via API and painful via UI.</li>
              </ul>
              <div class="callout"><span class="k">Auth for writes</span><p>Updating or deleting a booking needs a token: POST to <code>/auth</code> with the demo credentials, grab the token from the response, and send it as a cookie/header on your <code>PUT</code>/<code>DELETE</code>. Testing the auth boundary — a write with <em>no</em> token should be rejected — is exactly the kind of seam bug the manifesto warned about.</p></div>` },
            { id: "a6l3", title: "A first GraphQL query test", time: "10 min", body: `
              <p class="lead">GraphQL is increasingly common, and testing it is simpler than it looks: it's usually one endpoint you POST a query to, and you assert on the JSON that comes back.</p>
              <h2>The shape</h2>
              <p>Instead of many URLs, GraphQL has a single endpoint (often <code>/graphql</code>). You POST a <em>query</em> describing exactly the fields you want, and get back JSON in that shape.</p>
              <pre class="cblock"><code>test('graphql: fetch a country name', async ({ request }) =&gt; {
  const res = await request.post('https://countries.trevorblades.com/', {
    data: { query: '{ country(code: "IL") { name capital } }' },
  });
  expect(res.status()).toBe(200);

  const body = await res.json();
  expect(body.data.country.name).toBe('Israel');
});</code></pre>
              <div class="callout"><span class="k">Two GraphQL gotchas testers must know</span><p>First, GraphQL often returns <code>200</code> even on errors — the real errors live in an <code>errors</code> array in the body, so assert on <code>body.errors</code>, not just the status. Second, you only get the fields you ask for, so a test can under-fetch and miss a broken field — request what you actually need to verify.</p></div>` },
            { id: "a6p", title: "Practice — check yourself + test an API end to end", time: "30 min", kind: "practice",
              intro: "Confirm the HTTP fundamentals, then write a real create-read-delete flow against restful-booker — the most portable testing skill you'll learn.",
              quiz: [
                { q: "You request a booking id that doesn't exist. Which status code do you expect?", options: ["200 OK", "404 Not Found", "500 Server Error"], answer: 1, why: "A missing resource should return <code>404</code>. A <code>500</code> here would itself be a bug (the server failing instead of cleanly saying 'not found')." },
                { q: "Why test the API layer directly instead of only through the UI?", options: ["It looks nicer", "It's faster, more stable, and can reach error cases the UI can't easily produce", "The UI can't be tested"], answer: 1, why: "API tests skip browser flakiness, run in milliseconds, and can trigger 400/401/404/500 paths that are hard to force through the UI." },
                { q: "A GraphQL request returns status 200 but the data is wrong. Where do you look?", options: ["The status code — it must be lying", "The <code>errors</code> array in the response body", "The browser console"], answer: 1, why: "GraphQL commonly returns 200 even on failures; the actual problems are in the response body's <code>errors</code> array, so you must assert on it." }
              ],
              tasks: [
                { title: "Create → read → delete a booking", prompt: "Against <code>restful-booker.herokuapp.com</code>: <b>(1)</b> POST <code>/auth</code> to get a token; <b>(2)</b> POST <code>/booking</code> to create one and capture its <code>bookingid</code>; <b>(3)</b> GET it back and assert a field; <b>(4)</b> DELETE it with the token and assert it's gone (a follow-up GET returns 404). Reveal to compare.",
                  model: `
                    <pre class="cblock"><code>const BASE = 'https://restful-booker.herokuapp.com';

test('full booking lifecycle', async ({ request }) =&gt; {
  <span class="c">// 1. auth</span>
  const auth = await request.post(BASE + '/auth', {
    data: { username: 'admin', password: 'password123' },
  });
  const token = (await auth.json()).token;

  <span class="c">// 2. create</span>
  const created = await request.post(BASE + '/booking', {
    data: { firstname: 'Grace', lastname: 'Hopper', totalprice: 200,
            depositpaid: true,
            bookingdates: { checkin: '2026-02-01', checkout: '2026-02-03' } },
  });
  const id = (await created.json()).bookingid;

  <span class="c">// 3. read back</span>
  const got = await request.get(BASE + '/booking/' + id);
  expect((await got.json()).firstname).toBe('Grace');

  <span class="c">// 4. delete + confirm gone</span>
  const del = await request.delete(BASE + '/booking/' + id, {
    headers: { Cookie: 'token=' + token },
  });
  expect(del.status()).toBe(201);
  const gone = await request.get(BASE + '/booking/' + id);
  expect(gone.status()).toBe(404);
});</code></pre>
                    <p><b>What a strong answer shows:</b> it captures the token and threads it into the authenticated DELETE, and it <em>proves</em> the delete worked by asserting a follow-up GET returns 404 — verifying the outcome, not just trusting the delete's status.</p>` }
              ] } ] },
        { id: "a7", title: "CI/CD — Run Everything Automatically", meta: "",
          summary: "The enforcement layer: your suite runs on every push and blocks merge on red.",
          project: "A GitHub Actions pipeline that gates merges on your tests.",
          lectures: [
            { id: "a7l1", title: "Your first GitHub Actions workflow", time: "14 min", body: `
              <p class="lead">A test suite no one runs is theater. CI is what turns "we have tests" into "you physically cannot merge past them." It's the single change that stops the AI — and you — from re-breaking things, because the failing build blocks the door.</p>
              <h2>A workflow is a YAML file in your repo</h2>
              <p>Create <code>.github/workflows/tests.yml</code>. GitHub runs it automatically on every push and pull request:</p>
              <pre class="cblock"><code>name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test</code></pre>
              <p>Read it top-down: on a push, spin up a fresh Linux machine, check out the code, install Node, install dependencies and browsers, run the suite. If any test fails, the job fails — and that failure is visible right on the pull request.</p>
              <div class="callout"><span class="k">This closes the loop from Article 1</span><p>Remember the manifesto: the AI re-broke the same feature three times because nothing held the fix in place. <em>This file is what holds it.</em> Every bug you turned into a test now runs here, on every change, forever — the ratchet that only moves quality forward.</p></div>` },
            { id: "a7l2", title: "Quality gates, parallelization & reports", time: "12 min", body: `
              <p class="lead">Running the tests is step one. Making them an enforceable gate — fast, and diagnosable when they fail — is what makes CI trustworthy instead of ignorable.</p>
              <h2>The gate: block merge on red</h2>
              <p>In GitHub → Settings → Branches, add a <strong>branch protection rule</strong> on <code>main</code> that requires the <code>tests</code> check to pass before merging. Now a red build isn't a suggestion — it's a locked door. That's the difference between having tests and being governed by them.</p>
              <h2>Keep it fast</h2>
              <ul>
                <li><strong>Parallelize / shard</strong> — Playwright splits tests across workers automatically, and you can shard across CI machines so a big suite still finishes in minutes.</li>
                <li><strong>Cache</strong> dependencies and browser binaries between runs.</li>
                <li><strong>Run smoke first</strong> — your Part 1 smoke layer as a quick gate, the full regression suite after.</li>
              </ul>
              <h2>When it fails, make it diagnosable</h2>
              <p>Upload the Playwright HTML report and traces as build artifacts, so a failure gives you the report and a time-travel trace instead of a wall of log text:</p>
              <pre class="cblock"><code>- uses: actions/upload-artifact@v4
  if: always()
  with:
    name: playwright-report
    path: playwright-report/</code></pre>
              <div class="callout"><span class="k">Handle flakiness honestly</span><p>Set a small retry count for genuinely flaky tests, but <em>track</em> what retried — a test that only passes on retry is a bug in the test or the app, not a win. Silent retries hide rot; visible ones get fixed.</p></div>` },
            { id: "a7p", title: "Practice — check yourself + gate a repo on green", time: "25 min", kind: "practice",
              intro: "Confirm what CI is really for, then add a workflow to a repo and make a red build block a merge.",
              quiz: [
                { q: "What's the core purpose of CI for quality?", options: ["To make tests look official", "To run the suite automatically on every change and block merges when it's red", "To replace writing tests"], answer: 1, why: "CI is the enforcement layer — it runs your tests on every push/PR and, with branch protection, prevents merging broken code. It doesn't replace tests; it makes them binding." },
                { q: "A test in CI only passes when it's retried. What does that mean?", options: ["Success — ship it", "It's a signal of a real flaky bug in the test or app that should be investigated, not hidden", "CI is broken"], answer: 1, why: "Passing only on retry means something is genuinely unstable. Retries can keep the pipeline moving, but a tracked retry is a bug to fix — not a pass to celebrate." },
                { q: "Why upload the Playwright report and traces as CI artifacts?", options: ["To use more storage", "So a failure is diagnosable — you get the report and a time-travel trace instead of just logs", "It makes tests faster"], answer: 1, why: "Artifacts turn a CI failure into something you can actually debug: the HTML report and trace show the exact failing state, no guessing." }
              ],
              tasks: [
                { title: "Add CI and watch a red build block a merge", prompt: "Add <code>.github/workflows/tests.yml</code> to your Playwright repo so the suite runs on every push and PR. Enable a branch protection rule requiring the check to pass on <code>main</code>. Then open a PR that deliberately breaks a test and confirm the merge button is blocked. Reveal to compare.",
                  model: `
                    <pre class="cblock"><code><span class="c"># .github/workflows/tests.yml</span>
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/</code></pre>
                    <p><b>Then:</b> Settings → Branches → add rule on <code>main</code> → "Require status checks to pass" → select <code>test</code>. Open a PR that changes an assertion to something false. <b>What a strong result shows:</b> the check goes red and the merge button is disabled — you've turned your tests into a law, exactly the outcome Article 2 argued for.</p>` }
              ] } ] },
        { id: "a8", title: "Performance & Load Testing", meta: "",
          summary: "Put numbers and thresholds on “fast enough” with k6.",
          project: "A k6 load test with pass/fail thresholds on an endpoint.",
          lectures: [
            { id: "a8l1", title: "Performance concepts & metrics", time: "12 min", body: `
              <p class="lead">"Is it fast enough?" isn't an opinion — it's a measurement against a target. Performance testing turns vague worry into pass/fail numbers. First, the concepts that keep you honest.</p>
              <h2>The metrics that matter</h2>
              <div class="term"><span class="w">Latency / response time</span><span class="m">How long one request takes. The number users feel.</span></div>
              <div class="term"><span class="w">Throughput</span><span class="m">Requests handled per second. How much load the system takes.</span></div>
              <div class="term"><span class="w">Percentiles (p95, p99)</span><span class="m">"95% of requests were faster than X." The honest way to report speed — because averages hide the slow tail.</span></div>
              <h2>Why the average lies</h2>
              <p>If 90 requests take 100ms and 10 take 5 seconds, the "average" looks fine while one user in ten has a terrible time. <strong>p95 and p99</strong> expose that tail. Always set targets on percentiles, never the mean.</p>
              <h2>Kinds of performance test</h2>
              <ul>
                <li><strong>Load</strong> — expected traffic. Does it hold up on a normal day?</li>
                <li><strong>Stress</strong> — push past the limit to find the breaking point and how it fails.</li>
                <li><strong>Soak</strong> — normal load for hours, to catch memory leaks and slow degradation (a bug-over-time the AI never sees).</li>
                <li><strong>Spike</strong> — sudden surge, like a launch or a sale.</li>
              </ul>
              <div class="callout"><span class="k">This is a non-functional type</span><p>From Part 1's map: performance is a <em>non-functional</em> requirement. "The product list loads for 500 concurrent users with p95 under 500ms" is testable, measurable, and exactly the kind of requirement you learned to demand instead of "it should be fast."</p></div>` },
            { id: "a8l2", title: "Writing a k6 test with thresholds", time: "14 min", body: `
              <p class="lead">k6 is a modern load-testing tool where you write the test in JavaScript — familiar ground now — and set <strong>thresholds</strong> that make it pass or fail automatically, so it can live in CI like any other test.</p>
              <h2>A complete load test</h2>
              <pre class="cblock"><code>import http from 'k6/http';
import { check, sleep } from 'k6';

export const options = {
  vus: 10,               <span class="c">// 10 virtual users, concurrently</span>
  duration: '30s',       <span class="c">// for 30 seconds</span>
  thresholds: {
    http_req_duration: ['p(95)&lt;500'],   <span class="c">// 95% of requests under 500ms — or FAIL</span>
    http_req_failed:   ['rate&lt;0.01'],    <span class="c">// under 1% errors</span>
  },
};

export default function () {
  const res = http.get('https://test.k6.io');
  check(res, { 'status is 200': (r) =&gt; r.status === 200 });
  sleep(1);
}</code></pre>
              <p>Run it with <code>k6 run script.js</code>. The magic is the <code>thresholds</code> block: if p95 latency exceeds 500ms or the error rate passes 1%, k6 exits non-zero — which means CI marks the build red, exactly like a failed functional test.</p>
              <div class="callout"><span class="k">Set the threshold from a real target, then defend it</span><p>A threshold is only meaningful if the number comes from a requirement ("checkout must feel instant → p95 &lt; 500ms"), not a guess. When it fails, you have a concrete, defensible bug: "at 10 concurrent users, p95 was 820ms against a 500ms target" — not "the site felt slow."</p></div>` },
            { id: "a8p", title: "Practice — check yourself + set a threshold", time: "25 min", kind: "practice",
              intro: "Confirm the concepts, then write a k6 test with a real threshold and interpret what it tells you.",
              quiz: [
                { q: "Why report p95 instead of the average response time?", options: ["It's a bigger number", "The average hides a slow tail; p95 shows what most users' worst experience really is", "Percentiles are required by k6"], answer: 1, why: "Averages can look healthy while a meaningful fraction of users suffer. p95/p99 expose the slow tail that the mean conceals." },
                { q: "What does a k6 <code>threshold</code> do?", options: ["Makes the test prettier", "Turns a performance target into an automatic pass/fail so it can gate CI", "Increases the number of users"], answer: 1, why: "Thresholds define pass/fail conditions (e.g. p95 under 500ms); if they're breached, k6 exits non-zero and CI fails — performance becomes an enforceable gate." },
                { q: "You want to find the point where the system breaks and how it fails. Which test?", options: ["Load test", "Stress test", "Soak test"], answer: 1, why: "A stress test pushes past expected capacity to find the breaking point and failure mode. Load is normal traffic; soak is long-duration to find leaks." }
              ],
              tasks: [
                { title: "Write a k6 test with a p95 threshold", prompt: "Install k6 and write a test that sends traffic to a public endpoint (e.g. <code>https://test.k6.io</code>) with 10 virtual users for 30s, a threshold of <b>p95 under 500ms</b>, and an error-rate threshold under 1%. Run it, then write one sentence interpreting the result as you would in a bug report. Reveal to compare.",
                  model: `
                    <pre class="cblock"><code>import http from 'k6/http';
