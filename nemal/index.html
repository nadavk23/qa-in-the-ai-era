<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נמל — ניטור עלות נחיתה ליבואן</title>
<meta name="description" content="אב-טיפוס להדגמה: מודל עלות נחיתה אמיתית ליחידה בשקלים, עם ניטור ומעקב אחרי הצעות ספקים.">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#16233A;      /* bill-of-lading navy */
  --kraft:#E8E0D2;    /* manila envelope */
  --stamp:#A8332B;    /* customs stamp red */
  --ledger:#2F6B4F;   /* ledger green */
  --carbon:#6B6F76;   /* carbon-copy grey */
  --paper:#FBF9F3;
  --white:#FFFFFF;
  --line:rgba(22,35,58,.14);
  --line-soft:rgba(22,35,58,.08);
  --ink-08:rgba(22,35,58,.06);
  --stamp-08:rgba(168,51,43,.08);
  --ledger-08:rgba(47,107,79,.10);
  --shadow:0 1px 2px rgba(22,35,58,.06), 0 8px 24px rgba(22,35,58,.08);
  --rail:264px;
  --sans:'IBM Plex Sans Hebrew', system-ui, 'Segoe UI', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--kraft);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:rgba(22,35,58,.18)}

/* ---------- demo banner ---------- */
.demo-banner{
  background:var(--ink);color:var(--kraft);
  font-size:12px;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:6px 16px;text-align:center;
}
.demo-banner b{color:var(--white);font-weight:600}
.demo-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--stamp);display:inline-block}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

/* right rail (RTL) */
.rail{
  background:var(--paper);
  border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line-soft)}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .mark{
  width:38px;height:38px;border-radius:9px;background:var(--ink);
  color:var(--kraft);display:grid;place-items:center;flex:none;
  font-weight:600;font-size:19px;position:relative;overflow:hidden;
}
.brand .mark svg{width:24px;height:24px}
.brand .name{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand .tag{font-size:11px;color:var(--carbon);margin-top:3px;letter-spacing:.01em}
.brand .ws{
  margin-top:14px;display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);
  font-size:12.5px;cursor:pointer;
}
.brand .ws .who{display:flex;align-items:center;gap:8px}
.brand .ws .av{width:22px;height:22px;border-radius:6px;background:var(--kraft);display:grid;place-items:center;font-size:11px;font-weight:600}
.brand .ws .chev{color:var(--carbon)}

.nav{padding:10px 12px;flex:1}
.nav .group-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--carbon);text-transform:uppercase;padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  padding:8px 10px;border-radius:8px;color:var(--ink);font-size:13.5px;font-weight:500;
  position:relative;
}
.nav a .ic{width:18px;height:18px;flex:none;color:var(--carbon)}
.nav a:hover{background:var(--ink-08)}
.nav a.active{background:var(--ink);color:var(--white)}
.nav a.active .ic{color:var(--kraft)}
.nav a .count{margin-inline-start:auto;font-size:11px;color:var(--carbon);font-family:var(--mono)}
.nav a.active .count{color:var(--kraft)}
.nav a .phase{
  margin-inline-start:auto;font-size:9.5px;font-weight:600;letter-spacing:.03em;
  padding:1.5px 6px;border-radius:100px;border:1px solid var(--line);color:var(--carbon);
}
.nav a.active .phase{border-color:rgba(232,224,210,.4);color:var(--kraft)}
.nav .alert-dot{margin-inline-start:auto;background:var(--stamp);color:#fff;font-size:11px;font-family:var(--mono);border-radius:100px;min-width:20px;height:18px;padding:0 6px;display:grid;place-items:center}

.rail-foot{padding:12px 16px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--carbon)}
.rail-foot .fx{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rail-foot .fx .num{color:var(--ink)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(232,224,210,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;gap:16px;
}
.topbar h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.topbar .crumb{font-size:12px;color:var(--carbon);margin-top:2px}
.topbar .sp{flex:1}
.topbar .search{
  display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;min-width:220px;color:var(--carbon);font-size:12.5px;
}
.topbar .search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:12.5px;width:100%;color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--white);
  color:var(--ink);padding:8px 13px;border-radius:8px;font-size:13px;font-weight:500;
}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.primary:hover{background:#0f1a2c}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--ink-08)}
.btn svg{width:16px;height:16px}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

.content{padding:24px 28px 64px;max-width:1240px;width:100%}

/* ---------- generic bits ---------- */
.section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.section-title h2{font-size:15px;font-weight:600;margin:0}
.section-title .hint{font-size:12px;color:var(--carbon)}
.section-title .sp{flex:1}

.phase-chip{
  font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:100px;
  border:1px solid var(--line);color:var(--carbon);background:var(--white);white-space:nowrap;
}
.phase-chip.p1{border-color:rgba(47,107,79,.4);color:var(--ledger);background:var(--ledger-08)}
.phase-chip.p2{border-color:rgba(22,35,58,.3);color:var(--ink);background:var(--ink-08)}
.phase-chip.p3{border-color:rgba(168,51,43,.35);color:var(--stamp);background:var(--stamp-08)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px}
.stat .lbl{font-size:11.5px;color:var(--carbon);font-weight:500;letter-spacing:.01em}
.stat .val{font-size:26px;font-weight:600;margin-top:6px;line-height:1}
.stat .sub{font-size:11.5px;color:var(--carbon);margin-top:7px;display:flex;align-items:center;gap:6px}
.delta{font-family:var(--mono);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--stamp)}
.delta.down{color:var(--ledger)}
.delta.flat{color:var(--carbon)}

/* tables */
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card + .card{margin-top:20px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:start;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--carbon);
  text-transform:uppercase;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper);
  white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--paper)}
td .sku-id{font-family:var(--mono);font-weight:500;font-size:12.5px}
td .desc{color:var(--carbon);font-size:12px;margin-top:2px}
.flag{font-size:14px;margin-inline-end:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:100px;border:1px solid var(--line);color:var(--carbon);white-space:nowrap;font-weight:500}
.pill.ok{color:var(--ledger);border-color:rgba(47,107,79,.35);background:var(--ledger-08)}
.pill.warn{color:var(--stamp);border-color:rgba(168,51,43,.3);background:var(--stamp-08)}
.pill.mono{font-family:var(--mono)}
.right{text-align:end}
.center{text-align:center}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.money .cur{color:var(--carbon);font-size:11px;margin-inline-start:2px}

/* mini bar for inline duty/composition */
.microbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--kraft);width:120px}
.microbar span{display:block;height:100%}

/* FX ticker row */
.fxrow{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.fxcard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 14px;flex:1;min-width:150px}
.fxcard .pair{font-size:11px;color:var(--carbon);font-weight:600;letter-spacing:.03em}
.fxcard .r{font-size:18px;font-weight:600;margin-top:3px;font-family:var(--mono)}
.fxcard .m{font-size:11px;margin-top:3px}
.fxcard .src{font-size:10px;color:var(--carbon);margin-top:6px}

/* ---------- slide over ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,35,58,.34);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s ease}
.overlay.open{opacity:1;pointer-events:auto}
.slideover{
  position:fixed;top:0;bottom:0;right:0;width:min(640px,94vw);background:var(--kraft);
  z-index:61;transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.slideover.open{transform:translateX(0)}
.so-head{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:flex-start;gap:14px}
.so-head .x{margin-inline-start:auto}
.so-head .t{font-size:12px;color:var(--carbon)}
.so-head h3{margin:2px 0 0;font-size:18px;font-weight:600}
.so-head .id{font-family:var(--mono);font-size:13px;color:var(--carbon);margin-top:3px}
.so-body{padding:22px;overflow:auto;flex:1}
.so-foot{padding:14px 22px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:10px}

/* ---------- waterfall (signature element) ---------- */
.waterfall-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px 20px 16px;margin-bottom:20px}
.waterfall-wrap .wf-title{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.waterfall-wrap .wf-title h4{margin:0;font-size:14px;font-weight:600}
.waterfall-wrap .wf-title .unit{font-size:12px;color:var(--carbon)}
.wf-total{font-size:30px;font-weight:600;font-family:var(--mono);letter-spacing:-.01em;margin:8px 0 2px}
.wf-total .cur{font-size:15px;color:var(--carbon);font-weight:500;margin-inline-end:3px}
.wf-move{font-size:12.5px;margin-bottom:16px;display:flex;align-items:center;gap:7px}

.wf-bar{position:relative;height:46px;border-radius:8px;overflow:hidden;display:flex;background:var(--kraft)}
.wf-seg{height:100%;position:relative;display:flex;align-items:center;justify-content:center;min-width:2px;transition:flex-basis .4s ease}
.wf-seg .lab{font-size:10.5px;font-weight:600;color:#fff;opacity:.95;white-space:nowrap;padding:0 4px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.seg-fob{background:var(--ink)}
.seg-freight{background:#3E6E8E}
.seg-duty{background:var(--stamp)}
.seg-fees{background:var(--carbon)}
/* ghost previous overlay */
.wf-ghost{position:relative;height:16px;margin-top:5px;display:flex}
.wf-ghost .gseg{height:100%;border-inline-end:1px solid rgba(22,35,58,.25)}
.wf-ghost .gwrap{position:relative;display:flex;border:1px dashed rgba(22,35,58,.35);border-radius:5px;overflow:hidden}
.wf-ghost .gseg.seg-fob{background:rgba(22,35,58,.22)}
.wf-ghost .gseg.seg-freight{background:rgba(62,110,142,.22)}
.wf-ghost .gseg.seg-duty{background:rgba(168,51,43,.22)}
.wf-ghost .gseg.seg-fees{background:rgba(107,111,118,.22)}
.wf-ghost-label{font-size:10px;color:var(--carbon);margin-top:4px}

.wf-legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:18px}
.wf-legend .li{display:flex;align-items:center;gap:8px;font-size:12px}
.wf-legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.wf-legend .li .v{font-family:var(--mono);font-weight:600;margin-inline-start:auto}
.wf-legend .li .p{color:var(--carbon);font-size:11px}

/* breakdown detail table */
.kv{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.kv td{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.kv td:first-child{color:var(--carbon)}
.kv td:last-child{text-align:end;font-family:var(--mono);font-weight:500}
.kv tr.total td{border-top:2px solid var(--line);border-bottom:0;font-weight:600;padding-top:12px}
.kv tr.total td:first-child{color:var(--ink);font-weight:600}
.kv tr.sub td:last-child{color:var(--carbon);font-weight:400}
.kv .neg{color:var(--ledger)}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.dbox{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.dbox .l{font-size:11px;color:var(--carbon);font-weight:500}
.dbox .v{font-size:15px;font-weight:600;margin-top:3px}
.dbox .v.mono{font-family:var(--mono)}
.dbox.hl{border-color:rgba(47,107,79,.4);background:var(--ledger-08)}
.dbox .note{font-size:11px;color:var(--carbon);margin-top:5px}

.snap-hist{margin-top:6px}
.snap-hist .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.snap-hist .row:last-child{border-bottom:0}
.snap-hist .row .d{color:var(--carbon);font-family:var(--mono);width:90px;flex:none}
.snap-hist .row .v{font-family:var(--mono);font-weight:600;width:72px}
.snap-hist .row .cause{color:var(--carbon);font-size:11.5px}

/* ---------- alerts ---------- */
.alert-item{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.alert-item:last-child{border-bottom:0}
.alert-item .ai-ic{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center}
.alert-item.sev-up .ai-ic{background:var(--stamp-08);color:var(--stamp)}
.alert-item.sev-down .ai-ic{background:var(--ledger-08);color:var(--ledger)}
.alert-item.sev-info .ai-ic{background:var(--ink-08);color:var(--ink)}
.alert-item .ai-body{flex:1;min-width:0}
.alert-item .ai-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.alert-item .ai-title{font-weight:600;font-size:13.5px}
.alert-item .ai-time{font-size:11px;color:var(--carbon);font-family:var(--mono);margin-inline-start:auto}
.alert-item .ai-msg{font-size:13px;color:var(--ink);margin-top:4px}
.alert-item .ai-attr{
  font-size:12px;margin-top:8px;padding:8px 11px;background:var(--paper);border:1px solid var(--line-soft);
  border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--carbon);
}
.alert-item .ai-attr b{color:var(--ink);font-weight:600}
.alert-item .ai-actions{display:flex;gap:8px;margin-top:10px}

/* rule cards */
.rule{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.rule:last-child{border-bottom:0}
.rule .rt{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--ink-08);white-space:nowrap}
.rule .rd{flex:1;font-size:13px}
.rule .rd .sub{color:var(--carbon);font-size:11.5px;margin-top:2px}
.toggle{width:38px;height:22px;border-radius:100px;background:var(--ledger);position:relative;border:0;flex:none}
.toggle.off{background:var(--carbon);opacity:.5}
.toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;inset-inline-end:3px;transition:inset-inline-end .16s}
.toggle.off::after{inset-inline-end:19px}

/* ---------- inbox (phase 3) ---------- */
.inbox-split{display:grid;grid-template-columns:320px 1fr;gap:0;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:460px}
.inbox-list{border-inline-end:1px solid var(--line);overflow:auto}
.inbox-fwd{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.inbox-fwd .l{font-size:11px;color:var(--carbon)}
.inbox-fwd .addr{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
.inbox-fwd .copy{margin-inline-start:auto;color:var(--carbon)}
.msg{padding:13px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;gap:11px}
.msg:hover{background:var(--paper)}
.msg.active{background:var(--ink-08)}
.msg .mav{width:30px;height:30px;border-radius:7px;background:var(--kraft);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.msg .mfrom{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.msg .msub{font-size:12px;color:var(--carbon);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .mtime{font-size:10.5px;color:var(--carbon);font-family:var(--mono);margin-inline-start:auto;flex:none}
.msg .status-dot{width:7px;height:7px;border-radius:50%;flex:none}
.msg .status-dot.new{background:var(--stamp)}
.msg .status-dot.done{background:var(--ledger)}

.parse{padding:20px 22px;overflow:auto}
.parse .pm-head{display:flex;align-items:flex-start;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.parse .pm-head .mav{width:40px;height:40px;font-size:15px}
.ai-banner{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--kraft);padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:18px}
.ai-banner .spark{color:#E8C77A}
.ai-banner b{color:#fff}
.cand{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px;background:var(--paper)}
.cand .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cand .ch .sku{font-family:var(--mono);font-weight:600;font-size:13px}
.cand .ch .conf{margin-inline-start:auto;font-size:11px;color:var(--carbon)}
.cand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.cand-grid .f{background:var(--white);border:1px solid var(--line-soft);border-radius:8px;padding:9px 10px}
.cand-grid .f .l{font-size:10.5px;color:var(--carbon)}
.cand-grid .f .v{font-family:var(--mono);font-weight:600;font-size:13px;margin-top:3px}
.cand-grid .f .v input{width:100%;border:0;background:transparent;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink);outline:none;border-bottom:1px dashed var(--line)}
.moq-tiers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.moq-tiers .tier{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--white)}
.moq-tiers .tier b{color:var(--ink)}
.cand-actions{display:flex;gap:9px}

/* ---------- forms / modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
.modal-wrap.open{display:flex}
.modal-bg{position:fixed;inset:0;background:rgba(22,35,58,.4)}
.modal{position:relative;background:var(--kraft);border-radius:14px;width:min(680px,100%);box-shadow:var(--shadow);overflow:hidden}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-head .x{margin-inline-start:auto}
.modal-body{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field .req{color:var(--stamp)}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13px;
  background:var(--white);color:var(--ink);outline:none;
}
.field input.num-in{font-family:var(--mono)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-08)}
.field .help{font-size:11px;color:var(--carbon)}
.incoterm-hint{grid-column:1/-1;font-size:12px;color:var(--carbon);background:var(--stamp-08);border:1px solid rgba(168,51,43,.2);border-radius:8px;padding:10px 12px;display:flex;gap:9px}
.incoterm-hint b{color:var(--stamp)}
.modal-foot{padding:15px 22px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:10px;justify-content:flex-end}
.disabled-field{opacity:.42;position:relative}
.disabled-field .lock{position:absolute;inset-inline-end:10px;top:32px;font-size:11px;color:var(--carbon)}

/* allocation basis */
.alloc-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.alloc-pick button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--carbon);font-weight:500}
.alloc-pick button.on{background:var(--ink);color:var(--white);border-color:var(--ink)}

/* empty state */
.empty{padding:48px 24px;text-align:center;color:var(--carbon)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:12px}
.empty h3{color:var(--ink);font-size:15px;margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:13px}

/* roadmap */
.road{display:grid;gap:16px}
.road .ph{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
.road .ph::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px}
.road .ph.p1::before{background:var(--ledger)}
.road .ph.p2::before{background:var(--ink)}
.road .ph.p3::before{background:var(--stamp)}
.road .ph .h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.road .ph .h h3{margin:0;font-size:16px;font-weight:600}
.road .ph .h .st{margin-inline-start:auto;font-size:11.5px;color:var(--carbon)}
.road .ph ul{margin:0;padding-inline-start:20px;font-size:13px;color:var(--ink)}
.road .ph ul li{margin:4px 0}
.road .ph ul li.done::marker{color:var(--ledger)}

.toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--white);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
[dir=rtl] .toast{transform:translateX(-50%)}
.toast.show{opacity:1;transform:translateX(50%) translateY(-4px)}
[dir=rtl] .toast.show{transform:translateX(-50%) translateY(-4px)}

/* responsive */
@media (max-width:1080px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .detail-grid,.cand-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  :root{--rail:0px}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset-inline-start:-300px;width:280px;z-index:80;transition:inset-inline-start .2s;box-shadow:var(--shadow)}
  [dir=rtl] .rail{inset-inline-start:auto;inset-inline-end:-300px;transition:inset-inline-end .2s}
  .rail.open{inset-inline-start:0}
  [dir=rtl] .rail.open{inset-inline-end:0}
  .menu-btn{display:inline-flex!important}
  .topbar{padding:12px 16px;gap:10px}
  .topbar .search{display:none}
  .topbar h1{font-size:17px}
  .topbar .crumb{display:none}
  #topAction{font-size:12px;padding:8px 11px}
  .content{padding:18px 16px 60px}
  .form-grid,.cand-grid{grid-template-columns:1fr}
  .inbox-split{grid-template-columns:1fr}
  .inbox-list{max-height:220px;border-inline-end:0;border-bottom:1px solid var(--line)}
}
.menu-btn{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

<script>
/* =======================================================================
   נמל — Landed Cost Monitor · working prototype
   Real landed-cost engine + localStorage persistence + live recompute.
   All money is stored as INTEGER minor units (cents / agorot). Rounding
   happens only at display time. FX is frozen into each snapshot.
   ======================================================================= */

/* ============================ ENGINE ============================
   Pure, side-effect-free. Extracted & unit-tested by engine.test.js
   (between the START/END markers below). Do not add DOM access here. */
// ===ENGINE START===
var NemalEngine = (function(){
  'use strict';
  // Which cost components an incoterm already bakes into the supplier price.
  // Getting this wrong double-counts freight — the likeliest correctness bug.
  var INCOTERM_INCLUDES = {
    EXW: {},                                              // ex-works: buyer pays everything onward
    FOB: {},                                              // free on board: intl freight/ins added by us
    CIF: { freight:true, insurance:true },               // cost+ins+freight already in price
    DDP: { freight:true, insurance:true, duty:true }     // delivered duty paid: almost all included
  };
  var r = Math.round;

  // i: all *Minor are integers in the SOURCE currency's minor unit.
  function computeLandedCost(i){
    var inc = INCOTERM_INCLUDES[i.incoterm] || {};
    var qty = i.qty|0;
    var fob = (i.unitPriceMinor|0) * qty;
    // incoterm guard: zero out anything already inside the supplier price
    var freight   = inc.freight   ? 0 : (i.freightMinor|0);
    var insurance = inc.insurance ? 0 : (i.insuranceMinor|0);
    var other     = (i.otherCostsMinor|0);
    var customsValue = fob + freight + insurance;         // CIF value for duty
    var dutyRate = i.hasFtaCert ? 0 : (+i.dutyRatePct||0);// valid origin cert -> 0%
    var duty  = inc.duty ? 0 : r(customsValue * dutyRate/100);
    var ptax  = r((customsValue + duty) * (+i.purchaseTaxRatePct||0)/100);
    var vatBase = customsValue + duty + ptax;
    var vat   = r(vatBase * (+i.vatRatePct||0)/100);      // recoverable — shown separately
    var includeVat = !!i.includeVatInBasis;               // default false for a registered dealer

    // exact integer partition of the total (source minor units)
    var fobPart     = fob;
    var freightPart = freight + insurance;
    var dutyPart    = duty + ptax;
    var feesPart    = other + (includeVat ? vat : 0);
    var totalMinor  = fobPart + freightPart + dutyPart + feesPart;

    var fx = +i.fxRateToIls;                              // ILS per 1 source unit
    // agorot = round(minorUnits * fx)   (1 cent * 3.718 -> 3.718 agorot)
    var seg = {
      fob:     r(fobPart * fx),
      freight: r(freightPart * fx),
      duty:    r(dutyPart * fx),
      fees:    r(feesPart * fx)
    };
    var landedAgorot = seg.fob + seg.freight + seg.duty + seg.fees; // bar sums exactly
    return {
      currency: i.currency,
      qty: qty,
      customsValueMinor: customsValue,
      dutyMinor: duty, dutyRateApplied: dutyRate,
      purchaseTaxMinor: ptax,
      vatMinor: vat, vatIncludedInBasis: includeVat,
      vatAgorot: r(vat * fx),
      totalMinor: totalMinor,
      seg: seg,
      landedAgorot: landedAgorot,
      landedPerUnitAgorot: qty>0 ? landedAgorot/qty : 0,  // not rounded; round at display
      fxRateToIls: fx
    };
  }

  // Largest-remainder allocation: integer shares that sum EXACTLY to total.
  function allocate(totalMinor, weights){
    var sum = weights.reduce(function(a,b){return a+b;},0);
    if(sum<=0) return weights.map(function(){return 0;});
    var raw = weights.map(function(w){return totalMinor*w/sum;});
    var out = raw.map(Math.floor);
    var used = out.reduce(function(a,b){return a+b;},0);
    var rem = totalMinor - used;
    var order = raw.map(function(v,idx){return {idx:idx, frac:v-Math.floor(v)};})
                   .sort(function(a,b){return b.frac-a.frac;});
    for(var k=0;k<rem;k++) out[order[k%order.length].idx]++;
    return out;
  }
  function allocateBy(totalMinor, lines, basis){
    var key = basis==='weight'?'weightG':basis==='value'?'valueMinor':'cbmMilli';
    return allocate(totalMinor, lines.map(function(l){return l[key]||0;}));
  }

  function deltaPct(cur, prev){ return prev>0 ? (cur-prev)/prev*100 : 0; }

  // Attribution: state which INPUT moved. Detects uniform scaling (FX/qty)
  // vs a single-segment outlier (price / freight / duty / fees).
  function attribute(cur, prev){
    if(!prev || prev.landedAgorot===0) return {driver:'new'};
    var keys=['fob','freight','duty','fees'];
    var best={k:null,contrib:0};
    keys.forEach(function(k){
      var c=(cur.seg[k]||0)-(prev.seg[k]||0);
      if(Math.abs(c)>Math.abs(best.contrib)) best={k:k,contrib:c};
    });
    if(best.contrib===0) return {driver:'flat', seg:null, contrib:0};
    var ratios=keys.filter(function(k){return prev.seg[k]>0 && cur.seg[k]>0;})
                   .map(function(k){return cur.seg[k]/prev.seg[k];});
    var uniform = ratios.length>=2 && (Math.max.apply(null,ratios)-Math.min.apply(null,ratios) < 0.01);
    var fxMoved = Math.abs((cur.fxRateToIls||0)-(prev.fxRateToIls||0))>1e-9;
    if(uniform && fxMoved) return {driver:'fx', seg:'fob', contrib: cur.landedAgorot-prev.landedAgorot};
    var map={fob:'price', freight:'freight', duty:'duty', fees:'fees'};
    return {driver: map[best.k]||'price', seg:best.k, contrib:best.contrib};
  }

  var api={ computeLandedCost:computeLandedCost, allocate:allocate, allocateBy:allocateBy,
            deltaPct:deltaPct, attribute:attribute, INCOTERM_INCLUDES:INCOTERM_INCLUDES };
  if(typeof module!=='undefined' && module.exports) module.exports=api;
  return api;
})();
// ===ENGINE END===

/* ============================ DERIVE / COMPUTE ============================ */
function supById(id){ return db.suppliers.find(function(s){return s.id===id;})||{}; }
function supName(id){ return (supById(id).name)||id; }
function skuById(id){ return db.skus.find(function(s){return s.id===id;}); }
function shipmentForSku(id){ return db.shipments.find(function(sh){ return sh.lines.some(function(l){return l.sku===id;}); }); }

// allocate every shipment cost across its lines by the chosen basis
function shipmentAllocation(sh){
  var other = sh.brokerMinor+sh.portMinor+sh.inlandMinor+sh.bankMinor+sh.certMinor;
  var freight = NemalEngine.allocateBy(sh.freightMinor, sh.lines, sh.basis);
  var ins     = NemalEngine.allocateBy(sh.insMinor,     sh.lines, sh.basis);
  var oth     = NemalEngine.allocateBy(other,           sh.lines, sh.basis);
  var map={};
  sh.lines.forEach(function(l,idx){ map[l.sku]={freight:freight[idx], ins:ins[idx], other:oth[idx]}; });
  return map;
}

// build engine inputs for a SKU from its data + shipment allocation + settings
function skuInputs(sku, patch){
  var sh=shipmentForSku(sku.id);
  var f=0,ins=0,oth=0;
  if(sh){ var a=shipmentAllocation(sh)[sku.id]; if(a){ f=a.freight; ins=a.ins; oth=a.other; } }
  var inp={
    unitPriceMinor: sku.unitPriceMinor, currency: sku.cur, qty: sku.qty,
    incoterm: sku.incoterm, dutyRatePct: sku.dutyRatePct, purchaseTaxRatePct: sku.ptaxRatePct||0,
    hasFtaCert: !!sku.hasFta, vatRatePct: db.settings.vatRatePct,
    includeVatInBasis: db.settings.includeVatInBasis,
    freightMinor: f, insuranceMinor: ins, otherCostsMinor: oth,
    fxRateToIls: db.settings.fx[sku.cur]
  };
  if(patch){
    if(patch.hasFta!==undefined) inp.hasFtaCert=patch.hasFta;
    if(patch.fxRateToIls!==undefined) inp.fxRateToIls=patch.fxRateToIls;
    if(patch.freightScale!==undefined) inp.freightMinor=Math.round(inp.freightMinor*patch.freightScale);
    if(patch.insScale!==undefined) inp.insuranceMinor=Math.round(inp.insuranceMinor*patch.insScale);
    if(patch.unitPriceMinor!==undefined) inp.unitPriceMinor=patch.unitPriceMinor;
  }
  return inp;
}
function snap(sku){ return NemalEngine.computeLandedCost(skuInputs(sku)); }
function prevSnap(sku){
  if(sku.ack) return sku.ack;                              // user-acknowledged baseline wins
  return NemalEngine.computeLandedCost(skuInputs(sku, sku.prev||{}));
}

/* ============================ ALERTS (derived live) ============================ */
function relThreshold(){ return 5; }
function buildAlerts(){
  var out=[];
  db.skus.forEach(function(sku){
    var cur=snap(sku), prev=prevSnap(sku);
    var d=NemalEngine.deltaPct(cur.landedPerUnitAgorot, prev.landedPerUnitAgorot);
    var attr=NemalEngine.attribute(cur,prev);
    if(Math.abs(d)>=1.5){
      out.push({
        sev: d>0?'up':'down', sku:sku.id, deltaPct:d, cur:cur, prev:prev, attr:attr,
        title:(d>0?'עלות נחיתה עלתה ':'עלות נחיתה ירדה ')+Math.abs(d).toFixed(1)+'%',
        msg: skuShort(sku)+': '+ils(prev.landedPerUnitAgorot)+' → '+ils(cur.landedPerUnitAgorot)+' ליחידה.',
        attrHtml: attributionText(sku,cur,prev,attr),
        rule: Math.abs(d)>=5?'יחסי · מעל 5%':'יחסי · מעל 1.5%'
      });
    }
  });
  // quote-expiry alerts (within 7 days)
  db.quotes.forEach(function(q){
    var days=daysUntil(q.until);
    if(days>=0 && days<=7){
      var sku=skuById(q.sku);
      out.push({sev:'info', sku:q.sku, title:'הצעת מחיר פגה בעוד '+days+' ימים',
        msg:'ההצעה של '+supName(sku?sku.supplier:'')+' ל'+(sku?sku.desc:q.sku)+' תפוג ב־'+isoToIl(q.until)+'.',
        attrHtml:'המניע: <b>תוקף הצעה</b>. בקשו חידוש לפני שהמחיר משתנה.', rule:'תפוגת הצעה · 7 ימים'});
    }
  });
  // stable order: rising first, then falling, then info
  var rank={up:0,down:1,info:2};
  out.sort(function(a,b){ return (rank[a.sev]-rank[b.sev]) || (Math.abs(b.deltaPct||0)-Math.abs(a.deltaPct||0)); });
  return out;
}
function attributionText(sku,cur,prev,attr){
  if(attr.driver==='fx'){
    return 'המניע: <b>'+sku.cur+'/ILS</b> נע מ־'+fmt(prev.fxRateToIls,4)+' ל־'+fmt(cur.fxRateToIls,4)+'. מחיר הספק לא השתנה.';
  }
  if(attr.driver==='freight'){
    var dp=NemalEngine.deltaPct(cur.seg.freight, prev.seg.freight);
    return 'המניע: <b>עלות שינוע</b> '+(dp>0?'עלתה ':'ירדה ')+Math.abs(dp).toFixed(0)+'%. מחיר הספק והמכס ללא שינוי.';
  }
  if(attr.driver==='duty'){
    if(cur.dutyMinor===0 && prev.dutyMinor>0)
      return 'המניע: <b>תעודת מקור (FTA)</b> אושרה — מכס ירד מ־'+sku.dutyRatePct+'% ל־0%. חיסכון של '+ils((prev.seg.duty-cur.seg.duty)/cur.qty)+' ליחידה.';
    return 'המניע: <b>שיעור המכס</b> השתנה.';
  }
  if(attr.driver==='price'){
    return 'המניע: <b>מחיר הספק</b> השתנה מ־'+(prev.seg.fob/prev.qty/prev.fxRateToIls/100).toFixed(2)+' ל־'+(cur.seg.fob/cur.qty/cur.fxRateToIls/100).toFixed(2)+' '+sku.cur+' ליחידה.';
  }
  return 'המניע: עמלות ואגרות.';
}

/* ============================ FORMAT HELPERS ============================ */
function fmt(n,d){ d=(d===undefined?2:d); return Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function ils(agorot,d){ return '₪'+fmt(agorot/100, d===undefined?2:d); }             // agorot -> ₪
function cur2(minor){ return fmt(minor/100,2); }                                     // source minor -> x.xx
function pctTxt(n,d){ d=(d===undefined?1:d); return (n>0?'+':'')+fmt(n,d)+'%'; }
function skuShort(sku){ return sku.desc.split(',')[0]; }
function isoToIl(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function daysUntil(d){ var t=new Date(d+'T00:00:00'), now=new Date('2026-08-04T00:00:00'); return Math.round((t-now)/86400000); }

  var order=['fob','freight','duty','fees'];

    var w=c.seg[k]/c.landedAgorot*100; if(w<0.5) return '';
    return '<div class="wf-seg seg-'+k+'" style="flex-basis:'+w+'%" title="'+segLabels[k]+': '+ils(c.seg[k]/c.qty)+'">'+(w>11?'<span class="lab">'+segLabels[k].split(' ')[0]+'</span>':'')+'</div>';
  }).join('');
  var ghostHtml=order.map(function(k){ var w=p.seg[k]/p.landedAgorot*100; if(w<0.5) return ''; return '<div class="gseg seg-'+k+'" style="width:'+w+'%"></div>'; }).join('');
  var ghostWidth=prevTotal/total*100;
  var legendHtml=order.map(function(k){ return '<div class="li"><span class="sw" style="background:'+segColors[k]+'"></span><span>'+segLabels[k]+'</span><span class="v">'+ils(c.seg[k]/c.qty)+'</span><span class="p">('+(c.seg[k]/c.landedAgorot*100).toFixed(0)+'%)</span></div>'; }).join('');
  var margin=(s.sellPriceAgorot-total)/s.sellPriceAgorot*100;
  var vatPerUnit=c.vatAgorot/c.qty;

  var so=document.getElementById('slideover');
  so.innerHTML=''
    +'<div class="so-head"><div><div class="t">פירוק עלות נחיתה · פריט</div><h3>'+s.desc+'</h3><div class="id">'+s.id+' · פרט מכס '+s.hs+'</div></div>'
    +'<button class="btn ghost x" onclick="closeSlide()" aria-label="סגור"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'

    +'<div class="waterfall-wrap"><div class="wf-title"><h4>מפל עלות נחיתה</h4><span class="unit">ליחידה · שקלים</span></div>'
    +'<div class="wf-total"><span class="cur">₪</span>'+fmt(total/100)+'</div>'
    +'<div class="wf-move"><span class="delta '+moveCls+'">'+moveArw+' '+pctTxt(d)+'</span><span style="color:var(--carbon)">מהסנכרון האחרון · '+(s.story||'')+'</span></div>'
    +'<div class="wf-bar">'+segHtml+'</div>'
    +'<div class="wf-ghost"><div class="gwrap" style="width:'+ghostWidth+'%">'+ghostHtml+'</div></div>'
    +'<div class="wf-ghost-label">▓ קו מקווקו = סנכרון קודם ('+ils(prevTotal)+'). ההפרש הוא התזוזה, בלי לקרוא מספרים.</div>'
    +'<div class="wf-legend">'+legendHtml+'</div></div>'
    +'<div class="detail-grid">'
      +'<div class="dbox"><div class="l">Incoterm</div><div class="v">'+s.incoterm+'</div><div class="note">קובע אילו עלויות כבר בתוך מחיר הספק</div></div>'
      +'<div class="dbox '+(s.hasFta?'hl':'')+'"><div class="l">תעודת מקור (FTA)</div><div class="v">'+(s.hasFta?'✔ קיימת · מכס 0%':'✗ אין')+'</div><div class="note">'+(s.hasFta?'מזיז עלות יותר מכל מו״מ על מחיר':'מכס '+s.dutyRatePct+'% חל')+'</div></div>'
      +'<div class="dbox"><div class="l">מחיר ספק ('+s.incoterm+')</div><div class="v mono">'+cur2(s.unitPriceMinor)+' '+s.cur+'</div><div class="note">כמות: '+s.qty.toLocaleString()+' יח׳</div></div>'
      +'<div class="dbox"><div class="l">מרווח מול מחיר מכירה</div><div class="v mono" style="color:'+(margin<45?'var(--stamp)':'var(--ledger)')+'">'+margin.toFixed(0)+'%</div><div class="note">מכירה '+ils(s.sellPriceAgorot)+' · נחיתה '+ils(total)+'</div></div>'
    +'</div>'
    +'<div class="card" style="padding:16px 18px;margin-bottom:20px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">פירוק מספרי · ליחידה</div>'
    +'<table class="kv">'
      +'<tr><td>מחיר ספק ('+s.incoterm+')</td><td>'+ils(c.seg.fob/c.qty)+'</td></tr>'
      +'<tr><td>שינוע + ביטוח (מוקצה)</td><td>'+(c.seg.freight>0?ils(c.seg.freight/c.qty):'<span class="neg">כלול ב־Incoterm</span>')+'</td></tr>'
      +'<tr class="sub"><td>ערך לצורכי מכס (CIF)</td><td>'+ils((c.seg.fob+c.seg.freight)/c.qty)+'</td></tr>'
      +'<tr><td>מכס ('+(s.hasFta&&s.dutyRatePct>0?'0% · FTA, במקום '+s.dutyRatePct+'%':s.dutyRatePct+'%')+')</td><td>'+(c.dutyMinor>0?ils(NemalEngine.computeLandedCost(skuInputs(s)).seg.duty/c.qty):'<span class="neg">₪0.00</span>')+'</td></tr>'
      +'<tr><td>מס קנייה ('+(s.ptaxRatePct||0)+'%)</td><td>₪0.00</td></tr>'
      +'<tr><td>עמלות ואגרות (עמיל, נמל, הובלה, בנק)</td><td>'+ils(c.seg.fees/c.qty)+'</td></tr>'
      +'<tr class="total"><td>עלות נחיתה ליחידה</td><td>'+ils(total)+'</td></tr>'
      +'<tr class="sub"><td>מע״מ ('+db.settings.vatRatePct+'%) — '+(db.settings.includeVatInBasis?'כלול בבסיס':'מקוזז, מוצג בנפרד')+'</td><td>'+ils(vatPerUnit)+'</td></tr>'
    +'</table>'
    +'<div style="font-size:11px;color:var(--carbon);margin-top:10px;display:flex;gap:7px;align-items:flex-start"><span style="color:var(--ink)">ⓘ</span><span>'
      +(db.settings.includeVatInBasis?'מע״מ כלול בבסיס העלות (לפי הגדרה). ':'מע״מ אינו נכלל בבסיס (עוסק מורשה מקזז אותו). מוצג רק כשורת תזרים. ')
      +'שער יציג '+s.cur+'/ILS = '+fmt(c.fxRateToIls,4)+'.</span></div></div>'
    +'<div class="card" style="padding:16px 18px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">היסטוריית סנכרונים (Snapshots)</div><div class="snap-hist">'
      +'<div class="row"><span class="d">היום</span><span class="v">'+ils(total)+'</span><span class="delta '+moveCls+'">'+moveArw+pctTxt(d)+'</span><span class="cause">'+(s.story||'')+'</span></div>'
      +'<div class="row"><span class="d">בסיס אחרון</span><span class="v">'+ils(prevTotal)+'</span><span class="delta flat">—</span><span class="cause">'+(s.ack?'אושר על ידך':'סנכרון מאושר אחרון')+'</span></div>'
      +'<div class="row"><span class="d">קודם</span><span class="v">'+ils(prevTotal*0.985)+'</span><span class="delta down">▼'+pctTxt(-1.5)+'</span><span class="cause">קלטים קפואים — לא מחושב מחדש</span></div>'
    +'</div><div style="font-size:11px;color:var(--carbon);margin-top:10px">כל סנכרון קופא עם הקלטים שהיו באותו רגע. היסטוריה אף פעם לא מחושבת מחדש עם שער היום.</div></div>'
    +'</div>'
    +'<div class="so-foot"><button class="btn primary" onclick="openQuoteModal(\''+s.id+'\')">הצעת מחיר חדשה לפריט</button>'

}
function closeSlide(){ var so=document.getElementById('slideover'); so.classList.remove('open'); so.setAttribute('aria-hidden','true'); document.getElementById('overlay').classList.remove('open'); }

/* ============================ QUOTE MODAL (functional) ============================ */
function openQuoteModal(prefill){
  var s=prefill?skuById(prefill):null;
  var m=document.getElementById('modal');
  m.innerHTML=''
    +'<div class="modal-bg" onclick="closeModal()"></div><div class="modal">'
    +'<div class="modal-head"><h3>הצעת מחיר חדשה — הזנה ידנית</h3><button class="btn ghost x" onclick="closeModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="modal-body"><div class="form-grid">'
      +'<div class="field"><label>פריט <span class="req">*</span></label><select id="q_sku">'
        +db.skus.map(function(x){return '<option value="'+x.id+'"'+(s&&s.id===x.id?' selected':'')+'>'+x.id+' · '+x.desc+'</option>';}).join('')+'</select></div>'
      +'<div class="field"><label>מחיר יחידה <span class="req">*</span></label><input id="q_price" class="num-in" placeholder="0.00" value="'+(s?cur2(s.unitPriceMinor):'')+'"></div>'
      +'<div class="field"><label>מטבע <span class="req">*</span></label><select id="q_cur"><option'+(s&&s.cur==='USD'?' selected':'')+'>USD</option><option'+(s&&s.cur==='EUR'?' selected':'')+'>EUR</option><option'+(s&&s.cur==='CNY'?' selected':'')+'>CNY</option><option>ILS</option></select></div>'
      +'<div class="field"><label>Incoterm <span class="req">*</span></label><select id="q_incoterm" onchange="incotermHint()"><option'+(s&&s.incoterm==='EXW'?' selected':'')+'>EXW</option><option'+(s&&s.incoterm==='FOB'?' selected':'')+'>FOB</option><option'+(s&&s.incoterm==='CIF'?' selected':'')+'>CIF</option><option>DDP</option></select></div>'
      +'<div class="field"><label>כמות מינימלית (MOQ)</label><input id="q_moq" class="num-in" placeholder="0" value="'+(s?s.moq:'')+'"></div>'
      +'<div class="field"><label>בתוקף עד</label><input id="q_until" type="date" value="'+(s?s.validUntil:'2026-09-30')+'"></div>'
      +'<div class="incoterm-hint" id="incotermHint"><span>ℹ️</span><div id="incotermHintText"></div></div>'
      +'<div class="field full"><label>מסמך מקור (אופציונלי)</label><input type="text" placeholder="גררו PDF / צילום WhatsApp, או השאירו ריק"><span class="help">נשמר כ־raw_document_ref — אפשר לחזור אליו תמיד</span></div>'
    +'</div></div>'
    +'<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn primary" onclick="submitQuote()">שמור הצעה</button></div></div>';
  m.classList.add('open'); incotermHint();
}
function incotermHint(){
  var el=document.getElementById('q_incoterm'); if(!el) return;
  var map={ EXW:'EXW — כל העלויות מהמפעל ומעלה עליכם. הזינו שינוע, ביטוח ואגרות בנפרד.',
    FOB:'FOB — הספק כיסה עד הנמל במקור. הזינו שינוע ימי, ביטוח ואגרות יעד.',
    CIF:'CIF — שינוע וביטוח כבר בתוך מחיר הספק. המנוע לא יספור אותם שוב.',
    DDP:'DDP — המחיר כולל הכל עד דלתכם, כולל מכס. כמעט אין עלויות נוספות.' };
  document.getElementById('incotermHintText').textContent=map[el.value]||'';
}
function submitQuote(){
  var id=document.getElementById('q_sku').value;
  var price=parseFloat(document.getElementById('q_price').value);
  if(!(price>0)){ toast('הזינו מחיר יחידה תקין'); return; }
  var cur=document.getElementById('q_cur').value;
  var incoterm=document.getElementById('q_incoterm').value;
  var moq=parseInt(document.getElementById('q_moq').value,10)||0;
  var until=document.getElementById('q_until').value||'2026-09-30';
  applyQuote(id, Math.round(price*100), cur, incoterm, moq, until, 'ידני', 'quote_manual.pdf');
  closeModal(); toast('הצעת מחיר נשמרה — עלות הנחיתה חושבה מחדש'); go('skus'); openSku(id);
}
// core mutation: record quote, set it active on the SKU, freeze old snapshot as baseline
function applyQuote(id, priceMinor, cur, incoterm, moq, until, src, doc){
  var s=skuById(id); if(!s) return;
  s.ack=snap(s);                                        // freeze pre-change cost as the comparison baseline
  s.prev=null;                                          // switch movement source to the acknowledged baseline
  s.unitPriceMinor=priceMinor; s.cur=cur; s.incoterm=incoterm; if(moq) s.moq=moq; s.validUntil=until;
  s.story='הצעת מחיר חדשה נקלטה';
  db.quotes.unshift({sku:id, priceMinor:priceMinor, cur:cur, incoterm:incoterm, moq:moq||s.moq, from:'2026-08-04', until:until, src:src, doc:doc});
  saveDb();
}

    +'<div class="modal-bg" onclick="closeModal()"></div><div class="modal">'
    +'<div class="modal-head"><h3>ספק חדש</h3><button class="btn ghost x" onclick="closeModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="modal-body"><div class="form-grid">'
      +'<div class="field full"><label>שם הספק <span class="req">*</span></label><input id="s_name" placeholder="לדוגמה: Shenzhen Bright Co."></div>'
      +'<div class="field"><label>מדינה</label><input id="s_country" placeholder="סין"></div>'
      +'<div class="field"><label>ברירת מחדל · Incoterm</label><select id="s_incoterm"><option>FOB</option><option>EXW</option><option>CIF</option><option>DDP</option></select></div>'
      +'<div class="field"><label>ברירת מחדל · מטבע</label><select id="s_cur"><option>USD</option><option>EUR</option><option>CNY</option><option>ILS</option></select></div>'
      +'<div class="field"><label>איש קשר</label><input id="s_contact" placeholder="שם · אימייל / WhatsApp"></div>'
    +'</div></div>'
    +'<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn primary" onclick="submitSupplier()">שמור ספק</button></div></div>';

}
function submitSupplier(){
  var name=document.getElementById('s_name').value.trim();
  if(!name){ toast('הזינו שם ספק'); return; }
  var n=db.suppliers.length+1;
  db.suppliers.push({ id:'S-'+(n<10?'0':'')+n, name:name, flag:'🏳️',
    country:document.getElementById('s_country').value||'—',
    incoterm:document.getElementById('s_incoterm').value, cur:document.getElementById('s_cur').value,
    contact:document.getElementById('s_contact').value||'—' });
  saveDb(); closeModal(); toast('הספק נוסף'); render('suppliers');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

/* ============================ SETTINGS MODAL (functional) ============================ */
function openSettings(){
  var m=document.getElementById('modal');
  var f=db.settings.fx;
  m.innerHTML=''
    +'<div class="modal-bg" onclick="closeModal()"></div><div class="modal">'
    +'<div class="modal-head"><h3>הגדרות סביבת עבודה</h3><button class="btn ghost x" onclick="closeModal()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="modal-body">'
      +'<div style="font-size:13px;font-weight:600;margin-bottom:10px">שערים יציגים (ILS ל־1)</div>'
      +'<div class="form-grid">'
        +'<div class="field"><label>USD / ILS</label><input id="fx_USD" class="num-in" value="'+f.USD+'"></div>'
        +'<div class="field"><label>EUR / ILS</label><input id="fx_EUR" class="num-in" value="'+f.EUR+'"></div>'
        +'<div class="field"><label>CNY / ILS</label><input id="fx_CNY" class="num-in" value="'+f.CNY+'"></div>'
        +'<div class="field"><label>TRY / ILS</label><input id="fx_TRY" class="num-in" value="'+f.TRY+'"></div>'
      +'</div>'
      +'<div style="margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px">'
        +'<div style="flex:1"><div style="font-size:13px;font-weight:600">כלול מע״מ בבסיס העלות</div><div style="font-size:11.5px;color:var(--carbon);margin-top:2px">עוסק מורשה מקזז מע״מ — ברירת המחדל כבויה. הפעלה תנפח עלות ותשנה התראות.</div></div>'
        +'<button id="vatToggle" class="toggle '+(db.settings.includeVatInBasis?'':'off')+'" onclick="this.classList.toggle(\'off\')" aria-label="כלול מע״מ"></button></div>'
      +'<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><div style="font-size:12px;color:var(--carbon);margin-bottom:8px">סימולציה מהירה (לבדיקת ייחוס גורם):</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="bumpFx(\'USD\',1.02)">USD +2%</button><button class="btn sm" onclick="bumpFx(\'USD\',0.98)">USD −2%</button><button class="btn sm" onclick="bumpFx(\'EUR\',1.02)">EUR +2%</button></div></div>'
    +'</div>'
    +'<div class="modal-foot"><button class="btn ghost" onclick="resetDemo();closeModal()">אפס לדוגמה</button><div style="flex:1"></div><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn primary" onclick="saveSettings()">שמור</button></div></div>';
  m.classList.add('open');
}
// freeze current cost as each SKU's comparison baseline, at the CURRENT settings,
// before a rate/VAT change — so the resulting move is attributed to what changed.
function freezeBaselines(story){ db.skus.forEach(function(s){ s.ack=snap(s); s.prev=null; if(story) s.story=story; }); }
function saveSettings(){
  var newFx={}; ['USD','EUR','CNY','TRY'].forEach(function(k){ var v=parseFloat(document.getElementById('fx_'+k).value); newFx[k]=(v>0?v:db.settings.fx[k]); });
  var newVat=!document.getElementById('vatToggle').classList.contains('off');
  var changed = newVat!==db.settings.includeVatInBasis || ['USD','EUR','CNY','TRY'].some(function(k){return newFx[k]!==db.settings.fx[k];});
  if(changed) freezeBaselines('עדכון הגדרות סביבה');
  db.settings.fx=newFx; db.settings.includeVatInBasis=newVat;
  saveDb(); closeModal(); toast('ההגדרות נשמרו — הכל חושב מחדש'); render(currentView);
}
function bumpFx(cur,factor){
  freezeBaselines('סימולציית שער '+cur);                 // baseline at the pre-bump rate
  db.settings.fx[cur]=Math.round(db.settings.fx[cur]*factor*10000)/10000; saveDb();
  var el=document.getElementById('fx_'+cur); if(el) el.value=db.settings.fx[cur];
  syncRailFx(); render(currentView);
  toast(cur+'/ILS עודכן ל־'+fmt(db.settings.fx[cur],4)+' — פתחו התראות לראות את הייחוס');
}

/* ============================ UTIL / BOOT ============================ */
var toastT;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2400); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeSlide(); closeModal(); } });
window.addEventListener('hashchange',function(){ render(location.hash.replace('#','')); });

loadDb();
render(location.hash.replace('#','')||'dashboard');

</script>
